l banks are open for regular business in Bengaluru, India, or London, England.\n\n1.1.5 Confidential Information means any and all proprietary, non-public, or sensitive information, whether technical, business, financial, operational, or legal, in whatever form recorded or communicated (including oral, visual, written, electronic, magnetic, or digital formats), disclosed by or on behalf of Vedanta to Halyard, or otherwise obtained or accessed by Halyard in connection with the Business Purpose, whether disclosed prior to, on, or after the Effective Date. Confidential Information includes, without limitation:\n1.1.5.1 all software, computer programs, source code, object code, APIs, technical architectures, database schemas, scripts, algorithms, data models, formats, interfaces, and development tools;\n1.1.5.2 all operational data, customer lists, vendor details, pricing models, margin sheets, cost breakdowns, financial forecasts, billing records, strategic plans, and product roadmaps;\n1.1.5.3 all employee profiles, contractor records, personal identification data, performance appraisals, compensation details, and candidate CVs supplied in connection with prospective resource allocation or project staffing;\n1.1.5.4 all research notes, inventions, ideas, discoveries, processes, know-how, designs, drawings, trade secrets, techniques, and specifications; and\n1.1.5.5 all analyses, compilations, extracts, summaries, notes, working papers, or derivative works prepared by Halyard or its Representatives that contain, reflect, or are generated from any such information.\n\n1.1.6 Disclosing Party means the Party disclosing Confidential Information under this Agreement.\n\n1.1.7 Receiving Party means the Party receiving Confidential Information under this Agreement.\n\n1.1.8 Representatives means the directors, officers, employees, legal advisers, accountants, and consultants of a Party and of its Affiliates who have a legitimate need to access Confidential Information for the Business Purpose.\n\nSCOPE AND NATURE OF CONFIDENTIALITY OBLIGATIONS\n\n2.1 Halyard acknowledges and agrees that the Confidential Information disclosed to it contains valuable business assets and trade secrets of Vedanta. Accordingly, Halyard undertakes to:\n2.1.1 hold and maintain the Confidential Information in strict confidence, exercising at least the same degree of care that it uses to protect its own confidential information of like importance, and in no event less than a reasonable standard of care;\n2.1.2 restrict the disclosure of Confidential Information solely to those of its Representatives who strictly need to know such information for the furtherance of the Business Purpose;\n2.1.3 ensure that each such Representative is informed of the confidential nature of the Confidential Information and is bound by confidentiality commitments substantially similar to those set out herein;\n2.1.4 not use, exploit, copy, reproduce, reverse engineer, decompile, disassemble, or derive source code from any Confidential Information, in whole or in part, for any purpose other than the direct evaluation and execution of the Business Purpose; and\n2.1.5 refrain from disclosing, publishing, communicating, or transferring any Confidential Information to any third party without the express prior written consent of Vedanta.\n\n2.2 Halyard shall remain responsible and liable for any breach of this Agreement caused by any act, omission, or default of its Representatives to the same extent as if such act or omission had been committed by Halyard itself.\n\n2.3 Halyard shall immediately notify Vedanta in writing upon becoming aware of any actual, suspected, or threatened unauthorised disclosure, loss, compromise, or misappropriation of any Confidential Information, and shall cooperate fully with Vedanta at Halyard's expense to mitigate and remediate any harm arising therefrom.\n\nEXCLUSIONS FROM CONFIDENTIALITY\n\n3.1 The obligations of confidentiality and non-use set forth in Clause 2 shall not apply to any information that Halyard can clearly demonstrate by contemporaneous written evidence:\n3.1.1 was already in the public domain at the time of its disclosure to Halyard, or subsequently entered the public domain through no fault, act, or omission of Halyard or its Representatives;\n3.1.2 was already lawfully known to Halyard, without any confidentiality obligation or restriction on disclosure, prior to receiving it from Vedanta;\n3.1.3 was independently developed by Halyard's personnel without any access to, reliance upon, or reference to the Confidential Information of Vedanta; or\n3.1.4 is disclosed by Halyard with the prior written authorisation of an executive officer of Vedanta.\n\nCOMPELLED AND LEGAL DISCLOSURES\n\n4.1 If Halyard or any of its Representatives is requested or required by applicable law, court order, or summons issued by a regulatory body or stock exchange of competent jurisdiction to disclose any Confidential Information, Halyard shall:\n4.1.1 to the extent permitted by law, provide Vedanta with prompt written notice within three (3) Business Days of receiving such request or demand, so that Vedanta may seek an appropriate protective order, injunctive relief, or other appropriate remedy;\n4.1.2 provide reasonable cooperation and assistance to Vedanta, at Vedanta's reasonable expense, in opposing, narrowing, or seeking confidential treatment for such disclosure; and\n4.1.3 if disclosure remains legally mandatory, disclose only that portion of the Confidential Information that is strictly required to satisfy such legal requirement, and use all reasonable endeavours to secure confidential handling of the disclosed information by the relevant authority.\n\nINTELLECTUAL PROPERTY AND PROPRIETARY RIGHTS\n\n5.1 Nothing contained in this Agreement shall be construed, by implication, estoppel, or otherwise, as granting, conveying, or conferring upon Halyard any licence, title, ownership, copyright, patent right, trademark, or any other intellectual property right in or to any Confidential Information of Vedanta.\n\n5.2 All Confidential Information, including all copies, extracts, adaptations, and derivative works thereof, shall remain the sole and exclusive property of Vedanta or its licensors.\n\nRETURN OR DESTRUCTION OF CONFIDENTIAL INFORMATION\n\n6.1 Upon the written request of Vedanta, or automatically upon the termination or expiration of this Agreement, Halyard shall promptly, and in any event within fourteen (14) calendar days:\n6.1.1 return to Vedanta or, at Vedanta's sole option and discretion, permanently destroy or securely erase all originals, copies, summaries, notes, extracts, models, and electronic files containing or derived from Confidential Information in the possession, custody, or control of Halyard or its Representatives; and\n6.1.2 deliver to Vedanta a certificate executed by an authorised officer or director of Halyard confirming full compliance with the provisions of this Clause 6.1.\n\n6.2 Notwithstanding Clause 6.1, Halyard may retain one (1) copy of the Confidential Information solely in its legal archives to the extent strictly necessary to comply with applicable statutory, regulatory, or professional record-retention requirements, provided that any information so retained shall continue to be held in strict confidence in accordance with the terms of this Agreement for as long as it is retained.\n\nDISCLAIMER OF WARRANTIES\n\n7.1 All Confidential Information is provided by Vedanta on an \"as is\" and \"with all faults\" basis. Vedanta makes no representations or warranties, whether express, statutory, or implied, regarding the accuracy, completeness, fitness for a particular purpose, merchantability, or non-infringement of third-party rights with respect to any Confidential Information disclosed hereunder.\n\n7.2 Vedanta shall not be liable to Halyard or to any other person for any direct, indirect, consequential, punitive, or incidental damages or losses arising out of or resulting from the use of, or reliance upon, any Confidential Information provided under this Agreement.\n\nEQUITABLE RELIEF\n\n8.1 Halyard acknowledges that any breach or threatened breach of the covenants and obligations contained in this Agreement may cause irreparable harm and substantial injury to Vedanta, for which monetary damages alone would not constitute an adequate or complete remedy.\n\n8.2 In the event of any breach or threatened breach by Halyard or its Representatives, Vedanta shall be entitled to seek injunctive relief, specific performance, and other equitable remedies before any court of competent jurisdiction, without the necessity of proving actual damages or posting any bond or other security, in addition to any other rights and remedies available to it at law or in equity.\n\n8.3 In any action, suit, or legal proceeding commenced by Vedanta to enforce the provisions of this Agreement or to obtain equitable relief pursuant to this Clause 8, if a court of competent jurisdiction determines that Halyard or any of its Representatives has committed any breach or violation hereof, Halyard shall reimburse Vedanta upon demand for all costs, charges, and expenses incurred by Vedanta in connection with such proceeding, including without limitation all reasonable attorneys' fees, court fees, expert witness charges, and litigation disbursements, without Vedanta being required to satisfy any reciprocal fee-shifting obligation in the event Halyard successfully defends such action.\n\nTERM AND TERMINATION\n\n9.1 This Agreement shall commence on the Effective Date and shall continue in full force and effect for an initial term of two (2) years, unless terminated earlier by either Party upon giving thirty (30) calendar days' written notice to the other Party.\n\n9.2 The confidentiality, non-use, and return obligations set out in this Agreement shall survive the termination or expiration of this Agreement and shall remain binding upon Halyard for a period of three (3) years from the effective date of termination or expiration, except that in respect of any Confidential Information that constitutes a trade secret under applicable law, such obligations shall survive indefinitely for as long as such information remains a trade secret.\n\nGENERAL PROVISIONS\n\n10.1 Entire Agreement. This Agreement constitutes the entire agreement and understanding between the Parties with respect to the subject matter hereof and supersedes all prior agreements, representations, understandings, arrangements, and negotiations, whether oral or written, between them relating to such subject matter.\n\n10.2 Amendments. No supplement, amendment, modification, or waiver of any provision of this Agreement shall be binding or effective unless made in writing and duly signed by authorised representatives of both Parties.\n\n10.3 Severability. If any provision of this Agreement, or any portion thereof, is held to be invalid, illegal, or unenforceable by any court or tribunal of competent jurisdiction, the remaining provisions of this Agreement shall remain in full force and effect, and the invalid or unenforceable provision shall be construed or modified to the minimum extent necessary to render it valid, legal, and enforceable while giving effect to the commercial intention of the Parties.\n\n10.4 No Assignment. Neither Party may assign, transfer, delegate, sub-contract, or charge any of its rights, benefits, or obligations under this Agreement, in whole or in part, without the prior written consent of the other Party, except that either Party may assign this Agreement upon written notice to an Affiliate or to a successor entity in connection with any merger, consolidation, acquisition, or sale of substantially all of its assets.\n\n10.5 No Commercial Obligation. Nothing in this Agreement shall obligate either Party to disclose any specific information, to enter into any transaction or commercial relationship, to negotiate any definitive agreement, or to refrain from entering into discussions or transactions with any third party, provided that such discussions or transactions do not violate the terms of this Agreement.\n\n10.6 Notices. Any notice, request, consent, approval, or other communication required or permitted under this Agreement shall be in writing and shall be deemed to have been duly given: (a) when delivered personally by hand against written receipt; (b) three (3) Business Days after being dispatched by internationally recognised overnight courier service; or (c) on the date of transmission if sent by email, provided that no bounce-back or automated failure report is received and that a duplicate copy is dispatched by courier within twenty-four (24) hours. Notices shall be addressed to the respective Parties at their registered office addresses set forth at the beginning of this Agreement, marked for the attention of the Legal Department.\n\n10.7 Counterparts and Electronic Signatures. This Agreement may be executed in any number of counterparts, each of which when executed and delivered shall be deemed an original, and all of which taken together shall constitute one and the same instrument. Delivery of an executed counterpart by electronic scan, PDF, or electronic signature platform (such as DocuSign or Adobe Sign) shall be as valid, binding, and effective as physical delivery of an ink-signed original.\n\n10.8 Third Party Rights. A person who is not a party to this Agreement shall have no rights under the Contracts (Rights of Third Parties) Act 1999 or any other applicable enactment to enforce or enjoy the benefit of any term of this Agreement.\n\n10.9 Governing Law and Jurisdiction. This Agreement, and any dispute, controversy, claim, or proceeding arising out of or in connection with it, its subject matter, or its formation (including non-contractual disputes, claims, or tort claims), shall be governed by, and construed in accordance with, the laws of England and Wales. The Parties irrevocably agree that the courts of England and Wales shall have exclusive jurisdiction to settle any dispute, controversy, or claim arising out of or relating to this Agreement.\n\nIN WITNESS WHEREOF, the Parties hereto have caused this Mutual Non-Disclosure Agreement to be duly executed by their respective authorised signatories as of the Effective Date.\n\nSigned for and on behalf of:\nVEDANTA TECHSOLUTIONS PRIVATE LIMITED\n\nBy: __________________________________\nName: Rajesh Ramanathan\nTitle: Director & Senior Vice President - Commercials\nDate: ________________________________\n\nSigned for and on behalf of:\nHALYARD SOFTWARE LTD\n\nBy: __________________________________\nName: _______________________________\nTitle: ________________________________\nDate: ________________________________\n", "C18": "MUTUAL CONFIDENTIALITY AND NON-DISCLOSURE AGREEMENT\n\nTHIS AGREEMENT (the \"Agreement\") is entered into on 14 October 2026 (the \"Effective Date\")\n\nBY AND BETWEEN:\n\n(1) VALOIS SOFTWARE SAS, a société par actions simplifiée organised and existing under the laws of France, with a share capital of EUR 250,000, registered with the Registry of Commerce and Companies of Nanterre under number 842 193 847 RCS Nanterre, having its registered office at 18 rue des Peupliers, 92100 Boulogne-Billancourt, France, represented by its Chief Executive Officer, duly authorised for the purposes hereof (\"Valois\"); and\n\n(2) HALYARD SOFTWARE LTD, a private limited company incorporated and registered under the laws of England and Wales with company number 09876543, having its registered office at 12 Mill Lane, Manchester M1 2AB, United Kingdom, represented by its duly authorised signatory (\"Halyard\").\n\nValois and Halyard are hereinafter referred to individually as a \"Party\" and collectively as the \"Parties\".\n\nPREAMBLE\n\nWHEREAS, the Parties are engaged in the development, distribution and integration of specialised enterprise software platforms and related technological solutions;\n\nWHEREAS, the Parties contemplate entering into exploratory bilateral discussions, evaluations and negotiations concerning a potential strategic commercial partnership, joint technological integration and distribution collaboration (the \"Authorised Purpose\");\n\nWHEREAS, in the context of pursuing the Authorised Purpose, each Party may disclose to the other Party certain technical, proprietary, business, financial and operational data, know-how and materials; and\n\nWHEREAS, the Parties desire to formally define the mutual framework, conditions and legal safeguards governing the transmission, preservation and non-disclosure of such proprietary information.\n\nNOW, THEREFORE, IN CONSIDERATION OF THE MUTUAL COVENANTS CONTAINED HEREIN, THE PARTIES AGREE AS FOLLOWS:\n\nDEFINITIONS AND INTERPRETATION\n\n1.1 In this Agreement, capitalised terms shall have the following meanings:\n\n1.1.1 \"Affiliate\" means, in respect of any specified person or entity, any other person or entity that directly or indirectly Controls, is Controlled by, or is under common Control with, such person or entity.\n\n1.1.2 \"Authorised Purpose\" has the meaning ascribed to it in the Preamble.\n\n1.1.3 \"Authorised Representative\" means the corporate officers, directors, salaried employees, legal counsel, statutory auditors and external technical consultants of a Party or its Affiliates who require access to Confidential Information strictly for the execution of the Authorised Purpose.\n\n1.1.4 \"Business Day\" means any day other than a Saturday, Sunday or official public holiday in England or France.\n\n1.1.5 \"Confidential Information\" means any and all data, proprietary technical documentation, computer programs, source codes, object codes, algorithms, architecture diagrams, APIs, application frameworks, technical specifications, industrial processes, research and development works, business models, client rosters, price lists, commercial strategies, market analyses and financial projections, whether tangible or intangible, disclosed by or on behalf of Valois to Halyard, whether communicated in writing, orally, electronically, by visual inspection or by delivery of samples, before, on or following the Effective Date, which is marked as confidential or which, by its nature, content or the context of its presentation, should reasonably be treated as proprietary by a diligent commercial operator.\n\n1.1.6 \"Control\" means the possession, directly or indirectly, of the power to direct or cause the direction of the management and policies of an entity, whether through the ownership of voting securities, by statutory proxy, by contract or otherwise, in accordance with the criteria set forth in article L. 233-3 of the French Commercial Code.\n\n1.1.7 \"Disclosing Party\" means the Party disclosing Confidential Information under this Agreement.\n\n1.1.8 \"Effective Date\" has the meaning set forth in the heading of this Agreement.\n\n1.1.9 \"Receiving Party\" means the Party receiving Confidential Information under this Agreement.\n\n1.2 In this Agreement, unless the context otherwise demands:\n\n1.2.1 references to clauses, recitals and preambles are to clauses, recitals and preambles of this Agreement;\n\n1.2.2 headings and sub-headings are inserted purely for convenience of reference and shall not affect the construction, validity or legal interpretation of this Agreement; and\n\n1.2.3 the terms \"including\", \"includes\" and \"in particular\" shall be deemed to be completed by the expression \"without limitation\".\n\nSCOPE AND ESSENTIAL OBLIGATIONS OF CONFIDENTIALITY\n\n2.1 In consideration of the mutual disclosure of preliminary materials and the exploration of the Authorised Purpose, each Party undertakes to act in good faith and observe the confidentiality undertakings set forth herein.\n\n2.2 The Receiving Party expressly undertakes towards the Disclosing Party to:\n\n2.2.1 preserve the strictest secrecy and confidentiality over all Confidential Information received from the Disclosing Party, exercising at least the same standard of diligence, security precautions and protection that it accords to its own confidential records of equivalent sensitivity, and in any event no less than a high and professional degree of diligence;\n\n2.2.2 use, reproduce and process the Disclosing Party's Confidential Information exclusively and strictly to the extent indispensable for the fulfilment of the Authorised Purpose, to the formal exclusion of any other exploitation, commercialisation, industrial implementation, direct competition or personal benefit;\n\n2.2.3 refrain from communicating, transferring, publishing or revealing the Confidential Information, in whole or in part, to any third-party person, enterprise or organisation, without the express prior written authorisation of the Disclosing Party;\n\n2.2.4 limit the dissemination of Confidential Information strictly to those Authorised Representatives who have a clear and demonstrable need to know such information solely for the implementation of the Authorised Purpose;\n\n2.2.5 ensure that each Authorised Representative to whom Confidential Information is communicated is formally appraised of its confidential and proprietary character and is bound by written non-disclosure commitments or professional secrecy obligations substantially similar to those contained herein; and\n\n2.2.6 abstain from decompiling, reverse engineering, disassembling, translating, synthesising, decoding or modifying any software components, source modules, microcodes, firmware or technological prototypes supplied under this Agreement.\n\n2.3 The Receiving Party shall remain fully, directly and jointly answerable to the Disclosing Party for any unauthorised disclosure, publication, leakage or misuse of Confidential Information committed by any of its Authorised Representatives, in identical manner as if such breach had been committed directly by the Receiving Party itself.\n\n2.4 The Receiving Party shall notify the Disclosing Party immediately, and confirm in writing within twenty-four (24) hours, upon becoming aware of any loss, misappropriation, security compromise or unauthorised divulgation of the Disclosing Party's Confidential Information, and shall lend all reasonable assistance required to contain such compromise.\n\nEXCEPTIONS TO CONFIDENTIALITY UNDERTAKINGS\n\n3.1 The restrictive stipulations of Clause 2 shall not apply to any information, knowledge or data in respect of which the Receiving Party can establish by contemporaneous written proof that such information:\n\n3.1.1 has entered into the public domain prior to its disclosure, or subsequently becomes accessible to the public at large without fault, default or omission on the part of the Receiving Party or its Authorised Representatives;\n\n3.1.2 was already in the lawful and unfettered possession of the Receiving Party prior to its transmission by the Disclosing Party, free of any antecedent covenant of secrecy;\n\n3.1.3 was lawfully received by the Receiving Party on a non-confidential basis from an autonomous third party having the absolute right to divulge it without violating any contractual, statutory or fiduciary obligation; or\n\n3.1.4 was conceived, designed and generated autonomously by employees or contractors of the Receiving Party who had no access to, knowledge of, or reliance upon the Disclosing Party's Confidential Information.\n\nMANDATORY AND JUDICIAL DISCLOSURE\n\n4.1 If the Receiving Party or any of its Authorised Representatives is summoned, directed or compelled pursuant to an enforceable judicial injunction, arbitral decree, administrative summons or statutory demand issued by a competent public authority or judicial court to disclose any portion of the Disclosing Party's Confidential Information, such disclosure shall not constitute an infringement of this Agreement, provided that the Receiving Party shall:\n\n4.1.1 notify the Disclosing Party ions, copyright, trade marks, registered and unregistered designs, database rights, trade secrets and know-how), shall remain the exclusive and unencumbered property of the Disclosing Party and its respective licensors.\n\n6.2 No assignment, conveyance, transfer or licence, whether express, tacit or implied, under any patent, copyright, trademark, trade secret or other proprietary entitlement, is granted or conferred by this Agreement, save for the precarious and limited right to review the Confidential Information solely for the Authorised Purpose.\n\n6.3 All Confidential Information is made available on an \"as is\" and \"as available\" basis, without any express or implied warranty, guarantee, condition or representation whatsoever regarding its technical accuracy, exhaustiveness, functionality, merchantability, suitability for an intended objective or non-infringement of third-party rights.\n\nINDEMNIFICATION AND LIABILITY\n\n7.1 The Receiving Party shall defend, indemnify and hold harmless the Disclosing Party, its Affiliates, and their respective directors, officers, employees and agents on demand from and against any and all claims, actions, proceedings, losses, liabilities, damages, penalties, fines, costs and expenses (including all legal fees, court costs, expert expenses and forensic investigation disbursements) suffered, incurred or sustained by the Disclosing Party arising out of, relating to, or resulting from any breach, non-observance or non-performance by the Receiving Party or its Authorised Representatives of any obligation under this Agreement.\n\nTERM AND DURATION OF UNDERTAKINGS\n\n8.1 This Agreement shall enter into binding force and take effect between the Parties on the Effective Date and shall remain in effect for a period of two (2) years, unless terminated earlier by either Party upon thirty (30) days' prior written notice served upon the other Party.\n\n8.2 The obligations of confidentiality, non-disclosure, restricted use and secrecy set forth in this Agreement shall survive any expiry, revocation or termination of this Agreement and shall continue in full force and effect perpetually and indefinitely with respect to all Confidential Information disclosed hereunder.\n\nGENERAL PROVISIONS\n\n9.1 Entire Agreement. This Agreement constitutes the complete, definitive and integrated expression of the understanding between the Parties with respect to its subject matter and supersedes, cancels and replaces all prior discussions, letters of intent, protocols, declarations and agreements, whether oral or written, concluded between the Parties.\n\n9.2 Amendments. Any variation, amendment or modification of this Agreement shall be null, void and destitute of legal effect unless formalised by a written instrument duly signed by authorised representatives of both Parties.\n\n9.3 Waiver. No tolerance, inaction, delay or indulgence by either Party in exercising any right, power or remedy under this Agreement shall operate as a waiver thereof, nor shall any single or partial exercise of any right preclude any further or other exercise thereof.\n\n9.4 Severability. Should any provision, clause or stipulation of this Agreement be adjudged illegal, invalid or unenforceable under any present or future applicable law by a court of competent jurisdiction, such invalidity shall not affect the remaining provisions of this Agreement, which shall remain in full force and effect. The Parties shall negotiate in good faith to replace the invalid clause with an enforceable provision reflecting the economic intent of the original clause.\n\n9.5 Assignment. Neither Party may assign, sub-contract, delegate, transfer or novate any of its rights, benefits or obligations under this Agreement to any third party, whether by operation of law, merger, demerger or universal transfer of assets, without the prior written consent of the other Party.\n\n9.6 Non-Publicity. Neither Party shall communicate to the public, issue press communiqués, make marketing references or publish social media declarations mentioning the existence, execution, terms or discussions forming the subject matter of this Agreement without the prior written authorisation of the other Party.\n\n9.7 Third Party Rights. Unless expressly provided herein, this Agreement does not confer any enforceable rights or advantages on any third party pursuant to the Contracts (Rights of Third Parties) Act 1999 or any analogous legal rule.\n\n9.8 Counterparts and Digital Signature. This Agreement may be executed in any number of counterparts, each of which shall be deemed an original, and all of which together shall form one and the same instrument. The delivery of an executed counterpart by electronic signature or portable document format (PDF) shall be valid, binding and admissible as evidence between the Parties.\n\nGOVERNING LAW AND JURISDICTION\n\n10.1 This Agreement and any non-contractual obligations, claims or disputes arising out of or in connection with its formation, existence, interpretation, performance or termination shall be governed by, and construed in accordance with, the laws of England and Wales.\n\n10.2 Each Party irrevocably submits to the exclusive jurisdiction of the courts of England and Wales to resolve, settle and determine any dispute, litigation, controversy or claim arising out of, under or in connection with this Agreement, including any claim concerning its existence, validity, execution or termination.\n\nIN WITNESS WHEREOF, the Parties have caused this Agreement to be executed by their respective duly authorised representatives on the Effective Date.\n\nFor and on behalf of VALOIS SOFTWARE SAS\nSignature: ______________________________\nName: Jean-Luc de Valois\nTitle: Président-Directeur Général\nDate: 14 October 2026\n\nFor and on behalf of HALYARD SOFTWARE LTD\nSignature: ______________________________\nName: ______________________________\nTitle: ______________________________\nDate: ______________________________\n", "C19": "NON-DISCLOSURE AGREEMENT\n\nDATED: 14 October 2026\n\nPARTIES:\n\nVANTAGE PLATFORMS SARL, a private limited liability company (société à responsabilité limitée) incorporated under the laws of the Grand Duchy of Luxembourg, having its registered office at 24 Boulevard Royal, L-2449 Luxembourg, registered with the Luxembourg Trade and Companies Register (RCS Luxembourg) under number B245190 (Vantage); and\n\nHALYARD SOFTWARE LTD, a company incorporated in England and Wales under company number 09876543, having its registered office at 12 Mill Lane, Manchester M1 2AB, United Kingdom (Halyard).\n\nVantage and Halyard are each referred to individually as a Party and collectively as the Parties.\n\nBACKGROUND:\nThe Parties intend to enter into discussions regarding a prospective strategic integration and commercial partnership (the Permitted Purpose). In connection with the Permitted Purpose, each Party may disclose to the other Party certain technical, proprietary, and commercial information. The Parties agree to protect such information on the terms of this Agreement.\n\nOPERATIVE PROVISIONS:\n\nDefinitions\n1.1 In this Agreement:\n1.1.1 Affiliate means any entity that directly or indirectly Controls, is Controlled by, or is under common Control with a Party. Control means the ownership of more than 50% of the voting shares or the power to direct management and policies.\n1.1.2 Agreement means this Non-Disclosure Agreement together with any schedules or annexes.\n1.1.3 Confidential Information means all non-public information disclosed directly or indirectly by or on behalf of a Disclosing Party to a Receiving Party in connection with the Permitted Purpose, whether orally, visually, in writing, or in electronic or other tangible form, including software architecture, APIs, source code, data pipelines, product roadmaps, customer pipelines, pricing methodologies, financial models, and business plans, which is marked confidential or should reasonably be understood to be confidential given its nature and context of disclosure.\n1.1.4 Disclosing Party means a Party disclosing Confidential Information.\n1.1.5 Receiving Party means a Party receiving Confidential Information.\n1.1.6 Representative means, in relation to a Party, its directors, officers, employees, professional advisers, and approved financing sources.\n\nConfidentiality and Use\n2.1 The Receiving Party shall:\n2.1.1 use the Confidential Information solely for evaluating and pursuing the Permitted Purpose;\n2.1.2 protect the Confidential Information with the same degree of care it accords to its own confidential material of equivalent sensitivity, and in any event no less than reasonable care;\n2.1.3 restrict disclosure of Confidential Information strictly to those of its Representatives who need to know it for the Permitted Purpose and who are subject to written or professional confidentiality undertakings substantially similar to those in this Agreement; and\n2.1.4 be responsible for any breach of this Agreement caused by an act or omission of any of its Representatives.\n\nExclusions and Residuals\n3.1 Clause 2 does not apply to information that the Receiving Party can establish:\n3.1.1 is or becomes publicly available without breach of this Agreement;\n3.1.2 was already in its possession without restriction prior to disclosure by the Disclosing Party;\n3.1.3 is lawfully obtained from a third party free of any confidentiality restriction; or\n3.1.4 was independently developed without access to or reference to the Disclosing Party's Confidential Information.\n3.2 Nothing in this Agreement shall restrict either Party or its Affiliates from using, disclosing, or commercialising any ideas, concepts, know-how, techniques, or information retained in the unaided memory of its personnel who have had authorised access to Confidential Information under this Agreement, provided that such personnel do not intentionally memorise such information for the purpose of cial prejudice to the other Party for which monetary damages alone would be entirely inadequate. Accordingly, each Party stipulates and agrees that, upon any breach or imminent threat of breach, the non-defaulting Party shall be entitled, immediately and as a matter of right, to seek and obtain emergency injunctive relief, specific performance, and any other provisional remedies or decrees available in equity from any court of competent jurisdiction, without the necessity of proving actual damages, posting any bond, or providing other security, in addition to any other remedies available at law or in equity.\n\nGeneral Provisions\n9.1 No Licence. No licence, title, or interest under any patent, copyright, trademark, trade secret, or other intellectual property right is granted or implied by this Agreement.\n9.2 Entire Agreement. This Agreement constitutes the complete and exclusive statement of agreement between the Parties regarding confidentiality for the Permitted Purpose.\n9.3 Counterparts. This Agreement may be executed in counterparts and delivered by electronic signature.\n9.4 Governing Law and Jurisdiction. This Agreement and any non-contractual obligations arising out of or in connection with it shall be governed by, and construed in accordance with, the laws of the Grand Duchy of Luxembourg. The courts of the district of Luxembourg City shall have exclusive jurisdiction to hear and determine any suit, action, or proceeding arising out of or in connection with this Agreement.\n\nIN WITNESS WHEREOF, the Parties have executed this Agreement by their duly authorised representatives.\n\nSigned for and on behalf of VANTAGE PLATFORMS SARL\nSignature: ______________________________\nName: ______________________________\nTitle: ______________________________\nDate: ______________________________\n\nSigned for and on behalf of HALYARD SOFTWARE LTD\nSignature: ______________________________\nName: ______________________________\nTitle: ______________________________\ lectronically or in tangible form, including without limitation software code, architectural designs, algorithms, business processes, customer data, product specifications, roadmaps and pricing, which is designated as confidential or which by its nature ought reasonably to be considered confidential.\n1.1.4 \"Recipient\" means the Party receiving Confidential Information from or on behalf of the Discloser.\n1.1.5 \"Representative\" means a director, officer, employee, external consultant, legal adviser or auditor of a Party or of any of its Affiliates.\n\nScope and Standard of Care\n2.1 The Recipient shall treat all Confidential Information disclosed by the Discloser with strict confidentiality.\n2.2 The Recipient shall apply the same degree of care to safeguard the Discloser's Confidential Information as it applies to its own confidential material of like character, but in no event less than a reasonable commercial standard of care.\n2.3 The Recipient shall not disclose, publish or otherwise make available the Discloser's Confidential Information to any third party, except as expressly permitted under Clause 3.\n2.4 The Recipient shall use the Confidential Information solely for the Purpose and shall not exploit, commercialise or adapt such information for its own benefit or the benefit of any third party without prior written consent.\n2.5 The Recipient shall not reverse engineer, decompile, disassemble or analyse the technical composition of any software binaries, application interfaces or hardware units supplied by the Discloser under this Agreement.\n\nPermitted Access and Disclosures\n3.1 The Recipient may disclose the Discloser's Confidential Information only to those of its Representatives and Affiliates who need to know such information for the implementation or assessment of the Purpose.\n3.2 Prior to granting access, the Recipient shall ensure that each such Representative or Affiliate is bound by confidentiality undertakings substantially similar to those contained in this Agreement.\n3.3 The Recipient remains directly responsible for any breach of this Agreement caused by an act or omission of its Representatives or Affiliates as if committed by the Recipient itself.\n\nExclusions from Confidential Treatment\n4.1 The confidentiality obligations in Clause 2 do not apply to any Information that the Recipient can verify by written evidence:\n4.1.1 is already publicly known at the time of disclosure, or subsequently enters the public domain without fault or breach by the Recipient or its Representatives;\n4.1.2 was already lawfully known to the Recipient prior to disclosure by the Discloser, without restriction on use or disclosure;\n4.1.3 is received in good faith from an independent third party who is entitled to make such disclosure without breaching any legal or fiduciary duty; or\n4.1.4 was independently developed by the Recipient's employees or contractors who had no access to or knowledge of the Discloser's Confidential Information.\n\nMandatory and Legal Disclosures\n5.1 If the Recipient or any of its Affiliates is requested or ordered by a court, regulatory body or government agency to disclose any of the Discloser's Confidential Information, the Recipient shall immediately notify the Discloser in writing to the extent legally permissible.\n5.2 The Recipient shall, at its sole cost and expense, exhaust all legal remedies, applications and appeals to resist, stay, limit or challenge such disclosure demand before disclosing any Confidential Information, and shall not provide any documents or testimony unless a final and non-appealable order compelling production has been issued by a court of competent jurisdiction.\n5.3 If disclosure remains strictly compulsory following the exhaustion of such remedies, the Recipient shall disclose only that portion of the Confidential Information that its external legal counsel advises in writing is strictly necessary to satisfy the mandate, and shall use its best efforts to obtain reliable assurances that confidential treatment will be accorded to the disclosed Information.\n\nReturn and Erasure of Materials\n6.1 Upon written request from the Discloser, or upon conclusion of the discussions regarding the Purpose, the Recipient shall promptly:\n6.1.1 deliver to the Discloser or destroy all original documents, copies, extracts and tangible summaries containing or reflecting any Confidential Information; and\n6.1.2 provide written certification signed by an authorised officer confirming that all relevant physical and electronic files have been deleted or destroyed.\n6.2 The Recipient shall not be required to expunge electronic copies created pursuant to automated system backup schedules, provided that all such retained files remain subject to the confidentiality and non-use provisions of this Agreement until permanently overwritten or purged.\n\nIntellectual Property and Residual Knowledge\n7.1 All Confidential Information remains the exclusive property of the Discloser. No licence, title or interest under any patent, copyright, trademark, trade secret or other intellectual property right is granted or implied under this Agreement, other than the restricted right to use the Information strictly for the Purpose.\n7.2 Neither Party warrants the accuracy, completeness, viability or fitness for purpose of any Information shared hereunder. All materials are disclosed on an \"as is\" basis without warranty of any kind.\n7.3 Notwithstanding anything to the contrary in this Agreement, the Recipient and its personnel shall be free to use and exploit for any purpose any general ideas, concepts, know-how, skills or techniques related to the Discloser's Confidential Information that are retained in the unaided memory of the Recipient's personnel who have had authorised access to the Confidential Information.\n\nTerm and Termination\n8.1 This Agreement takes effect on the Effective Date and shall remain in effect for two (2) years, unless terminated earlier by either Party upon thirty (30) days' prior written notice to the other Party.\n8.2 The obligations of confidentiality, non-disclosure and limited use in this Agreement shall survive termination or expiry and shall continue to bind the Parties for a period of three (3) years following the date of termination or expiry of this Agreement.\n\nRemedies and Breach\n9.1 Each Party acknowledges that an unauthorised use or disclosure of Confidential Information may cause irreparable harm for which monetary damages alone would provide inadequate relief. A Party shall therefore be entitled to seek injunctive relief, orders for specific performance or other interim measures from any court of competent jurisdiction without having to prove special damage.\n9.2 Because the actual damage resulting from a breach of this Agreement is difficult to calculate, the Parties agree that if the Recipient breaches any provision of Clause 2, Clause 3 or Clause 5, the Recipient shall pay to the Discloser as liquidated damages an amount of £75,000 for each individual breach, payable within fourteen (14) days of written notice of breach from the Discloser, without prejudice to the Discloser's right to seek injunctive relief or to claim compensation for additional demonstrated loss exceeding that sum.\n\nMiscellaneous\n10.1 Neither Party may assign or transfer its rights or obligations under this Agreement without the prior written consent of the other Party, except that NCL may assign or transfer this Agreement or any of its rights or obligations hereunder without consent to any Affiliate or to a corporate successor in connection with a merger, acquisition or sale of substantially all its business assets.\n10.2 All notices given under this Agreement shall be in writing and delivered by registered mail or email to the addresses set out on the first page of this Agreement or to such other contact details as either Party may designate in writing.\n10.3 No amendment, modification or waiver of any provision of this Agreement shall be effective unless recorded in writing and duly signed by authorised representatives of both Parties.\n10.4 If any provision of this Agreement is found to be invalid, illegal or unenforceable by a court of competent jurisdiction, the remaining provisions shall continue in full force and effect.\n10.5 Nothing in this Agreement creates any partnership, joint venture, agency or employment relationship between the Parties.\n10.6 A person who is not a party to this Agreement has no right under the Contracts (Rights of Third Parties) Act 1999 to enforce any term of this Agreement.\n10.7 This Agreement constitutes the complete and exclusive agreement between the Parties regarding the subject matter hereof and supersedes all prior proposals, understandings and negotiations.\n10.8 This Agreement may be executed in counterparts, each of which shall be considered an original, and electronic or digital signatures shall be deemed to carry equal legal validity as handwritten originals.\n10.9 This Agreement and any dispute or claim arising out of or in connection with it or its subject matter or formation (including non-contractual disputes or claims) shall be governed by and construed in accordance with the laws of England and Wales.\n10.10 The Parties irrevocably agree that the courts of England and Wales shall have exclusive jurisdiction to settle any dispute or claim arising out of or in connection with this Agreement or its subject matter or formation.\n\nIN WITNESS WHEREOF, the Parties have caused this Agreement to be executed by their duly authorised representatives as of the Effective Date.\n\nNORDIC CLOUD LOGISTICS AB\nSignature: ______________________________\nName: Freja Lindqvist\nTitle: Chief Technology Officer\nDate: 14 November 2026\n\nHALYARD SOFTWARE LTD\nSignature: ______________________________\nName: ______________________________\nTitle: ______________________________\nDate: ______________________________\n", "C21": "MUT  disclosed by or on behalf of a Disclosing Party to a Receiving Party under this Agreement, whether disclosed orally, visually, electronically, or in tangible form, including without limitation source code, software architecture, object code, API specifications, product plans, benchmark results, customer lists, financial forecasts, pricing policies, and trade secrets, that is designated as confidential at the time of disclosure or that reasonably should be understood to be confidential given the nature of the information or the circumstances surrounding disclosure.\n\n1.4 \"Disclosing Party\" means the Party disclosing Proprietary or Confidential Information hereunder.\n\n1.5 \"Receiving Party\" means the Party receiving Proprietary or Confidential Information hereunder.\n\n1.6 \"Representatives\" means a Party's and its Affiliates' directors, officers, employees, legal counsel, accountants, and financial advisors.\n\nConfidentiality Obligations and Restrictive Covenants\n\n2.1 The Receiving Party shall hold all Confidential Information of the Disclosing Party in strict confidence and shall not disclose, publish, or disseminate such Confidential Information to any third party, except as expressly permitted under Section 3.\n\n2.2 The Receiving Party shall protect the Disclosing Party's Confidential Information with the same degree of care that it uses to protect its own confidential information of like kind, but in no event less than a reasonable degree of care, and shall use such Confidential Information solely to evaluate and perform the Purpose.\n\n2.3 The Receiving Party shall not reverse engineer, decompile, disassemble, or derive the composition, structure, or source code of any hardware, software, or samples furnished by the Disclosing Party.\n\n2.4 In order to protect the Disclosing Party's legitimate proprietary interests and goodwill in its proprietary cloud software platform and enterprise market relationships disclosed during the evaluation of the Purpose, the Receiving Party covenants and agrees that, during the term of this Agreement and for a period of twelve (12) months following any termination or expiration hereof, the Receiving Party shall not, directly or indirectly, whether as principal, agent, partner, consultant, or otherwise, develop, market, distribute, license, or sell any software product, service, or feature that directly competes with the enterprise cloud infrastructure solutions disclosed by the Disclosing Party, nor shall the Receiving Party enter into any commercial partnership, joint venture, or distribution arrangement with any direct competitor of the Disclosing Party in respect of the subject matter evaluated under the Purpose.\n\nPermitted Disclosures and Exceptions\n\n3.1 The Receiving Party may disclose the Disclosing Party's Confidential Information only to those of its Representatives who need to know such information for the Purpose and who are bound by confidentiality obligations at least as restrictive as those contained in this Agreement. The Receiving Party shall be fully liable for any breach of this Agreement by any of its Representatives.\n\n3.2 The obligations set forth in Section 2.1 and Section 2.2 shall not apply to any information that the Receiving Party can establish by competent written proof:\n\n3.2.1 is or becomes publicly known through no breach of this Agreement by the Receiving Party or its Representatives;\n\n3.2.2 was already in the lawful possession of the Receiving Party without confidentiality restrictions prior to disclosure by the Disclosing Party;\n\n3.2.3 is received from a third party without breach of any confidentiality obligation owed to the Disclosing Party; or\n\n3.2.4 is independently developed by the Receiving Party without reference to, reliance upon, or use of the Disclosing Party's Confidential Information.\n\nLegally Compelled Disclosures\n\n4.1 If the Receiving Party is requested or required pursuant to Applicable Law, valid subpoena, court order, or regulatory process to disclose any of the Disclosing Party's Confidential Information, the Receiving Party shall, to the extent legally permissible, provide the Disclosing Party with prompt written notice thereof so that the Disclosing Party may seek a protective order or other appropriate remedy.\n\n4.2 The Receiving Party shall cooperate reasonably with the Disclosing Party, at the Disclosing Party's expense, in seeking such protective measures. If such protective order or other remedy is not obtained, the Receiving Party shall disclose only that portion of the Confidential Information that it is legally advised it is compelled to disclose.\n\nReturn and Retention of Materials\n\n5.1 Upon written request of the Disclosing Party, the Receiving Party shall promptly, and in any event within fifteen (15) days of receipt of such request, securely destroy or return to the Disclosing Party all materials, documents, and records containing or reflecting any Confidential Information, together with all copies thereof, and shall certify compliance in writing.\n\n5.2 Notwithstanding Section 5.1, the Receiving Party may retain copies of Confidential Information to the extent required to satisfy statutory document-retention mandates, or to the extent stored on routine, automated electronic backup systems, provided that all such retained Confidential Information shall remain subject to the terms of this Agreement until destroyed.\n\nIntellectual Property and Warranty Disclaimer\n\n6.1 All Confidential Information remains the exclusive property of the Disclosing Party. Nothing herein shall be construed as granting any right, title, license, or interest by implication, estoppel, or otherwise in or to any patent, trademark, copyright, trade secret, or other intellectual property right of the Disclosing Party.\n\n6.2 All Confidential Information is provided on an \"as is\" and \"with all faults\" basis, without any warranties of any kind, whether express, implied, statutory, or otherwise, regarding its accuracy, completeness, non-infringement, or fitness for a particular purpose.\n\nIndemnification and Remedies\n\n7.1 The Receiving Party agrees to indemnify, defend, and hold harmless the Disclosing Party, its Affiliates, and their respective directors, officers, employees, and agents from and against any and all losses, damages, liabilities, judgments, fines, penalties, settlements, costs, and expenses (including without limitation court costs and reasonable attorneys' fees and expenses) arising out of, resulting from, or relating to any breach or alleged breach of this Agreement, or any unauthorized use, disclosure, or misappropriation of the Disclosing Party's Confidential Information by the Receiving Party or any of its Representatives, without any monetary cap or other limitation of liability whatsoever.\n\n7.2 The Parties acknowledge that unauthorized disclosure or use of Confidential Information will cause immediate, substantial, and irreparable harm for which compensatory damages would be difficult to quantify and inadequate to compensate the Disclosing Party. Consequently, in the event of any material breach or threatened material breach of Section 2 of this Agreement by the Receiving Party or its Representatives, the Receiving Party shall pay to the Disclosing Party, immediately upon written demand, the sum of one hundred thousand United States dollars ($100,000) for each such breach or unauthorized disclosure event as agreed liquidated damages and not as a penalty, representing a reasonable pre-estimate of administrative and operational investigation costs, without prejudice to the Disclosing Party's right to seek further injunctive or other equitable relief in respect thereof.\n\n7.3 Each Party acknowledges that monetary relief alone may not be sufficient for any actual or threatened violation of this Agreement, and each Party shall be entitled to seek immediate injunctive relief and specific performance, without posting bond lish, disclose, disseminate, or make available such Confidential Information, in whole or in part, to any third party, legal entity, or unauthorized person without the express prior written consent of the Disclosing Party;\n\n2.1.2 use and reproduce the Confidential Information solely, strictly, and exclusively to the extent indispensable for the performance and realization of the Permitted Purpose, and refrain from utilizing, exploiting, or commercializing the Confidential Information for its own economic benefit, for competitive purposes, or for the benefit of any third party;\n\n2.1.3 apply to the Disclosing Party's Confidential Information the highest standard of technical and organizational security measures, and in any case no less than the degree of care and diligence that a prudent enterprise in the software industry exercises over its own confidential assets of comparable sensitivity, but under no circumstances less than a reasonable standard of commercial care;\n\n2.1.4 refrain from copying, transcribing, replicating, or preparing summaries or extracts of the Confidential Information, except to the minimal extent strictly necessary for the fulfilment of the Permitted Purpose, whereby all such authorized duplicates, extracts, or records shall immediately constitute and remain the property of the Disclosing Party; and\n\n2.1.5 not decompile, reverse engineer, disassemble, decrypt, decode, analyze the internal structure of, or otherwise attempt to derive the human-readable source code, core algorithms, internal architecture, or foundational ideas of any software, data files, prototypes, or technical artifacts made available by the Disclosing Party.\n\n2.2 The Receiving Party shall notify the Disclosing Party immediately in writing upon becoming aware of any actual, suspected, or threatened breach of security, loss, unauthorized disclosure, or improper utilization of any Confidential Information, and shall, at its own expense, take all reasonable and necessary greement by any of its Representatives as if such breach had been committed by Halyard itself.\n2.3 Halyard shall promptly notify LedgerFlow in writing upon becoming aware of any actual, suspected or threatened unauthorised disclosure, loss, access or misuse of any Confidential Information, and shall cooperate fully with LedgerFlow to mitigate and remedy the effects of any such occurrence.\n\nExclusions\n3.1 The obligations in Clause 2 shall not apply to any information that Halyard can clearly establish by contemporaneous written records:\n3.1.1 is already in or subsequently enters the public domain without breach of this Agreement or any other confidentiality obligation by Halyard or its Representatives;\n3.1.2 was already lawfully in the possession of Halyard prior to receipt from LedgerFlow, without any duty of confidentiality attached;\n3.1.3 is independently developed by employees or contractors of Halyard who have had no access to, knowledge of, or reference to the Confidential Information; or\n3.1.4 is lawfully obtained by Halyard from an independent third party who has the lawful right to disclose such information without restriction.\n\nMandatory Disclosures\n4.1 Halyard may disclose Confidential Information to the extent required by an order of a court of competent jurisdiction or by any applicable statutory, regulatory or governmental body.\n4.2 Prior to making any disclosure under Clause 4.1, Halyard shall, to the extent legally permissible:\n4.2.1 give prompt written notice to LedgerFlow to enable LedgerFlow to seek a protective order, injunctive relief or other appropriate legal remedy;\n4.2.2 consult with LedgerFlow regarding the timing, scope and text of the proposed disclosure; and\n4.2.3 disclose only that portion of the Confidential Information that is strictly required by law to be disclosed.\n\nReturn and Destruction\n5.1 Upon the written request of LedgerFlow at any time, or automatically upon the termination or expiry of this Agreement, Halyard shall within five (5) Business Days:\n5.1.1 return to LedgerFlow or, at LedgerFlow's election, securely destroy and permanently erase all originals, copies, summaries and extracts of the Confidential Information in its possession, custody or control; and\n5.1.2 certify in writing by a statutory director that all such Confidential Information has been returned or destroyed in accordance with this Clause 5.1.\n5.2 Notwithstanding Clause 5.1, Halyard may retain copies of Confidential Information solely to the extent required to comply with mandatory statutory record-keeping obligations or embedded within routine, automated and secure disaster recovery electronic backups, provided always that any retained information shall remain subject to the confidentiality terms of this Agreement.\n\nIntellectual Property and No Licence\n6.1 All intellectual property rights, title and interest in and to any Confidential Information remain the exclusive property of LedgerFlow or its relevant licensors.\n6.2 Nothing in this Agreement shall be construed as granting, either expressly or by implication, any licence, assignment, option or right under any patent, copyright, trademark, trade secret or other proprietary right of LedgerFlow, other than the limited right to use the Confidential Information strictly for the Permitted Purpose.\n6.3 All Confidential Information is provided on an \"as is\" basis without warranty of any kind, whether express, statutory or implied, regarding its accuracy, completeness or fitness for any purpose.\n\nIndemnity\n7.1 Halyard shall defend, indemnify and hold harmless LedgerFlow, its affiliates and their respective directors, officers, employees and agents against any and all damages, losses, liabilities, claims, actions, costs and expenses (including without limitation full legal fees, investigatory costs and forensic technical expenses) suffered or incurred by LedgerFlow arising out of or resulting from any breach of this Agreement or unauthorised di agement, policies, and decisions of a corporate body or other entity, whether through the ownership of voting securities or share capital, by contract, agreement, or otherwise, and the expressions \"Controlling\" and \"Controlled\" shall be construed accordingly;\n\n1.1.5 \"Discloser\" means that Party which directly or indirectly discloses, communicates, reveals, or makes accessible Proprietary and Confidential Information to the Recipient or its Representatives;\n\n1.1.6 \"Recipient\" means that Party which receives, accesses, reviews, or is otherwise made cognizant of Proprietary and Confidential Information from or on behalf of the Discloser;\n\n1.1.7 \"Representatives\" means, in relation to a Party, its lawful directors, statutory officers, employees, legal advisors, statutory auditors, and designated financial counselors who have a demonstrable need to receive and review Confidential Information for the fulfillment of the Permitted Purpose.\n\n1.2 In this Agreement:\n\n1.2.1 words importing the singular number only shall include the plural number and vice versa;\n\n1.2.2 words importing any gender shall include all genders;\n\n1.2.3 headings, marginal notes, and section titles are inserted for convenience of reference only and shall not affect the interpretation or construction of this Agreement;\n\n1.2.4 references to statutory provisions, enactments, or statutes shall be construed as references to those provisions, enactments, or statutes as amended, extended, consolidated, re-enacted, or replaced from time to time; and\n\n1.2.5 any phrase introduced by the terms \"including\", \"include\", \"in particular\", \"for example\", or any analogous expression shall be construed as illustrative and shall not limit the generality of the preceding words.\n\nOBLIGATIONS OF NON-DISCLOSURE AND CONFIDENTIALITY\n\n2.1 In consideration of the Discloser disclosing Confidential Information to the Recipient, the Recipient hereby covenants, undertakes, and agrees with the Discloser that it shall:\n\n2.1.1 treat, hold, and preserve all Confidential Information of the Discloser in the strictest confidence and not disclose, publish, impart, broadcast, communicate, or make available such Confidential Information, whether directly or indirectly, to any person, company, firm, or entity whatsoever, except strictly as expressly authorized and permitted pursuant to the provisions of Clause 3;\n\n2.1.2 use, exploit, apply, and evaluate the Discloser's Confidential Information solely and exclusively for the advancement and execution of the Permitted Purpose, and for no other object, enterprise, or purpose whatsoever, and explicitly refrain from utilizing such Confidential Information to gain any commercial, technical, or competitive advantage over the Discloser;\n\n2.1.3 apply to the Discloser's Confidential Information a degree of care, custody, and physical and electronic security no less stringent than the degree of care and diligence that the Recipient applies to its own highly confidential and proprietary information of like sensitivity, and in any event not less than a standard of reasonable and prudent care;\n\n2.1.4 not copy, duplicate, record, transcribe, photograph, or reproduce any part of the Discloser's Confidential Information, except to the extent strictly and demonstrably indispensable for the Permitted Purpose, and ensure that all permitted copies carry the same restrictive proprietary notices as the original material; and\n\n2.1.5 not reverse engineer, decompile, disassemble, translate, decipher, probe, or otherwise endeavor to discover, reconstruct, or derive the internal structure, source code, design, or algorithmic mechanisms of any software, programs, hardware, modules, or prototypes furnished by the Discloser under this Agreement.\n\n2.2 The Recipient shall promptly, and in any event within two (2) Business Days, notify the Discloser in writing upon discovering or becoming cognizant of any unauthorized disclosure, access, misappropriation, compromise, or loss of any Confidential Information of the Discloser, and shall furnish, at its own charge, all such reasonable assistance and cooperation as the Discloser may request in order to mitigate the impact thereof, regain possession of such Confidential Information, and restrain any further infractions.\n\nPERMITTED DISCLOSURES AND REPRESENTATIVES\n\n3.1 The Recipient may disclose the Discloser's Confidential Information solely to such of its Representatives who strictly require access to such information for the sole purpose of assessing or executing the Permitted Purpose.\n\n3.2 Prior to imparting any Confidential Information to any such Representative, the Recipient shall:\n\n3.2.1 apprise and advise such Representative of the confidential and secret character of the information; and\n\n3.2.2 satisfy itself that each such Representative is subject to written employment terms, professional obligations, or an executed non-disclosure undertaking containing restrictions and obligations of confidentiality at least as rigorous and protective as those contained in this Agreement.\n\n3.3 The Recipient shall be directly responsible and answerable for any act, omission, neglect, default, or breach of the provisions of this Agreement committed by any of its Representatives, and any breach by a Representative shall be deemed to be an actionable breach of this Agreement by the Recipient itself.\n\nEXCEPTIONS TO CONFIDENTIALITY\n\n4.1 The covenants, undertakings, and obligations set forth in Clause 2 shall not apply to any specific portion or item of information to the extent that the Recipient can convincingly establish and demonstrate by contemporary written records and documentary proof that such information:\n\n4.1.1 is at the time of its disclosure, or subsequently becomes, part of the public knowledge and available in the public domain, otherwise than as a consequence of any breach, act, omission, or default of this Agreement by the Recipient or its Representatives;\n\n4.1.2 was already lawfully in the possession, custody, and knowledge of the Recipient prior to its disclosure by or on behalf of the Discloser, without any pre-existing duty or obligation of secrecy attached thereto;\n\n4.1.3 is lawfully received and acquired by the Recipient subsequent to the Effective Date on an unencumbered and non-confidential basis from a bona fide third party who is entitled to divulge the same and who is not subject to any direct or indirect obligation of confidentiality owed to the Discloser; or\n\n4.1.4 has been independently originated, created, developed, or discovered by or for the Recipient by persons who had no access to, knowledge of, or reference to any part of the Discloser's Confidential Information.\n\nCOMPELLED AND MANDATED DISCLOSURES\n\n5.1 If the Recipient or any of its Representatives becomes legally compelled, mandated, or requested by a subpoena, summons, discovery request, or formal investigative demand issued by a court of competent jurisdiction, arbitral tribunal, or regulatory authority having lawful cognizance over the Recipient to disclose any of the Discloser's Confidential Information, the Recipient shall, to the extent permitted by Applicable Law:\n\n5.1.1 give prompt written notice of such requirement to the Discloser so that the Discloser may seek a protective order, injunctive relief, or other appropriate legal remedy; and\n\n5.1.2 provide, at the Discloser's sole cost and expense, all reasonable cooperation and assistance that the Discloser may reasonably require in opposing, narrowing, or securing confidential treatment for such proposed disclosure.\n\n5.2 In the event that the Discloser is unable to obtain a protective order or other appropriate remedy, or elects not to contest the compelled disclosure, the Recipient shall disclose only that portion of the Confidential Information which it is advised by reputable written legal opinion it is strictly compelled and legally obligated to furnish.\n\n5.3 In the event that any administrative, government, judicial, or regulatory agency or tribunal orders, directs, or seeks the compulsory production or disclosure of any Confidential Information belonging to the Discloser from the Recipient, the Recipient shall not disclose such Confidential Information unless the Recipient has first, at the Recipient's sole expense and cost, instituted, pursued, and exhausted all available legal motions, appeals, and formal proceedings to quash, challenge, and resist such disclosure order; and in the event such disclosure cannot be averted, the Recipient shall remain strictly liable to the Discloser for any and all resulting compromise to the proprietary value and exclusivity of the Discloser's Confidential Information.\n\nRETURN OR DESTRUCTION OF CONFIDENTIAL INFORMATION\n\n6.1 Upon the written demand or request of the Discloser at any time, or upon the formal expiration or termination of this Agreement, the Recipient shall, within fourteen (14) calendar days of receipt of such instruction:\n\n6.1.1 promptly deliver up and return to the Discloser, or at the Discloser's written election, safely and completely destroy, expunge, and shred, all originals, copies, transcripts, records, and embodiments of the Discloser's Confidential Information in its possession, custody, or control;\n\n6.1.2 permanently delete and purge all electronic, digital, and magnetic representations of such Confidential Information from all computer servers, workstations, databases, portable memory devices, and electronic networks belonging to or controlled by the Recipient; and\n\n6.1.3 provide to the Discloser a formal written certificate and declaration signed by a duly authorized director or statutory officer of the Recipient confirming that full and strict compliance with the stipulations of this Clause 6 has been achieved.\n\n6.2 Notwithstanding the provisions of Clause 6.1, the Recipient and its Representatives may retain such minimal archival copies of the Discloser's Confidential Information as are strictly necessary to satisfy mandatory statutory compliance, professional regulatory auditing requirements, or automated electronic disaster recovery backups maintained in the ordinary course of business, provided always that any such retained archival data shall remain subject to the ongoing obligations of confidentiality and non-use under this Agreement for the entire duration of its retention.\n\nINDEMNIFICATION\n\n7.1 The Recipient shall defend, hold harmless, and indemnify the Discloser, its Affiliates, and their respective directors, officers, agents, and employees in full and on demand against any and all claims, demands, causes of action, liabilities, damages, awards, judgments, fines, penalties, settlements, losses, costs, charges, and expenses (including, without limitation, all reasonable legal fees, expert witness charges, court costs, and expenses of litigation) of whatsoever nature or kind, whether direct, indirect, special, punitive, or consequential, suffered, sustained, or incurred by the Discloser or any of its Affiliates arising out of, in connection with, or as a consequence of any breach, non-observance, or default by the Recipient or its Representatives of any covenant, duty, restriction, or obligation contained in this Agreement.\n\nNON-SOLICITATION OF EMPLOYEES\n\n8.1 During the term of this Agreement and for a period of twenty-four (24) months following the date of termination or expiration of this Agreement, neither Party shall, directly or indirectly, on its own behalf or on behalf of any third party, solicit, recruit, induce, entice away, employ, engage, or hire (whether as an employee, worker, independent contractor, consultant, or otherwise) any person who is, or was at any time during the term of this Agreement, an employee, officer, or contractor of the other Party or any of its Affiliates, without obtaining the prior written consent and authorization of such other Party.\n\nTERM AND TERMINATION\n\n9.1 This Agreement shall commence upon the Effective Date and shall continue in full force and effect for a primary term of two (2) years, unless terminated earlier by either Party upon serving thirty (30) calendar days' written notice to the other Party.\n\n9.2 The expiration or termination of this Agreement for any reason shall not prejudice, impair, or affect any accrued rights, remedies, or liabilities of either Party up to the date of such termination or expiration.\n\n9.3 The duties, obligations, restrictions, and covenants of confidentiality and non-use set forth in this Agreement shall survive the expiration or termination of this Agreement and shall endure and continue in full force and effect for a period of five (5) years following the date of expiration or termination; provided, however, that in respect of any Confidential Information that constitutes a trade secret under applicable law, such covenants and restrictions shall endure indefinitely for so long as the underlying information retains its character as a trade secret.\n\nPROPRIETARY RIGHTS AND NO LICENCE\n\n10.1 All right, title, interest, and intellectual property rights in and to the Confidential Information shall remain vested exclusively in the Discloser or its lawful licensors.\n\n10.2 Nothing contained in this Agreement, nor any disclosure of Confidential Information made pursuant hereto, shall be construed or deemed as conferring or granting, expressly, impliedly, by estoppel, or otherwise, any right, title, license, patent, trademark, copyright, or other intellectual property right in or to the Confidential Information to the Recipient, save for the strictly restricted and revocable right to review such information for the Permitted Purpose.\n\n10.3 Each Party acknowledges and agrees that the Confidential Information is furnished strictly on an \"as is\" and \"as available\" basis, and the Discloser makes no covenant, condition, representation, or warranty, whether express, statutory, or implied, regarding the accuracy, completeness, reliability, efficacy, or fitness for any particular purpose of any Confidential Information disclosed hereunder.\n\nEQUITABLE RELIEF\n\n11.1 Each Party acknowledges that any breach, infraction, or threatened breach of the provisions of this Agreement may result in irreparable harm, loss, and injury to the Discloser, the exact financial value of which may be difficult or impossible to ascertain, and for which monetary damages alone would not provide an adequate or sufficient legal remedy.\n\n11.2 Accordingly, each Party agrees that, in addition to any other remedies, rights, or actions available at law or in equity, the Discloser shall be entitled, without the necessity of proving actual damages or posting any bond, surety, or other security, to seek and obtain preliminary, interlocutory, and permanent injunctive relief, orders for specific performance, and any other equitable remedies to restrain or prevent any ongoing or threatened breach of this Agreement.\n\nMISCELLANEOUS PROVISIONS\n\n12.1 Entire Agreement: This Agreement constitutes the complete, entire, and exclusive understanding and agreement between the Parties with respect to the subject matter hereof, and supersedes, cancels, and replaces all prior discussions, negotiations, proposals, representations, understandings, and draft agreements, whether written or oral, relating thereto.\n\n12.2 Amendments: No amendment, alteration, waiver, variation, or modification of this Agreement shall be valid, binding, or enforceable unless it is made in writing and duly executed by authorized signatories of each of the Parties.\n\n12.3 Assignment: Neither Party shall assign, transfer, sub-contract, charge, encumber, or otherwise dispose of this Agreement or any of its rights, benefits, interests, or obligations hereunder, in whole or in part, without the express prior written approval of the other Party.\n\n12.4 Severability: If any term, condition, or provision of this Agreement shall be held, adjudicated, or declared by any court or tribunal of competent jurisdiction to be void, invalid, illegal, or unenforceable, such invalidity, illegality, or unenforceability shall not affect or impair the validity or enforceability of any other provision, and the remaining provisions shall continue in full force and effect.\n\n12.5 Waiver: The failure or delay of either Party to enforce or exercise any provision, right, power, or remedy under this Agreement shall not operate as a waiver thereof, nor shall any single or partial exercise of any right, power, or remedy preclude any other or further exercise thereof.\n\n12.6 Counterparts: This Agreement may be executed in any number of counterparts, and by each Party on separate counterparts, each of which when so executed and delivered shall be deemed an original, but all the counterparts together shall constitute one and the same instrument. Transmission of an executed signature page of a counterpart of this Agreement by email or via recognized electronic signature software shall be effective and legally binding.\n\n12.7 Third Party Rights: A person who is not a party to this Agreement shall have no right under the Contracts (Rights of Third Parties) Act 1999 to enforce, benefit from, or rely upon any term or provision of this Agreement.\n\n12.8 Governing Law and Jurisdiction: This Agreement and any dispute, controversy, proceeding, or claim of whatever nature (including non-contractual disputes or claims) arising out of or in connection with it or its subject matter, interpretation, or formation, shall be governed by and construed in accordance with the laws of England and Wales. Each Party irrevocably and unconditionally submits to the exclusive jurisdiction of the courts of England and Wales to hear, settle, and determine any suit, action, dispute, or proceeding arising out of or in connection with this Agreement.\n\nIN WITNESS WHEREOF, the Parties have caused this Agreement to be executed by their respective duly authorized officers and representatives on the date first written above.\n\nSIGNED for and on behalf of\nBALLYMOTE ENTERPRISE SYSTEMS LIMITED\n\nBy: _________________________________\nName: Cormac Gallagher\nTitle: Managing Director\nDate: _______________________________\n\nSIGNED for and on behalf of\nHALYARD SOFTWARE LTD\n\nBy: _________________________________\nName: _______________________________\nTitle: _______________________________\nDate: _______________________________\n", "C25": "MUTUAL NON-DISCLOSURE AGREEMENT\n\nTHIS MUTUAL NON-DISCLOSURE AGREEMENT (the \"Agreement\") is made and entered into as of 14 November 2026 (the \"Effective Date\"), by and between:\n\n(1) VANDENBERG STRATEGY & TECHNOLOGY ADVISORY B.V., a private limited liability company (besloten vennootschap met beperkte aansprakelijkheid) incorporated under the laws of the Netherlands, having its statutory seat in Amsterdam, the Netherlands, and its principal place of business at Keizersgracht 482, 1016 EG Amsterdam, registered with the Dutch Chamber of Commerce (Kamer van Koophandel) under registration number 68412953 (\"Vandenberg\"); and\n\n(2) HALYARD SOFTWARE LTD, a company incorporated and registered in England and Wales under company registration number 09876543, having its registered office at 12 Mill Lane, Manchester M1 2AB, United Kingdom (\"Halyard\").\n\nVandenberg and Halyard may hereinafter individually be referred to as a \"Party\" and collectively as the \"Parties\".\n\nPREAMBLE\n\nWHEREAS, the Parties are engaged in preliminary discussions exploring potential strategic collaboration, joint consulting engagements, and technical integration opportunities (the \"Authorized Purpose\"); and\n\nWHEREAS, in connection with evaluating and pursuing the Authorized Purpose, each Party may disclose to the other Party certain non-public, proprietary, or competitively sensitive commercial, organizational, and technological information; and\n\
