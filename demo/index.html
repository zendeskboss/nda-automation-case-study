 Party to the Receiving Party in connection with the Purpose, whether before, on or after the date of this Agreement, and which is either marked or identified as confidential at the time of disclosure or would reasonably be considered confidential given the nature of the information and the circumstances of its disclosure. Confidential Information includes any copies, analyses, compilations, notes or other documents prepared by the Receiving Party or its Representatives to the extent that they contain, reflect or are derived from such information.\n1.1.3 Data Protection Legislation means the UK GDPR (as defined in section 3(10) of the Data Protection Act 2018), the Data Protection Act 2018, the Privacy and Electronic Communications Regulations 2003, and all other applicable laws and regulations relating to the processing of personal data and privacy in force from time to time.\n1.1.4 Disclosing Party means the Party that discloses, or procures the disclosure of, Confidential Information to the other Party under or in connection with this Agreement.\n1.1.5 Group means, in relation to a Party, that Party, any subsidiary or holding company from time to time of that Party, and any subsidiary from time to time of a holding company of that Party. Each company in a Group is a member of the Group.\n1.1.6 Receiving Party means the Party that receives Confidential Information from or on behalf of the Disclosing Party under or in connection with this Agreement.\n1.1.7 Representatives means, in relation to a Party, the employees, officers, directors, [[INS: independent contractors,]] professional [[DEL: advisers]] [[INS: advisors]], auditors and insurers of that Party and of any member of its Group.\n1.1.8 Trade Secret means any Confidential Information that constitutes a trade secret within the meaning of Regulation 2 of the Trade Secrets (Enforcement, etc.) Regulations 2018.\n1.2 In this Agreement, unless the context otherwise requires:\n1.2.1 a reference to a statute or statutory provision is a reference to it as amended, extended or re-enacted from time to time;\n1.2.2 the words \"including\", \"include\", \"in particular\" or any similar expression shall be construed as illustrative and shall not limit the sense of the words preceding those terms;\n1.2.3 a reference to a \"person\" includes a natural person, corporate or unincorporated body (whether or not having separate legal personality);\n1.2.4 a reference to a \"company\", \"subsidiary\" or \"holding company\" shall be construed in accordance with section 1159 of the Companies Act 2006; and\n1.2.5 a reference to \"writing\" or \"written\" includes email.\n2. Confidentiality Obligations\n2.1 In consideration of the Disclosing Party making Confidential Information available to the Receiving Party, the Receiving Party undertakes to the Disclosing Party that it shall:\n2.1.1 keep the Disclosing Party's Confidential Information secret and strictly confidential;\n2.1.2 not use or exploit the Disclosing Party's Confidential Information in any way except solely for the Purpose;\n2.1.3 not directly or indirectly disclose, or make available, any of the Disclosing Party's Confidential Information in whole or in part to any third party, except as expressly permitted by this Agreement;\n2.1.4 apply to the Disclosing Party's Confidential Information no lesser security measures and degree of care than those which the Receiving Party applies to its own confidential information of a similar nature, and in any event no less than a reasonable standard of care, to prevent [[DEL: unauthorised]] [[INS: unauthorized]] disclosure, copying or use; and\n2.1.5 not reverse engineer, decompile, disassemble or otherwise attempt to derive the composition, source code or underlying structure of any software, prototypes or other tangible objects provided to it which embody the Disclosing Party's Confidential Information.\n2.2 Each Party shall immediately notify the other Party in writing if it becomes aware of erous than the terms of this Agreement; and\n4.1.3 remain at all times fully liable to the Disclosing Party for all acts or omissions of its Representatives and members of its Group as if they were the acts or omissions of the Receiving Party itself.\n5. Compelled Disclosure\n5.1 The Receiving Party may disclose the Disclosing Party's Confidential Information to the minimum extent required by an order of any court of competent jurisdiction or any regulatory, judicial, governmental or similar body, or by the rules of any recognised stock exchange on which the shares of the Receiving Party or any member of its Group are listed, or by any other applicable law or regulation.\n5.2 Before making any disclosure pursuant to Clause 5.1, the Receiving Party shall, to the extent that it is legally permitted to do so:\n5.2.1 give the Disclosing Party as much prior written notice of the required disclosure as is reasonably practicable in the circumstances;\n5.2.2 consult with the Disclosing Party as to the proposed form, timing, nature and purpose of the disclosure; and\n5.2.3 take all reasonable steps requested by the Disclosing Party (at the Disclosing Party's cost) to resist or narrow the scope of the required disclosure and to obtain confidential treatment or protective orders from the relevant court or authority in respect of the Confidential Information to be disclosed.\n5.3 Where the Receiving Party is unable to inform the Disclosing Party before Confidential Information is disclosed pursuant to Clause 5.1, it shall (to the extent that it is legally permitted to do so) inform the Disclosing Party of the full circumstances of the disclosure and the exact information that has been disclosed as soon as reasonably practicable after such disclosure has been made.\n6. Return and Destruction of Confidential Information\n6.1 If requested in writing at any time by the Disclosing Party, the Receiving Party shall, within ten Business Days of receipt of such request:\n6.1.1 destroy or permanently erase, or (at the Disclosing Party's option) return to the Disclosing Party, all documents and tangible materials in its possession, custody or control that contain or record any of the Disclosing Party's Confidential Information;\n6.1.2 procure that its Representatives and members of its Group to whom Confidential Information has been disclosed take the steps referred to in Clause 6.1.1; and\n6.1.3 confirm in writing to the Disclosing Party, by a statement signed by a duly [[DEL: authorised]] [[INS: authorized]] officer of the Receiving Party, that it has complied in full with its obligations under this Clause 6.1.\n6.2 Notwithstanding Clause 6.1, the Receiving Party and its Representatives may retain:\n6.2.1 copies of any Confidential Information that are securely stored in routine, automated electronic backup or archiving systems which are not readily accessible in the ordinary course of business; and\n6.2.2 such copies of Confidential Information as are strictly required to be retained by applicable law, regulation, professional standards or the rules of any competent regulatory authority to which the Receiving Party or the relevant Representative is subject.\n6.3 Any Confidential Information retained by the Receiving Party or its Representatives pursuant to Clause 6.2 shall remain subject to the confidentiality and non-use obligations set out in this Agreement for so long as such information is retained, notwithstanding the expiry or termination of this Agreement.\n7. Ownership, No Licence and No Warranty\n7.1 All Confidential Information, and all intellectual property rights in or relating to it, shall remain the exclusive property of the Disclosing Party (or its licensors, as applicable).\n7.2 No right or [[DEL: licence]] [[INS: license]], express or implied, is granted to the Receiving Party or any of its Representatives in respect of the Disclosing Party's Confidential Information or any intellectual property rights of the Disclosing Party, ot ch personal data unless and until the Parties have agreed and entered into a separate written data processing agreement or data sharing agreement that complies with the requirements of the Data Protection Legislation.\n10. Term and Survival\n10.1 This Agreement shall come into force on the date set out at the head of this Agreement and shall continue in full force and effect for a period of two (2) years, unless terminated earlier by either Party giving not less than thirty (30) days' prior written notice to the other Party.\n10.2 Expiry or termination of this Agreement shall not affect any accrued rights, remedies, obligations or liabilities of the Parties existing at the date of expiry or termination.\n10.3 The obligations of confidentiality and non-use contained in this Agreement shall survive the expiry or termination of this Agreement for a period of three (3) years from the effective date of expiry or termination, save that in respect of any Confidential Information that constitutes a Trade Secret, such obligations shall continue in full force and effect for so long as that information remains a Trade Secret under applicable law. [[COMMENT: Our standard corporate policy is a 2-year survival period for general Confidential Information (excluding Trade Secrets, which we agree should remain protected for so long as they qualify as trade secrets). Would Halyard be open to reducing this from 3 years to 2 years?]]\n11. Remedies\n11.1 Each Party acknowledges and agrees that damages alone may not be an adequate remedy for any breach or threatened breach of the terms of this Agreement by the Receiving Party. Accordingly, a Party shall be entitled to seek the remedies of injunction, specific performance and other equitable relief for any threatened or actual breach of this Agreement by the other Party, without proof of special damage.\n11.2 The rights and remedies provided under this Agreement are cumulative and do not exclude any rights or remedies provided by law.\n12. General\n12.1 Neither Party may assign, novate, transfer, mortgage, charge, subcontract, declare a trust over or deal in any other manner with any or all of its rights or obligations under this Agreement without the prior written consent of the other Party.\n12.2 Any notice given to a Party under or in connection with this Agreement shall be in writing and shall be delivered by hand or by pre-paid first-class post or other next working day delivery service [[INS: (or reputable international courier)]] at its [[DEL: registered]] [[INS: principal]] office (as set out at the start of this Agreement) or sent by email to the primary contact email address notified by that Party for the Purpose [[INS: (with a copy to legal@veridiancloud.io in the case of notices to Counterparty)]]. A notice shall be deemed to have been received: if delivered by hand, on signature of a delivery receipt; if sent by post [[INS: or courier]], at 9.00 am on the second Business Day after posting [[INS: (or fifth Business Day in the case of international courier)]]; and if sent by email, at the time of transmission (or, if this time falls outside normal business hours in the place of receipt, when normal business hours resume on the next Business Day), provided no automated notification of non-delivery is received. This Clause 12.2 does not apply to the service of any proceedings or other documents in any legal action.\n12.3 No variation of this Agreement shall be effective unless it is in writing and signed by the Parties (or their [[DEL: authorised]] [[INS: authorized]] representatives).\n12.4 A waiver of any right or remedy under this Agreement or by law is only effective if given in writing and shall not be deemed a waiver of any subsequent right or remedy. A failure or delay by a Party to exercise any right or remedy provided under this Agreement or by law shall not constitute a waiver of that or any other right or remedy.\n12.5 If any provision or part-provision of this Agreement is or be e, to prevent unauthorised disclosure, copying or use; and\n2.1.5 not reverse engineer, decompile, disassemble or otherwise attempt to derive the composition, source code or underlying structure of any software, prototypes or other tangible objects provided to it which embody the Disclosing Party's Confidential Information.\n2.2 Each Party shall immediately notify the other Party in writing if it becomes aware of any actual or suspected unauthorised use, copying or disclosure of any of the Disclosing Party's Confidential Information, and shall provide all reasonable assistance to the Disclosing Party in connection with any action or proceedings which the Disclosing Party may institute in respect of such unauthorised use, copying or disclosure.\n3. Exceptions to Confidentiality\n3.1 The obligations set out in Clause 2 shall not apply to any information which the Receiving Party can demonstrate by [[DEL: written records or other reasonable]][[INS: contemporaneous documentary]] evidence:\n3.1.1 is in, or enters, the public domain other than as a direct or indirect result of a breach of this Agreement by the Receiving Party or any of its Representatives;\n3.1.2 was already lawfully in the possession of the Receiving Party prior to its disclosure by or on behalf of the Disclosing Party, free from any restriction as to its use or disclosure, [[INS: as evidenced by the Receiving Party's written records dated prior to the date of this Agreement]]; [[INS: or]]\n3.1.3 is lawfully received by the Receiving Party after the date of this Agreement from an independent third party who is not under any obligation of confidentiality to the Disclosing Party in respect of that information[[DEL: ; or]][[INS: .]]\n[[DEL: 3.1.4 is independently developed by or on behalf of the Receiving Party without access to, use of, or reference to any of the Disclosing Party's Confidential Information.]]\n4. Permitted Disclosures\n4.1 The Receiving Party may disclose the Disclosing Party's Confidential Information to those of its Representatives and members of its Group who strictly need to know such Confidential Information in order to evaluate or further the Purpose, provided that the Receiving Party shall:\n4.1.1 inform each such Representative and Group member of the confidential nature of the Confidential Information before disclosure is made;\n4.1.2 ensure that each such Representative and Group member is bound by written or professional obligations of confidentiality in respect of the Confidential Information which are no less onerous than the terms of this Agreement; and\n4.1.3 remain at all times fully liable to the Disclosing Party for all acts or omissions of its Representatives and members of its Group as if they were the acts or omissions of the Receiving Party itself.\n5. Compelled Disclosure\n5.1 The Receiving Party may disclose the Disclosing Party's Confidential Information to the minimum extent required by an order of any court of competent jurisdiction or any regulatory, judicial, governmental or similar body, or by the rules of any recognised stock exchange on which the shares of the Receiving Party or any member of its Group are listed, or by any other applicable law or regulation.\n5.2 Before making any disclosure pursuant to Clause 5.1, the Receiving Party shall, to the extent that it is legally permitted to do so:\n5.2.1 give the Disclosing Party as much prior written notice of the required disclosure as is reasonably practicable in the circumstances;\n5.2.2 consult with the Disclosing Party as to the proposed form, timing, nature and purpose of the disclosure; and\n5.2.3 take all reasonable steps requested by the Disclosing Party (at the Disclosing Party's cost) to resist or narrow the scope of the required disclosure and to obtain confidential treatment or protective orders from the relevant court or authority in respect of the Confidential Information to be disclosed.\n5.3 Where the Receiving Party is unable to inform the Disclosing Party before Confidential Information is disclosed pursuant to Clause 5.1, it shall (to the extent that it is legally permitted to do so) inform the Disclosing Party of the full circumstances of the disclosure and the exact information that has been disclosed as soon as reasonably practicable after such disclosure has been made.\n6. Return and Destruction of Confidential Information\n6.1 If requested in writing at any time by the Disclosing Party, the Receiving Party shall, within ten Business Days of receipt of such request:\n6.1.1 destroy or permanently erase, or (at the Disclosing Party's option) return to the Disclosing Party, all documents and tangible materials in its possession, custody or control that contain or record any of the Disclosing Party's Confidential Information;\n6.1.2 procure that its Representatives and members of its Group to whom Confidential Information has been disclosed take the steps referred to in Clause 6.1.1; and\n6.1.3 confirm in writing to the Disclosing Party, by a statement signed by a duly authorised officer of the Receiving Party, that it has complied in full with its obligations under this Clause 6.1.\n6.2 Notwithstanding Clause 6.1, the Receiving Party and its Representatives may retain:\n6.2.1 copies of any Confidential Information that are securely stored in routine, automated electronic backup or archiving systems which are not readily accessible in the ordinary course of business; and\n6.2.2 such copies of Confidential Information as are strictly required to be retained by applicable law, regulation, professional standards or the rules of any competent regulatory authority to which the Receiving Party or the relevant Representative is subject.\n6.3 Any Confidential Information retained by the Receiving Party or its Representatives pursuant to Clause 6.2 shall remain subject to the confidentiality and non-use obligations set out in this Agreement for so long as such information is retained, notwithstanding the expiry or termination of this Agreement.\n7. Ownership, No Licence and No Warranty\n7.1 All Confidential Information, and all intellectual property rights in or relating to it, shall remain the exclusive property of the Disclosing Party (or its licensors, as applicable).\n7.2 No right or licence, express or implied, is granted to the Receiving Party or any of its Representatives in respect of the Disclosing Party's Confidential Information or any intellectual property rights of the Disclosing Party, other than the limited right to use the Confidential Information solely for the Purpose in accordance with the terms of this Agreement.\n7.3 All Confidential Information is provided by the Disclosing Party on an \"as is\" basis. Neither Party makes any representation or gives any warranty, express or implied, as to the accuracy, completeness, adequacy or fitness for a particular purpose of any Confidential Information disclosed under this Agreement.\n7.4 [[DEL: Neither the Disclosing Party nor any of its Representatives shall have any liability to the Receiving Party or to any other person resulting from the use of, or reliance upon, the Confidential Information by the Receiving Party, save that nothing in this Agreement shall exclude or limit either Party's liability for fraud or fraudulent misrepresentation.]][[INS: Save as hereinafter expressly provided to the contrary, neither the Disclosing Party nor any of its Representatives whosoever shall incur or be subject to any liability howsoever arising, whether in contract, tort (including negligence), breach of statutory duty or otherwise, unto the Receiving Party or any third party whomsoever resulting from the utilisation of, or reliance upon, the Confidential Information by the Receiving Party; provided always that, notwithstanding the foregoing or anything else herein contained, nothing in this Agreement shall operate or be construed so as to exclude, restrict or limit the liability of either Party in respect of fraud or fraudulent iness Day), provided no automated notification of non-delivery is received. This Clause 12.2 does not apply to the service of any proceedings or other documents in any legal action.\n12.3 No variation of this Agreement shall be effective unless it is in writing and signed by the Parties (or their authorised representatives).\n12.4 A waiver of any right or remedy under this Agreement or by law is only effective if given in writing and shall not be deemed a waiver of any subsequent right or remedy. A failure or delay by a Party to exercise any right or remedy provided under this Agreement or by law shall not constitute a waiver of that or any other right or remedy.\n12.5 If any provision or part-provision of this Agreement is or becomes invalid, illegal or unenforceable, it shall be deemed modified to the minimum extent necessary to make it valid, legal and enforceable. If such modification is not possible, the relevant provision or part-provision shall be deemed deleted. Any modification to or deletion of a provision or part-provision under this Clause 12.5 shall not affect the validity and enforceability of the rest of this Agreement.\n12.6 Nothing in this Agreement is intended to, or shall be deemed to, establish any partnership or joint venture between the Parties, constitute either Party the agent of the other Party, or authorise either Party to make or enter into any commitments for or on behalf of the other Party.\n12.7 A person who is not a party to this Agreement shall not have any rights under the Contracts (Rights of Third Parties) Act 1999 to enforce any term of this Agreement.\n12.8 This Agreement constitutes the entire agreement between the Parties and supersedes and extinguishes all previous agreements, promises, assurances, warranties, representations and understandings between them, whether written or oral, relating to its subject matter.\n12.9 This Agreement may be executed in any number of counterparts, each of which when executed shall constitute a duplicate original, but all the counterparts shall together constitute the one agreement. Execution by a Party by means of an electronic signature platform shall be as valid and effectual as if executed by handwritten signature.\n12.10 This Agreement and any dispute or claim (including non-contractual disputes or claims) arising out of or in connection with it or its subject matter or formation shall be governed by and construed in accordance with the law of England and Wales.\n12.11 Each Party irrevocably agrees that the courts of England and Wales shall have exclusive jurisdiction to settle any dispute or claim (including non-contractual disputes or claims) arising out of or in connection with this Agreement or its subject matter or formation.\nThis Agreement has been entered into on the date stated at the beginning of it.\nSigned for and on behalf of HALYARD SOFTWARE LTD\nSignature: ______________________________\nName: ______________________________\nTitle: ______________________________\nDate: ______________________________\nSigned for and on behalf of VECTRAFLOW ANALYTICS LTD\nSignature: ______________________________\nName: ______________________________\nTitle: ______________________________\nDate: ______________________________\n", "C10": "THIS AGREEMENT is dated [[DEL: [DATE]]] [[INS: 14 October 2026]]\nBETWEEN\n(1) HALYARD SOFTWARE LTD, a company incorporated and registered in England and Wales with company number 09876543 whose registered office is at 12 Mill Lane, Manchester M1 2AB (Halyard); and\n(2) [[DEL: [COUNTERPARTY NAME]]] [[INS: SKANDIA LOGISTIK AB]], a company incorporated and registered in [[DEL: [JURISDICTION]]] [[INS: Sweden]] with company number [[DEL: [NUMBER]]] [[INS: 556912-3489]] whose registered office is at [[DEL: [ADDRESS]]] [[INS: Sveavägen 44, 111 34 Stockholm, Sweden]] (Counterparty),\neach a Party and together the Parties.\nBACKGROUND\n(A) The Parties wish to enter into discussions regarding a potential commercial relationship between them [[INS: concerning supply chain and freight management software]] (the Purpose).\n(B) In connection with the Purpose, each Party may disclose certain Confidential Information to the other Party. The Parties have agreed to regulate the disclosure and use of such Confidential Information on the terms set out in this Agreement.\nAGREED TERMS\n1. Definitions and Interpretation\n1.1 In this Agreement, the following definitions apply:\n1.1.1 Business Day means a day other than a Saturday, Sunday or public holiday in England [[INS: or Sweden]] when banks in London [[INS: and Stockholm]] are open for business.\n1.1.2 Confidential Information means any information, however conveyed or presented, that relates to the business, affairs, operations, customers, processes, budgets, pricing, product roadmaps, software, source code, technical specifications, algorithms, know-how or trade secrets of the Disclosing Party or any member of its Group, which is disclosed by or on behalf of the Disclosing Party to the Receiving Party in connection with the Purpose, whether before, on or after the date of this Agreement, and which is either marked or identified as confidential at the time of disclosure or would reasonably be considered confidential given the nature of the information and the circumstances of its disclosure. Confidential Information includes any copies, analyses, compilations, notes or other documents prepared by the Receiving Party or its Representatives to the extent that they contain, reflect or are derived from such information.\n1.1.3 Data Protection Legislation means the UK GDPR (as defined in section 3(10) of the Data Protection Act 2018), the Data Protection Act 2018, the Privacy and Electronic Communications Regulations 2003, [[INS: Regulation (EU) 2016/679 (the EU GDPR),]] and all other applicable laws and regulations relating to the processing of personal data and privacy in force from time to time.\n1.1.4 Disclosing Party means the Party that discloses, or procures the disclosure of, Confidential Information to the other Party under or in connection with this Agreement.\n1.1.5 Group means, in relation to a Party, that Party, any subsidiary or holding company from time to time of that Party, and any subsidiary from time to time of a holding company of that Party. Each company in a Group is a member of the Group.\n1.1.6 Receiving Party means the Party that receives Confidential Information from or on behalf of the Disclosing Party under or in connection with this Agreement.\n1.1.7 Representatives means, in relation to a Party, the employees, officers, directors, professional advisers, auditors and insurers of that Party and of any member of its Group.\n1.1.8 Trade Secret means any Confidential Information that constitutes a trade secret within the meaning of Regulation 2 of the Trade Secrets (Enforcement, etc.) Regulations 2018.\n1.2 In this Agreement, unless the context otherwise requires:\n1.2.1 a reference to a statute or statutory provision is a reference to it as amended, extended or re-enacted from time to time;\n1.2.2 the words \"including\", \"include\", \"in particular\" or any similar expression shall be construed as illustrative and shall not limit the sense of the words preceding those terms;\n1.2.3 a reference to a \"person\" includes a natural person, corporate or unincorporated body (whether or not having separate legal personality);\n1.2.4 a reference to a \"company\", \"subsidiary\" or \"holding company\" shall be construed in accordance with section 1159 of the Companies Act 2006; and\n1.2.5 a reference to \"writing\" or \"written\" includes email.\n2. Confidentiality Obligations\n2.1 In consideration of the Disclosing Party making Confidential Information available to the Receiving Party, the Receiving Party undertakes to the Disclosing Party that it shall:\n2.1.1 keep the Disclosing Party's Confidential Information secret and strictly confidential;\n2.1.2 not use or exploit the Disclosing Party's Confidential Information in any way except solely for the Purpose[[INS: , and during the term of this Agreement and for twelve (12) months thereafter, Halyard shall not provide software or services similar to those discussed under the Purpose to any other logistics or freight transport enterprise operating in the Nordic region]];\n2.1.3 not directly or indirectly disclose, or make available, any of the Disclosing Party's Confidential Information in whole or in part to any third party, except as expressly permitted by this Agreement;\n2.1.4 apply to the Disclosing Party's Confidential Information no lesser security measures and degree of care than those which the Receiving Party applies to its own confidential information of a similar nature, and in any event no less than a reasonable standard of care, to prevent unauthorised disclosure, copying or use; and\n2.1.5 not reverse engineer, decompile, disassemble or otherwise attempt to derive the composition, source code or underlying structure of any software, prototypes or other tangible objects provided to it which embody the Disclosing Party's Confidential Information.\n2.2 Each Party shall immediately notify the other Party in writing if it becomes aware of any actual or suspected unauthorised use, copying or disclosure of any of the Disclosing Party's Confidential Information, and shall provide all reasonable assistance to the Disclosing Party in connection with any action or proceedings which the Disclosing Party may institute in respect of such unauthorised use, copying or disclosure.\n3. Exceptions to Confidentiality\n3.1 The obligations set out in Clause 2 shall not apply to any information which the Receiving Party can demonstrate by written records [[DEL: or other reasonable evidence]]:\n3.1.1 is in, or enters, the public domain other than as a direct or indirect result of a breach of this Agreement by the Receiving Party or any of its Representatives; [[INS: or]]\n3.1.2 was already lawfully in the possession of the Receiving Party prior to its disclosure by or on behalf of the Disclosing Party, free from any restriction as to its use or disclosure[[DEL: ;]] [[INS: .]]\n3.1.3 [[DEL: is lawfully received by the Receiving Party after the date of this Agreement from an independent third party who is not under any obligation of confidentiality to the Disclosing Party in respect of that information; or]]\n3.1.4 [[DEL: is independently developed by or on behalf of the Receiving Party without access to, use of, or reference to any of the Disclosing Party's Confidential Information.]]\n4. Permitted Disclosures\n4.1 The Receiving Party may disclose the Disclosing Party's Confidential Information to those of its Representatives and members of its Group who strictly need to know such Confidential Information in order to evaluate or further the Purpose, provided that the Receiving Party shall:\n4.1.1 inform each such Representative and Group member of the confidential nature of the Confidential Information before disclosure is made;\n4.1.2 ensure that each such Representative and Group member is bound by written or professional obligations of confidentiality in respect of the Confidential Information which are no less onerous than the terms of this Agreement; and\n4.1.3 remain at all times fully liable to the Disclosing Party for all acts or omissions of its Representatives and members of its Group as if they were the acts or omissions of the Receiving Party itself.\n5. Compelled Disclosure\n5.1 The Receiving Party may disclose the Disclosing Party's Confidential Information to the minimum extent required by an order of any court of competent jurisdiction or any regulatory, judicial, governmental or similar body, or by the rules of any recognised stock exchange on which the shares of the Receiving Party or any member of its Group are listed, or by any other applicable law or regulation.\n5.2 Before making any disclosure pursuant to Clause 5.1, the Receiving Party shall, to the extent that it is legally permitted to do so:\n5.2.1 give the Disclosing Party as much prior written notice of the required disclosure as is reasonably practicable in the circumstances;\n5.2.2 consult with the Disclosing Party as to the proposed form, timing, nature and purpose of the disclosure; and\n5.2.3 take all reasonable steps requested by the Disclosing Party (at the Disclosing Party's cost) to resist or narrow the scope of the required disclosure and to obtain confidential treatment or protective orders from the relevant court or authority in respect of the Confidential Information to be disclosed.\n5.3 Where the Receiving Party is unable to inform the Disclosing Party before Confidential Information is disclosed pursuant to Clause 5.1, it shall (to the extent that it is legally permitted to do so) inform the Disclosing Party of the full circumstances of the disclosure and the exact information that has been disclosed as soon as reasonably practicable after such disclosure has been made.\n6. Return and Destruction of Confidential Information\n6.1 If requested in writing at any time by the Disclosing Party, the Receiving Party shall, within [[DEL: ten]] [[INS: twenty]] Business Days of receipt of such request:\n6.1.1 destroy or permanently erase, or (at the Disclosing Party's option) return to the Disclosing Party, all documents and tangible materials in its possession, custody or control that contain or record any of the Disclosing Party's Confidential Information;\n6.1.2 procure that its Representatives and members of its Group to whom Confidential Information has been disclosed take the steps referred to in Clause 6.1.1; and\n6.1.3 confirm in writing to the Disclosing Party, by a statement signed by a duly authorised officer of the Receiving Party, that it has complied in full with its obligations under this Clause 6.1.\n6.2 Notwithstanding Clause 6.1, the Receiving Party and its Representatives may retain:\n6.2.1 copies of any Confidential Information that are securely stored in routine, automated electronic backup or archiving systems which are not readily accessible in the ordinary course of business; and\n6.2.2 such copies of Confidential Information as are strictly required to be retained by applicable law, regulation, professional standards or the rules of any competent regulatory authority to which the Receiving Party or the relevant Representative is subject.\n6.3 Any Confidential Information retained by the Receiving Party or its Representatives pursuant to Clause 6.2 shall remain subject to the confidentiality and non-use obligations set out in this Agreement for so long as such information is retained, notwithstanding the expiry or termination of this Agreement.\n7. Ownership, No Licence and No Warranty\n7.1 All Confidential Information, and all intellectual property rights in or relating to it, shall remain the exclusive property of the Disclosing Party (or its licensors, as applicable).\n7.2 No right or licence, express or implied, is granted to the Receiving Party or any of its Representatives in respect of the Disclosing Party's Confidential Information or any intellectual property rights of the Disclosing Party, other than the limited right to use the Confidential Information solely for the Purpose in accordance with the terms of this Agreement.\n7.3 All Confidential Information is provided by the Disclosing Party on an \"as is\" basis. Neither Party makes any representation or gives any warranty, express or implied, as to the accuracy, completeness, adequacy or fitness for a particular purpose of any Confidential Information disclosed under this Agreement.\n7.4 Neither the Disclosing Party nor any of its Representatives shall have any liability to the Receiving Party or to any other person resulting from the use of, or reliance upon, the Confidential Information by the Receiving Party, save that nothing in this Agreement shall exclude or limit either Party's liability for fraud or fraudulent misrepresentation.\n7.5 Nothing in this Agreement shall oblige either Party to disclose any particular information, to enter into any further agreement or transaction with the other Party, or to proceed with the Purpose or any commercial relationship.\n8. Publicity\n8.1 Neither Party shall make, or permit any person to make, any public announcement, press release or other public disclosure concerning the existence or subject matter of this Agreement, the Purpose, or the fact that discussions are taking place between the Parties without the prior written consent of the other Party, except as required by law or any governmental or regulatory authority in accordance with Clause 5.\n9. Data Protection\n9.1 The Parties do not anticipate that the disclosure of Confidential Information for the Purpose will involve the sharing or processing of any personal data (as defined in the Data Protection Legislation), other than routine business contact details of the Parties' respective personnel involved in managing the discussions.\n9.2 If either Party identifies that it is necessary to disclose any other personal data to the other Party in connection with the Purpose, that Party shall not disclose such personal data unless and until the Parties have agreed and entered into a separate written data processing agreement or data sharing agreement that complies with the requirements of the Data Protection Legislation.\n10. Term and Survival\n10.1 This Agreement shall come into force on the date set out at the head of this Agreement and shall continue in full force and effect for a period of two (2) years, unless terminated earlier by either Party giving not less than thirty (30) days' prior written notice to the other Party.\n10.2 Expiry or termination of this Agreement shall not affect any accrued rights, remedies, obligations or liabilities of the Parties existing at the date of expiry or termination.\n10.3 The obligations of confidentiality and non-use contained in this Agreement shall survive the expiry or termination of this Agreement for a period of three (3) years from the effective date of expiry or termination, save that in respect of any Confidential Information that constitutes a Trade Secret, such obligations shall continue in full force and effect for so long as that information remains a Trade Secret under applicable law. [[COMMENT: Our standard corporate policy is to cap post-termination confidentiality survival at 2 years across the board. Can we reduce the 3-year period to 2 years and remove the open-ended Trade Secret survival tail?]]\n11. Remedies\n11.1 Each Party acknowledges and agrees that damages alone may not be an adequate remedy for any breach or threatened breach of the terms of this Agreement by the Receiving Party. Accordingly, a Party shall be entitled to seek the remedies of injunction, specific performance and other equitable relief for any threatened or actual breach of this Agreement by the other Party, without proof of special damage.\n11.2 The rights and remedies provided under this Agreement are cumulative and do not exclude any rights or remedies provided by law.\n12. General\n12.1 Neither Party may assign, novate, transfer, mortgage, charge, subcontract, declare a trust over or deal in any other manner with any or all of its rights or obligations under this Agreement without the prior written consent of the other Party.\n12.2 Any notice given to a Party under or in connection with this Agreement shall be in writing and shall be delivered by hand or by pre-paid first-class post or other next working day delivery service at its registered office (as set out at the start of this Agreement) or sent by email to the primary contact email address notified by that Party for the Purpose. A notice shall be deemed to have been received: if delivered by hand, on signature of a delivery receipt; if sent by post, at 9.00 am on the second Business Day after posting; and if sent by email, at the time of transmission (or, if this time falls outside normal business hours in the place of receipt, when normal business hours resume on the next Business Day), provided no automated notification of non-delivery is received. This Clause 12.2 does not apply to the service of any proceedings or other documents in any legal action.\n12.3 No variation of this Agreement shall be effective unless it is in writing and signed by the Parties (or their authorised representatives).\n12.4 A waiver of any right or remedy under this Agreement or by law is only effective if given in writing and shall not be deemed a waiver of any subsequent right or remedy. A failure or delay by a Party to exercise any right or remedy provided under this Agreement or by law shall not constitute a waiver of that or any other right or remedy.\n12.5 If any provision or part-provision of this Agreement is or becomes invalid, illegal or unenforceable, it shall be deemed modified to the minimum extent necessary to make it valid, legal and enforceable. If such modification is not possible, the relevant provision or part-provision shall be deemed deleted. Any modification to or deletion of a provision or part-provision under this Clause 12.5 shall not affect the validity and enforceability of the rest of this Agreement.\n12.6 Nothing in this Agreement is intended to, or shall be deemed to, establish any partnership or joint venture between the Parties, constitute either Party the agent of the other Party, or authorise either Party to make or enter into any commitments for or on behalf of the other Party.\n12.7 A person who is not a party to this Agreement shall not have any rights under the Contracts (Rights of Third Parties) Act 1999 to enforce any term of this Agreement.\n12.8 This Agreement constitutes the entire agreement between the Parties and supersedes and extinguishes all previous agreements, promises, assurances, warranties, representations and understandings between them, whether written or oral, relating to its subject matter.\n12.9 This Agreement may be executed in any number of counterparts, each of which when executed shall constitute a duplicate original, but all the counterparts shall together constitute the one agreement. Execution by a Party by means of an electronic signature platform shall be as valid and effectual as if executed by handwritten signature.\n12.10 This Agreement and any dispute or claim (including non-contractual disputes or claims) arising out of or in connection with it or its subject matter or formation shall be governed by and construed in accordance with the substantive law of [[DEL: England and Wales]] [[INS: Sweden]].\n12.11 Each Party irrevocably agrees that the [[DEL: courts of England and Wales]] [[INS: District Court of Stockholm (Stockholms tingsrätt)]] shall have exclusive jurisdiction to settle any dispute or claim (including non-contractual disputes or claims) arising out of or in connection with this Agreement or its subject matter or formation.\nThis Agreement has been entered into on the date stated at the beginning of it.\nSigned for and on behalf of HALYARD SOFTWARE LTD\nSignature: ______________________________\nName: ______________________________\nTitle: ______________________________\nDate: ______________________________\nSigned for and on behalf of [[DEL: [COUNTERPARTY NAME]]] [[INS: SKANDIA LOGISTIK AB]]\nSignature: ______________________________\nName: ______________________________\nTitle: ______________________________\nDate: ______________________________\n", "C11": "MUTUAL NON-DISCLOSURE AGREEMENT\n\nThis Mutual Non-Disclosure Agreement (this \"Agreement\") is entered into as of October 14, 2026 (the \"Effective Date\"), by and between:\n\n(1) CloudVantage Technologies, Inc., a Delaware corporation, having its principal place of business at 450 Mission Street, Suite 1400, San Francisco, CA 94105, United States (\"CloudVantage\"); and\n\n(2) Halyard Software Ltd, a company incorporated and registered in England and Wales with company number 09876543, having its registered office at 12 Mill Lane, Manchester M1 2AB, United Kingdom (\"Company\").\n\nCloudVantage and Company may each be referred to herein individually as a \"Party\" and collectively as the \"Parties.\"\n\nRECITALS\n\nWHEREAS, the Parties wish to explore and evaluate a potential business opportunity, partnership, or commercial relationship of mutual interest (the \"Purpose\"); and\n\nWHEREAS, in connection with the Purpose, each Party may disclose or make available to the other Party certain confidential and proprietary technical, financial, and business information, and the Parties desire to establish the terms and conditions governing the use and protection of such information.\n\nNOW, THEREFORE, in consideration of the mutual covenants and promises contained herein, and for other good and valuable consideration, the receipt and sufficiency of which are hereby acknowledged, the Parties agree as follows:\n\n1. Definitions\n1.1 For purposes of this Agreement, the following capitalized terms shall have the meanings set forth below:\n1.1.1 \"Affiliate\" means, with respect to any entity, any other entity that directly or indirectly controls, is controlled by, or is under common control with such entity, where \"control\" means the ownership of more than fifty percent (50%) of the voting securities or other ownership interests of such entity, or the power to direct or cause the direction of the management and policies of such entity.\n1.1.2 \"Confidential Information\" means any and all non-public, proprietary, or confidential information disclosed by or on behalf of a Party or its Affiliates (the \"Disclosing Party\") to the other Party or its Affiliates (the \"Receiving Party\"), whether orally, visually, electronically, in writing, or in any other tangible or intangible form, that is designated as \"Confidential,\" \"Proprietary,\" or with a similar legend at the time of disclosure, or that reasonably should be understood to be confidential given the nature of the information and the circumstances surrounding its disclosure. Without limiting the generality of the foregoing, Confidential Information includes software, source code, object code, APIs, system architectures, algorithms, product roadmaps, technical specifications, customer lists, pricing models, financial data, business plans, marketing strategies, and any notes, analyses, compilations, studies, or other documents prepared by the Receiving Party or its Representatives to the extent they contain or reflect such information.\n1.1.3 \"Representatives\" means, as to any Party, its and its Affiliates' respective directors, officers, employees, financial advisors, legal counsel, accountants, and insurers.\n2. Obligations of Confidentiality and Non-Use\n2.1 Duty of Care. The Receiving Party shall hold and maintain all Confidential Information of the Disclosing Party in strict confidence and shall exercise at least the same degree of care to safeguard and prevent the unauthorized use, dissemination, or disclosure of such Confidential Information as it exercises to protect its own confidential information of a similar nature, which in no event shall be less than a reasonable standard of care.\n2.2 Permitted Use. The Receiving Party shall use the Disclosing Party's Confidential Information solely as necessary to evaluate, pursue, or fulfill the Purpose and for no other purpose whatsoever.\n2.3 Permitted Disclosures. The Receiving Party shall not disclose or make available any Confidential Information of the Disclosing Party to any third party, except that the Receiving Party may disclose such Confidential Information to those of its Representatives who have a bona fide need to know such information for the Purpose, provided that:\n2.3.1 prior to any such disclosure, the Receiving Party informs each such Representative of the confidential nature of the information;\n2.3.2 each such Representative is bound by written confidentiality obligations or professional duties of confidentiality no less protective of the Confidential Information than the terms set forth in this Agreement; and\n2.3.3 the Receiving Party shall be wholly responsible and liable to the Disclosing Party for any act or omission of any of its Representatives that would constitute a breach of this Agreement if committed by the Receiving Party directly.\n2.4 Technical Restrictions. The Receiving Party shall not reverse engineer, decompile, disassemble, translate, or otherwise attempt to derive the source code, underlying ideas, algorithms, structure, or organization of any software, prototypes, or other technology provided by the Disclosing Party as part of the Confidential Information.\n2.5 Notice of Unauthorized Use. The Receiving Party shall promptly notify the Disclosing Party in writing upon discovering any actual or suspected unauthorized use, loss, or disclosure of the Disclosing Party's Confidential Information and shall cooperate reasonably with the Disclosing Party to regain possession of such information and mitigate any potential harm.\n3. Exclusions from Confidential Information\n3.1 General Exclusions. The obligations of confidentiality and non-use set forth in Section 2 shall not apply to any portion of the Confidential Information that the Receiving Party can prove by competent, contemporaneous written evidence:\n3.1.1 was publicly known and generally available in the public domain prior to the time of disclosure by the Disclosing Party, or subsequently becomes publicly known and generally available in the public domain through no wrongful act, fault, or breach of this Agreement by the Receiving Party or its Representatives;\n3.1.2 was already in the lawful possession of the Receiving Party without any obligation of confidentiality prior to its disclosure by or on behalf of the Disclosing Party;\n3.1.3 is lawfully obtained by the Receiving Party from a third party who had the right to make such disclosure without any restriction on confidentiality or breach of any duty owed to the Disclosing Party; or\n3.1.4 was independently developed by personnel of the Receiving Party without any access to, reference to, or reliance upon the Disclosing Party's Confidential Information.\n4. Compelled Disclosure\n4.1 Legal Process. If the Receiving Party or any of its Representatives is required by applicable law, regulation, subpoena, court order, or the rules of any recognized stock exchange or governmental authority to disclose any Confidential Information of the Disclosing Party, the Receiving Party may make such disclosure to the minimum extent legally required, provided that the Receiving Party shall, to the extent legally permissible:\n4.1.1 provide the Disclosing Party with prompt prior written notice of such requirement so that the Disclosing Party may seek a protective order or other appropriate remedy; and\n4.1.2 reasonably cooperate with the Disclosing Party, at the Disclosing Party's sole expense, in any lawful effort by the Disclosing Party to contest, limit, or obtain confidential treatment for such required disclosure.\n5. Return or Destruction of Materials\n5.1 Procedure upon Request. Upon the termination or expiration of this Agreement, or at any time upon the Disclosing Party's written request, the Receiving Party shall within ten (10) business days either promptly return to the Disclosing Party all tangible materials embodying the Disclosing Party's Confidential Information or permanently destroy and erase all such materials (including all copies, extracts, and summaries thereof) in its possession or under its control, and upon request shall provide written certification of such destruction signed by an authorized representative.\n5.2 Archival and Compliance Copies. Notwithstanding Section 5.1, the Receiving Party and its Representatives shall not be obligated to erase Confidential Information that is contained in an archived computer system backup made in accordance with standard, automated disaster recovery or security procedures, or that must be retained by the Receiving Party or its Representatives to comply with applicable law, regulation, or bona fide internal audit and compliance policies, provided that any such retained Confidential Information shall remain subject to the confidentiality and non-use obligations of this Agreement for so long as it is retained.\n6. Proprietary Rights and Disclaimers\n6.1 Ownership. All Confidential Information disclosed hereunder (including all intellectual property rights therein) shall remain the sole and exclusive property of the Disclosing Party or its licensors. Nothing in this Agreement shall be construed as granting any patent, copyright, trademark, trade secret, or other intellectual property right or license, by implication, estoppel, or otherwise, except for the limited right to review and use the Confidential Information solely for the Purpose.\n6.2 No Warranty. ALL CONFIDENTIAL INFORMATION IS PROVIDED \"AS IS\" WITHOUT ANY WARRANTY OF ANY KIND. NEITHER PARTY MAKES ANY REPRESENTATIONS OR WARRANTIES, EXPRESS, IMPLIED, OR STATUTORY, REGARDING THE ACCURACY, COMPLETENESS, RELIABILITY, MERCHANTABILITY, OR FITNESS FOR A PARTICULAR PURPOSE OF ANY CONFIDENTIAL INFORMATION, OR THAT SUCH INFORMATION DOES NOT INFRINGE THIRD-PARTY RIGHTS.\n6.3 No Obligation to Proceed. Nothing in this Agreement shall obligate either Party to disclose any specific Confidential Information, to enter into any definitive agreement or transaction with the other Party, or to refrain from engaging in similar discussions with third parties, provided that the Party complies with its obligations under this Agreement.\n7. Term and Survival\n7.1 Agreement Term. This Agreement shall commence on the Effective Date and shall remain in full force and effect for a period of two (2) years thereafter, unless terminated earlier by either Party upon thirty (30) days' prior written notice to the other Party.\n7.2 Survival of Obligations. Notwithstanding the expiration or earlier termination of this Agreement, the Receiving Party's obligations of confidentiality and non-use with respect to Confidential Information disclosed prior to such expiration or termination shall survive for a fixed period of thirty-six (36) months following the effective date of such expiration or termination; provided, however, that with respect to any item of Confidential Information that rises to the level of a trade secret under applicable law, the restrictions on disclosure and use set forth herein shall not expire at the end of such thirty-six (36) month period but shall instead continue in perpetuity for so long as such information retains its legal status as a protected trade secret.\n8. Equitable Relief\n8.1 Injunctive Relief. Each Party acknowledges and agrees that any breach or threatened breach of this Agreement may cause immediate and irreparable harm to the Disclosing Party for which monetary damages alone would be an inadequate remedy. Accordingly, in the event of any such breach or threatened breach, the Disclosing Party shall be entitled to seek injunctive relief, specific performance, and other equitable remedies from any court of competent jurisdiction, in addition to all other remedies available at law or in equity, without the necessity of proving actual damages or posting any bond or other security.\n9. General Provisions\n9.1 Publicity. Neither Party shall issue any press release or make any public announcement regarding the existence of this Agreement or the discussions between the Parties concerning the Purpose without the prior written consent of the other Party.\n9.2 Assignment. Neither Party may assign or transfer this Agreement, or any of its rights or obligations hereunder, without the prior written consent of the other Party, and any attempted assignment in violation of the foregoing shall be null and void.\n9.3 Notices. All notices permitted or required under this Agreement shall be in writing and shall be delivered in person, sent by recognized overnight courier, or transmitted via email to the address of the relevant Party set forth at the beginning of this Agreement (or such other address as a Party may designate by written notice), and shall be deemed given upon receipt when delivered personally or by courier, or upon confirmation of transmission if sent by email during normal business hours at the place of receipt.\n9.4 Governing Law and Jurisdiction. This Agreement, and any dispute or claim (including non-contractual disputes or claims) arising out of or in connection with it or its subject matter or formation, shall be governed by and construed in accordance with the laws of England and Wales, without regard to its conflict of laws principles. Each Party irrevocably agrees that the courts of England and Wales shall have exclusive jurisdiction to settle any dispute or claim (including non-contractual disputes or claims) arising out of or in connection with this Agreement or its subject matter or formation.\n9.5 Severability and Waiver. If any provision of this Agreement is held by a court of competent jurisdiction to be invalid, illegal, or unenforceable, the remaining provisions shall remain in full force and effect, and the invalid provision shall be modified to the minimum extent necessary to make it valid and enforceable. No waiver of any breach or default hereunder shall be effective unless in writing and signed by the waiving Party, nor shall any failure or delay in exercising any right operate as a waiver thereof.\n9.6 Third Party Rights. A person who is not a Party to this Agreement shall have no rights under the Contracts (Rights of Third Parties) Act 1999 to enforce any term of this Agreement.\n9.7 Entire Agreement and Counterparts. This Agreement constitutes the entire agreement between the Parties concerning the subject matter hereof and supersedes all prior or contemporaneous oral or written understandings relating thereto. This Agreement may be executed in two or more counterparts, including via electronic signature or portable document format (PDF), each of which shall be deemed an original and all of which together shall constitute one and the same instrument.\nIN WITNESS WHEREOF, the Parties have caused this Mutual Non-Disclosure Agreement to be executed by their duly authorized representatives as of the Effective Date.\n\nCLOUDVANTAGE TECHNOLOGIES, INC.\nBy: ______________________________\nName: ____________________________\nTitle: _____________________________\nDate: _____________________________\n\nHALYARD SOFTWARE LTD\nBy: ______________________________\nName: ____________________________\nTitle: _____________________________\nDate: _____________________________\n", "C12": "MUTUAL NON-DISCLOSURE AGREEMENT\n\nTHIS MUTUAL NON-DISCLOSURE AGREEMENT (hereinafter referred to as the \"Agreement\") is entered into and made effective as of the date of the last signature affixed hereto (hereinafter referred to as the \"Effective Date\"), by and between:\n\n(1) HALYARD SOFTWARE LTD, a private limited company incorporated and registered under the laws of England and Wales with company number 09876543, having its registered office situated at 12 Mill Lane, Manchester M1 2AB, United Kingdom (hereinafter referred to as \"Halyard\"); and\n\n(2) BEIERSDORF TECHNOLOGIES GMBH, a company incorporated and registered under the laws of the Federal Republic of Germany, having its registered office situated at Industriestrasse 42, 60314 Frankfurt am Main, Germany (hereinafter referred to as the \"Counterparty\"),\n\nHalyard and the Counterparty each being referred to individually as a \"Party\" and collectively as the \"Parties\".\n\nWHEREAS:\n(A) The Parties intend to enter into discussions, negotiations and evaluations regarding a potential commercial transaction, technological collaboration and software integration partnership between them (hereinafter referred to as the \"Purpose\").\n(B) In furtherance of the Purpose, each Party may disclose to the other Party certain proprietary, confidential and commercially sensitive information pertaining to its business, technical infrastructure, software applications, intellectual property, financial standing and operational methodologies.\n(C) The Parties desire to establish a formal framework regulating the handling, protection, restricted use and subsequent disposition of such confidential disclosures, ensuring that the proprietary interests of both Disclosing Parties are fully safeguarded under the terms and conditions set forth herein.\n\nNOW, THEREFORE, in consideration of the mutual covenants, promises, representations and warranties contained herein, and for other good and valuable consideration, the receipt and sufficiency of which are hereby mutually acknowledged, the Parties hereby covenant and agree as follows:\n\nDefinitions and Rules of Interpretation\n1.1 In this Agreement, except where the context otherwise explicitly requires, the following capitalised terms shall have the respective meanings ascribed to them below:\n1.1.1 \"Affiliate\" means, in relation to either Party, any legal entity, corporation, partnership or other enterprise that, directly or indirectly through one or more intermediaries, controls, is controlled by, or is under common control with that Party, where \"control\" means the direct or indirect ownership of more than fifty percent (50%) of the voting stock, equity interest or management control of such entity, but only for so long as such control shall continue to exist.\n1.1.2 \"Agreement\" means this Mutual Non-Disclosure Agreement, including all recitals, schedules, annexures and amendments hereto as agreed in writing by the Parties from time to time.\n1.1.3 \"Business Day\" means any day other than a Saturday, Sunday or public holiday recognised by the banking sector in London, England, or Frankfurt am Main, Germany.\n1.1.4 \"Confidential Information\" means all information of whatever nature, form or media, whether oral, written, graphic, electronic, machine-readable or tangible, disclosed by or on behalf of one Party (the \"Disclosing Party\") to the other Party (the \"Receiving Party\") or to its Representatives, whether disclosed before, on or after the Effective Date, in connection with the Purpose. Confidential Information shall include, without limitation:\n(a) all technical data, software code, source code, object code, algorithms, architecture, technical specifications, blue prints, drawings, designs, data models, database structures, documentation, product roadmaps, release schedules, vulnerability assessments, security protocols and testing methodologies;\n(b) all business plans, strategic initiatives, operational frameworks, market analyses, customer lists, prospect databases, pricing models, cost structures, financial statements, budgets, forecasts, contractual arrangements and commercial negotiations;\n(c) all trade secrets, know-how, inventions, patent applications, copyright works, proprietary processes, methodologies and unpatented discoveries; and\n(d) any notes, analyses, compilations, studies, summaries or other material prepared by or for the Receiving Party or its Representatives that contain, reflect, summarize or are derived from, in whole or in part, any of the information specified in paragraphs (a) through (c) above.\n1.1.5 \"Data Protection Legislation\" means all applicable data protection and privacy legislation in force from time to time in the United Kingdom or the European Union, including the UK GDPR, the Data Protection Act 2018, the General Data Protection Regulation (EU) 2016/679 (EU GDPR) and the Privacy and Electronic Communications Regulations 2003, as amended, updated or replaced from time to time.\n1.1.6 \"Disclosing Party\" means the Party, or any Affiliate or Representative thereof, that discloses or makes available Confidential Information to the Receiving Party pursuant to this Agreement.\n1.1.7 \"Effective Date\" has the meaning ascribed to such term in the preamble of this Agreement.\n1.1.8 \"Purpose\" has the meaning ascribed to such term in Recital (A) of this Agreement.\n1.1.9 \"Receiving Party\" means the Party, or any Affiliate or Representative thereof, that receives or obtains Confidential Information from the Disclosing Party pursuant to this Agreement.\n1.1.10 \"Representatives\" means, in relation to a Party, the directors, officers, employees, legal advisers, financial auditors, technical consultants, accountants and professional agents of that Party or of any Affiliate of that Party.\n1.1.11 \"Trade Secret\" means any Confidential Information that constitutes a trade secret within the meaning of Article 2(1) of the Directive (EU) 2016/943 or Section 2 of the UK Trade Secrets (Enforcement, etc.) Regulations 2018.\n1.2 In this Agreement, unless the context otherwise dictates:\n1.2.1 references to clauses, sub-clauses and recitals are references to clauses, sub-clauses and recitals of this Agreement;\n1.2.2 headings are inserted for convenience of reference only and shall not affect the interpretation or construction of this Agreement;\n1.2.3 words importing the singular shall include the plural and vice versa, and words importing any gender shall include all genders;\n1.2.4 a reference to any legislative provision, statute, statutory instrument or subordinate legislation shall be construed as a reference to such provision as amended, consolidated, re-enacted or replaced from time to time;\n1.2.5 the words \"include\", \"including\", \"in particular\", \"such as\" or any similar expression shall be construed as illustrative and shall not limit the generality of the preceding words; and\n1.2.6 references to writing or written include communications transmitted by email or secure electronic messaging platforms.\n\nObligations of Confidentiality and Non-Use\n2.1 In consideration of the mutual disclosure of Confidential Information by the Parties pursuant to this Agreement, each Party, acting as the Receiving Party, hereby covenants, undertakes and agrees with the other Party, acting as the Disclosing Party, that it shall:\n2.1.1 maintain all Confidential Information received from the Disclosing Party in strict confidence, exercising the same degree of security precautions, administrative safeguards and professional diligence that the Receiving Party employs to protect its own highly confidential proprietary information of a similar character, but in no event shall the Receiving Party exercise less than a reasonable standard of care;\n2.1.2 use the Confidential Information exclusively for the furtherance of the Purpose and for no other purpose whatsoever, and shall not, directly or indirectly, use, exploit, commercialise or benefit from the Disclosing Party's Confidential Information for its own commercial gain or for the benefit of any third party;\n2.1.3 restrict dissemination of the Disclosing Party's Confidential Information internally, ensuring that no Confidential Information is disclosed to any person other than those Representatives and Affiliates who have a demonstrable, strict operational need to know such information for the sole purpose of evaluating or advancing the Purpose;\n2.1.4 ensure that all Representatives and Affiliates who receive access to the Disclosing Party's Confidential Information are fully informed of the confidential and proprietary nature thereof, and are bound by written confidentiality obligations or professional duties of secrecy that are no less restrictive than the terms and conditions contained herein; and\n2.1.5 remain fully and unconditionally liable to the Disclosing Party for any breach of the terms of this Agreement caused by any act, omission, default or negligence of any of its Representatives, agents or Affiliates as if such act or omission were the act or omission of the Receiving Party itself.\n2.2 The Receiving Party shall not, and shall ensure that its Representatives and Affiliates do not, reverse engineer, decompile, disassemble, decrypt or otherwise attempt to derive the source code, underlying algorithms, architecture, structure or internal logic of any software, firmware, hardware, prototypes, samples or tangible items embodying Confidential Information provided by the Disclosing Party, save to the extent that such restriction is expressly prohibited by mandatory applicable law which cannot be contracted out of by the Parties.\n2.3 The Receiving Party shall immediately notify the Disclosing Party in writing upon becoming aware of any actual, suspected or threatened unauthorised access, acquisition, use, copying, disclosure or misappropriation of any Confidential Information belonging to the Disclosing Party, and shall provide all reasonable cooperation, assistance and information requested by the Disclosing Party to investigate, mitigate and remedy such breach.\n\nStandard Exclusions from Confidentiality\n3.1 The obligations of confidentiality, non-use and restriction set forth in Clause 2 shall not apply, or shall cease to apply, to any specific item of Confidential Information which the Receiving Party can conclusively demonstrate by contemporaneous written records, documentary evidence or other competent proof:\n3.1.1 was already generally known, publicly available or in the public domain at the time of its disclosure by the Disclosing Party, or subsequently entered the public domain through no breach of this Agreement or any other legal duty of confidentiality by the Receiving Party, its Representatives or its Affiliates;\n3.1.2 was already lawfully in the possession, custody or control of the Receiving Party free from any obligation of confidentiality prior to receipt from the Disclosing Party;\n3.1.3 is lawfully received by the Receiving Party on a non-confidential basis from an independent third party who is not, to the knowledge of the Receiving Party, bound by any obligation of confidentiality or fiduciary duty owed to the Disclosing Party or any third party in respect of such information; or\n3.1.4 was independently developed by employees, agents or contractors of the Receiving Party who had no access to, and did not make any use of or reference to, any Confidential Information disclosed by the Disclosing Party under this Agreement.\n3.2 A specific item of Confidential Information shall not be deemed to fall within any of the exceptions enumerated in Clause 3.1 merely because it is embraced by more general information that falls within the public domain or is in the prior possession of the Receiving Party. Furthermore, any combination of individual pieces of Confidential Information shall not be deemed to be within the public domain or in the prior possession of the Receiving Party merely because individual constituent features thereof are in the public domain or in such prior possession, unless the combination as a whole and its economic value are in the public domain or in such prior possession.\n\nCompelled Disclosures and Legal Process\n4.1 In the event that the Receiving Party, or any of its Representatives or Affiliates, receives a formal request, subpoena, civil investigative demand, court order, regulatory mandate or statutory requirement to disclose any of the Disclosing Party's Confidential Information pursuant to any applicable law, regulation, governmental inquiry, administrative proceeding or stock exchange rule, the Receiving Party shall, subject to applicable legal restrictions:\n4.1.1 provide the Disclosing Party with prompt, written notice of such request or requirement prior to making any disclosure, enabling the Disclosing Party to seek a protective order, injunction or other appropriate legal remedy to prevent or narrow the scope of such disclosure;\n4.1.2 fully cooperate and consult with the Disclosing Party regarding the proposed timing, form, nature and extent of the mandatory disclosure; and\n4.1.3 if disclosure cannot be successfully avoided or restrained, disclose only that precise portion of the Confidential Information that is legally mandated to be disclosed, and exercise all reasonable commercial efforts to obtain a binding written assurance from the presiding court, tribunal or regulatory agency that confidential treatment will be accorded to the disclosed Confidential Information.\n4.2 If the Receiving Party is legally prohibited from providing prior written notice to the Disclosing Party pursuant to Clause 4.1 prior to disclosing Confidential Information, the Receiving Party shall notify the Disclosing Party in writing as soon as legally permissible thereafter, providing full particulars of the legal compulsion, the recipient authority and the specific information disclosed.\n\nReturn and Destruction of Materials\n5.1 Upon the written request of the Disclosing Party at any time, or automatically upon the termination or expiration of this Agreement, the Receiving Party shall, within ten (10) Business Days following receipt of such request or upon such termination or expiration, elect to either:\n5.1.1 promptly return to the Disclosing Party all tangible documents, physical media, prototypes, samples, notes, memoranda and other materials containing, embodying or reflecting any of the Disclosing Party's Confidential Information, including all copies, extracts and summaries thereof, then in the possession, custody or control of the Receiving Party, its Representatives or its Affiliates; or\n5.1.2 completely destroy, permanently shred or securely erase all such tangible and electronic materials, copies, extracts and summaries, ensuring that all digital files containing Confidential Information are permanently deleted from all active storage media, hard drives and enterprise servers.\n5.2 Promptly following the completion of the return or destruction process mandated by Clause 5.1, a duly authorised officer of the Receiving Party shall provide the Disclosing Party with a written certification confirming that the Receiving Party has fully complied with all obligations set forth in Clause 5.1.\n5.3 Notwithstanding the provisions of Clause 5.1 and Clause 5.2, the Receiving Party and its professional advisers may retain:\n5.3.1 one (1) archival copy of the Disclosing Party's Confidential Information solely for the purpose of evidencing compliance with the terms of this Agreement, satisfying professional auditing standards or resolving any legal disputes arising hereout; and\n5.3.2 electronic backup copies of Confidential Information generated automatically through routine data archiving, disaster recovery and electronic backup systems, provided that such backup copies are not actively accessed or used in the ordinary course of business and are overwritten or purged in accordance with the Receiving Party's standard data retention and destruction cycles.\n5.4 Any Confidential Information retained pursuant to Clause 5.3 shall continue to be held subject to the absolute confidentiality and non-use obligations set forth in this Agreement, notwithstanding the expiration or termination of the main provisions hereof.\n\nIntellectual Property Rights and Warranties\n6.1 Nothing in this Agreement shall be construed as granting, conferring, assigning or transferring, whether expressly, by implication, estoppel or otherwise, any right, title, interest, licence or intellectual property right in or to any Confidential Information, patents, patent applications, copyrights, trademarks, trade secrets, design rights or proprietary technologies of the Disclosing Party to the Receiving Party or to any third party.\n6.2 All Confidential Information disclosed pursuant to this Agreement is provided by the Disclosing Party on an \"AS IS\" and \"AS AVAILABLE\" basis, without any representation, warranty or guarantee of any kind, whether express, implied, statutory or otherwise, including any implied warranties of merchantability, fitness for a particular purpose, title, non-infringement or accuracy.\n6.3 Neither the Disclosing Party nor any of its Representatives or Affiliates makes any representation or warranty regarding the accuracy, completeness, currency, reliability or utility of any Confidential Information disclosed hereunder. The Receiving Party acknowledges and agrees that any reliance upon, utilisation of, or commercial application of any Confidential Information shall be entirely at the Receiving Party's sole risk and discretion.\n6.4 Neither this Agreement, nor the disclosure or receipt of any Confidential Information, shall constitute, create, imply or evidence an obligation by either Party to enter into any further commercial agreement, licence, joint venture, partnership or business transaction, nor shall it restrict either Party from independently developing, acquiring, marketing or licensing products, services or technologies that are competitive with those of the other Party, provided that such independent development does not involve any breach of the confidentiality and non-use obligations contained herein.\n\nData Protection and Personal Data Processing\n7.1 The Parties acknowledge and agree that the disclosure of Confidential Information under this Agreement is not intended to involve the transfer, sharing or processing of any personal data (as defined under applicable Data Protection Legislation), save for the routine exchange of business contact details (such as names, business email addresses, telephone numbers and professional titles) pertaining to the personnel of each Party involved in administering and facilitating the Purpose.\n7.2 Each Party warrants and undertakes that it shall process any business contact details received from the other Party solely for the administrative management of this Agreement and in strict compliance with all applicable Data Protection Legislation.\n7.3 In the event that either Party determines that the disclosure of any personal data beyond basic business contact details is strictly necessary for the furtherance of the Purpose, the Parties shall negotiate in good faith and execute a separate, compliant data processing agreement or data sharing addendum prior to the transfer of any such personal data.\n\nTerm, Duration and Survival of Obligations\n8.1 This Agreement shall commence on the Effective Date and shall continue in full force and effect for a fixed period of three (3) years from the Effective Date, unless terminated earlier by either Party giving not less than thirty (30) days' prior written notice of termination to the other Party.\n8.2 The expiration or termination of this Agreement shall not release either Party from any liability, obligation or breach that accrued prior to such expiration or termination, nor shall it affect any rights or remedies that may have accrued to either Party under this Agreement or by operation of law.\n8.3 The obligations of confidentiality and non-use set forth in Clause 2 shall survive the expiration or termination of this Agreement for a period of five (5) years from the effective date of such expiration or termination, provided, however, that with respect to any Confidential Information that constitutes a Trade Secret under applicable law, the obligations of confidentiality and non-use shall continue in full force and effect without limitation in time for so long as such information retains its legal status as a Trade Secret under applicable law.\n\nRemedies and Injunctive Relief\n9.1 The Receiving Party acknowledges and agrees that any breach, violation or threatened violation of the provisions of Clause 2 or Clause 5 of this Agreement may cause irreparable harm, injury and damage to the Disclosing Party for which monetary damages alone would be an inadequate, insufficient and difficult to calculate remedy.\n9.2 Accordingly, in the event of any actual, threatened or anticipated breach or violation of this Agreement by the Receiving Party, its Representatives or its Affiliates, the Disclosing Party shall be entitled, without the nec
