nWHEREAS, the Parties wish to establish rigorous contractual provisions to ensure the confidentiality and restrict the unauthorized exploitation or dissemination of such disclosed information.\n\nNOW, THEREFORE, in consideration of the mutual covenants, undertakings, and representations contained herein, and for other good and valuable consideration, the receipt and adequacy of which are hereby mutually acknowledged, the Parties agree as follows:\n\nDEFINITIONS AND CONSTRUCTION\n\n1.1 Defined Terms\nIn this Agreement, capitalised terms shall have the meanings assigned to them below:\n\n1.1.1 \"Affiliate\" means, with respect to any specified Person, any other Person that directly or indirectly through one or more intermediaries Controls, is Controlled by, or is under common Control with such specified Person.\n\n1.1.2 \"Agreement\" means this Mutual Non-Disclosure Agreement, including its preamble and any annexes or schedules attached hereto, as may be formally amended from time to time in accordance with Clause 11.4.\n\n1.1.3 \"Applicable Laws\" means all applicable primary and secondary statutes, statutory instruments, enactments, directives, regulations, judgments, decrees, and orders of any court or governmental, administrative, or supervisory authority having competent jurisdiction.\n\n1.1.4 \"Authorized Purpose\" has the meaning ascribed to it in the Preamble.\n\n1.1.5 \"Confidential Information\" means any and all information, data, materials, or know-how of a confidential or proprietary nature, whether tangible or intangible, visual, oral, electronic, machine-readable, or documentary, that relates directly or indirectly to the business, affairs, operations, strategic roadmaps, research, software, algorithms, methodologies, customer accounts, or financial standing of the Disclosing Party or its Affiliates, which is disclosed, made available, or observed prior to, on, or after the Effective Date in connection with the Authorized Purpose.\n\n1.1.6 \"Control\" means the possession, directly or indirectly, of the power to direct or cause the direction of the management and operational policies of a Person, whether through the ownership of voting securities, by contract, or otherwise, and \"Controlled\" and \"Controlling\" shall be construed accordingly.\n\n1.1.7 \"Disclosing Party\" means the Party (or its Affiliate) that discloses or makes available Confidential Information to the Receiving Party under this Agreement.\n\n1.1.8 \"Effective Date\" has the meaning ascribed to it in the opening appearances of this Agreement.\n\n1.1.9 \"Evaluation Material\" means any notes, summaries, memoranda, analyses, models, forecasts, reports, extracts, or other working materials prepared by or on behalf of the Receiving Party or its Representatives to the extent containing, based upon, or reflecting any Confidential Information.\n\n1.1.10 \"Person\" means any natural person, corporation, partnership, limited liability company, cooperative, association, trust, unincorporated organization, or other legal entity.\n\n1.1.11 \"Receiving Party\" means the Party (or its Affiliate) that receives, accesses, or observes Confidential Information disclosed by or on behalf of the Disclosing Party.\n\n1.1.12 \"Representatives\" means the directors, statutory managing directors, supervisory board members, officers, employees, professional legal counsel, independent statutory auditors, and retained management consultants of a Party or of any of its Affiliates.\n\n1.1.13 \"Restricted Period\" means the period commencing on the Effective Date and expiring exactly twenty-four (24) months following the date of termination or expiration of this Agreement.\n\n1.1.14 \"Residuals\" means any ideas, concepts, methodologies, techniques, processes, or general knowledge retained in the unaided memory of personnel or Representatives of the Receiving Party who have had lawful access to the Disclosing Party's Confidential Information under this Agreement.\n\n1.2 Principles of Interpretation\n1.2.1 Headings and clause titles are inserted for convenience of reference only and shall not affect the interpretation or construction of any provision hereof.\n1.2.2 The words \"include\", \"includes\", and \"including\" shall be deemed to be followed by the phrase \"without limitation\".\n1.2.3 Any reference to a statutory provision includes a reference to that provision as amended, consolidated, extended, or re-enacted from time to time.\n\nCONFIDENTIALITY AND NON-USE UNDERTAKINGS\n\n2.1 Standard of Care\nThe Receiving Party shall exercise in relation to the Disclosing Party's Confidential Information the same standard of care and technical and organizational security measures that it applies to protect its own confidential information of like character, but in no event less than a high and commercially reasonable standard of care.\n\n2.2 Restrictions on Disclosure and Exploitation\nThe Receiving Party covenants and agrees that it shall:\n2.2.1 use and reproduce the Confidential Information solely to the extent strictly necessary to evaluate, negotiate, and advance the Authorized Purpose;\n2.2.2 not exploit, commercialize, or use the Confidential Information, directly or indirectly, for its own commercial gain, for the benefit of any third party, or in any manner competitive with or adverse to the business interests of the Disclosing Party;\n2.2.3 not disclose, disseminate, publish, or otherwise communicate the Confidential Information or any portion thereof to any Person, except to such of its Representatives who have a verifiable need to know such information for the Authorized Purpose; and\n2.2.4 strictly prohibit any copying, reverse compilation, decompilation, reverse engineering, or systematic extraction of structural or architectural principles from any sample code, application interfaces, technical documentation, or systems provided by the Disclosing Party.\n\n2.3 Responsibility for Representatives\nPrior to granting access to any Confidential Information to any Representative, the Receiving Party shall ensure that such Representative is bound by non-disclosure and non-use commitments substantially similar to those contained herein. The Receiving Party shall remain unconditionally liable for any breach of this Agreement caused by the acts or omissions of its Representatives.\n\n2.4 Residual Knowledge\nNotwithstanding anything to the contrary contained in this Agreement, the Receiving Party and its Representatives shall be free to use for any purpose the Residuals resulting from access to or work with the Disclosing Party's Confidential Information, provided that such personnel do not intentionally memorize such information for the purpose of circumventing this Agreement, and nothing herein shall restrict the Receiving Party from assigning any of its personnel to any engagement, project, or development effort.\n\nEXCLUSIONS FROM CONFIDENTIAL OBLIGATIONS\n\n3.1 Scope of Exclusions\nThe obligations set forth in Clause 2 shall not apply to any information which the Receiving Party can establish by clear contemporaneous written records:\n3.1.1 was already in the lawful possession of the Receiving Party or its Affiliates prior to disclosure hereunder, without any preexisting duty of confidentiality;\n3.1.2 is at the time of disclosure, or subsequently becomes, generally available to the public other than through an act, fault, or omission of the Receiving Party or its Representatives;\n3.1.3 is rightfully acquired by the Receiving Party on an unrestricted basis from an independent third party who, to the best of the Receiving Party's reasonable knowledge, is entitled to disclose such information without violating any legal obligation toward the Disclosing Party; or\n3.1.4 is independently conceived, developed, or discovered by personnel of the Receiving Party or its Affiliates without any direct or indirect reliance upon, access to, or reference to the Disclosing Party's Confidential Information.\n\nCOMPELLED DISCLOSURES\n\n4.1 Notice and Defense Obligations\nIf the Receiving Party or any of its Representatives becomes legally compelled or mandated by subpoena, court order, civil investigative demand, or statutory requirement of a competent administrative agency to disclose any portion of the Disclosing Party's Confidential Information, the Receiving Party shall:\n4.1.1 provide the Disclosing Party with prompt written notification, where legally permissible, specifying the legal basis and scope of the required disclosure; and\n4.1.2 at its own sole cost and expense, exhaust all available legal and procedural remedies to challenge, narrow, resist, or obtain a protective order against such compelled production before making any disclosure of the Disclosing Party's Confidential Information.\n\n4.2 Permitted Production\nThe Receiving Party shall not disclose any portion of the Disclosing Party's Confidential Information pursuant to any legal, judicial, or regulatory demand unless and until all formal objections, applications for relief, and legal proceedings to resist disclosure have been definitively adjudicated and dismissed by a final, unappealable order of a court of competent jurisdiction.\n\nNON-SOLICITATION OF PERSONNEL\n\n5.1 Restrictive Covenant\nIn order to protect the Parties' proprietary business know-how, professional goodwill, and specialized technical capital disclosed during the course of the Authorized Purpose, each Party agrees that it shall not, during the term of this Agreement and throughout the Restricted Period, directly or indirectly solicit, induce, recruit, engage, or hire any officer, senior consultant, software architect, or key employee of the other Party or its Affiliates who became known to it or with whom it had substantive contact in connection with the discussions regarding the Authorized Purpose.\n\nRETURN OR DESTRUCTION OF EVALUATION MATERIALS\n\n6.1 Demand and Timeline\nUpon written demand from the Disclosing Party at any time, or automatically upon the termination of discussions relating to the Authorized Purpose, the Receiving Party shall, within fourteen (14) calendar days:\n6.1.1 securely deliver to the Disclosing Party or, at the Disclosing Party's election, securely destroy and expunge all originals, copies, transcripts, and physical embodiments of the Confidential Information;\n6.1.2 expunge and permanently delete all Evaluation Material and electronic files containing Confidential Information from its live active storage systems; and\n6.1.3 furnish a formal certificate of compliance signed by an authorized executive officer confirming that the actions specified in Clauses 6.1.1 and 6.1.2 have been fully executed.\n\n6.2 Archival Exceptions\nNotwithstanding Clause 6.1, the Receiving Party may retain one archival copy of Confidential Information solely within its secure legal archives for the purpose of determining its ongoing legal duties, as well as electronic data residing on automated disaster recovery backup media, provided that all such retained information remains subject to the confidentiality covenants of this Agreement.\n\nPROPRIETARY RIGHTS AND NO LICENCE\n\n7.1 Title and Ownership\nAll right, title, and interest in and to the Confidential Information, including all intellectual property rights, patents, patent applications, trademarks, trade secrets, copyrights, and database rights subsisting therein, shall remain the sole and exclusive property of the Disclosing Party or its respective licensors.\n\n7.2 Absence of Grant\nNothing in this Agreement or in the disclosure of Confidential Information shall be construed as conferring or granting, expressly, impliedly, or by estoppel, any licence, right, title, or interest under any patent, trademark, copyright, software design, or trade secret of the Disclosing Party.\n\nDISCLAIMER OF WARRANTIES\n\n8.1 As-Is Disclosure\nAll Confidential Information is provided by the Disclosing Party on an \"as is\" and \"with all faults\" basis. The Disclosing Party makes no express or implied representations or warranties as to the accuracy, completeness, technical operability, or fitness for any particular purpose of any information disclosed hereunder.\n\n8.2 Limitation of Liability\nNeither Party shall incur any liability toward the other Party arising out of or resulting from the other Party's use of or reliance upon any Confidential Information disclosed pursuant to this Agreement, except in instances of deliberate fraud or fraudulent misrepresentation.\n\nTERM AND TERMINATION\n\n9.1 Duration\nThis Agreement shall enter into force on the Effective Date and shall remain in effect for a period of two (2) years, unless terminated earlier by either Party upon providing thirty (30) calendar days' prior written notice to the other Party.\n\n9.2 Survival of Confidentiality\nThe confidentiality and non-use covenants set forth in Clause 2 shall survive the termination or expiration of this Agreement and continue in full force and effect for an additional period of three (3) years from the effective date of termination or expiration.\n\nEQUITABLE RELIEF\n\n10.1 Inadequacy of Damages\nThe Parties recognize and agree that any breach or threatened breach of the obligations established under this Agreement may cause irreparable harm for which monetary damages alone would not provide an adequate remedy.\n\n10.2 Availability of Injunctions\nAccordingly, in the event of an actual or threatened breach of Clause 2, Clause 4, or Clause 5, the Disclosing Party shall be entitled to seek injunctive relief, specific performance, and other equitable remedies before any court of competent jurisdiction, without the necessity of proving actual damages or posting any bond or collateral security.\n\nMISCELLANEOUS PROVISIONS\n\n11.1 Non-Assignment\nNeither Party may assign, transfer, novate, or encumber any of its rights or delegate any of its obligations under this Agreement, in whole or in part, without the prior written consent of the other Party.\n\n11.2 Entire Agreement\nThis Agreement constitutes the entire and integrated agreement between the Parties with respect to the subject matter hereof and supersedes all prior negotiations, draft agreements, letters of intent, understandings, and representations, whether oral or written.\n\n11.3 Severability\nShould any provision of this Agreement be found by any court or tribunal of competent jurisdiction to be invalid, illegal, or unenforceable, such invalidity or unenforceability shall not affect the remaining provisions of this Agreement, which shall remain in full force and effect.\n\n11.4 Amendments\nNo modification, variation, or amendment of this Agreement shall be binding or valid unless executed in writing and duly signed by an authorized statutory representative of each Party.\n\n11.5 Third-Party Rights\nNo Person other than the Parties hereto and their permitted successors and assigns shall have any right to enforce any term of this Agreement under the Contracts (Rights of Third Parties) Act 1999 or otherwise.\n\n11.6 Governing Law and Jurisdiction\n11.6.1 This Agreement, including any contractual or non-contractual obligations arising out of or in connection with it, shall be governed by, and construed in accordance with, the laws of England and Wales.\n11.6.2 The Parties irrevocably agree that the courts of England and Wales shall have exclusive jurisdiction to settle any dispute or claim arising out of or in connection with this Agreement, its subject matter, or its formation.\n\nIN WITNESS WHEREOF, the Parties have caused this Mutual Non-Disclosure Agreement to be executed by their respective authorized signatories as of the Effective Date.\n\nVANDENBERG STRATEGY & TECHNOLOGY ADVISORY B.V.\nBy: ______________________________\nName: Maarten van den Berg\nTitle: Managing Director\nDate: ______________________________\n\nHALYARD SOFTWARE LTD\nBy: ______________________________\nName:\nTitle:\nDate: ______________________________\n", "C26": "MUTUAL NONDISCLOSURE AGREEMENT\n\nThis Mutual Nondisclosure Agreement (this \"Agreement\") is made and entered into as of 14 November 2026 (the \"Effective Date\") by and between:\n\n(1) MERIDIAN BANCORP GLOBAL MARKETS, N.A., a national banking association organised under the laws of the United States of America, acting through its London branch at 25 Bank Street, Canary Wharf, London E14 5JP (\"Meridian\"); and\n\n(2) HALYARD SOFTWARE LTD, a private limited company incorporated under the laws of England and Wales with company number 09876543, whose registered office is at 12 Mill Lane, Manchester M1 2AB (\"Halyard\").\n\nMeridian and Halyard may individually be referred to as a \"Party\" and collectively as the \"Parties\".\n\nRECITALS\n\n(A) Meridian and its Affiliates operate an international financial services and corporate banking enterprise, and continuously review, develop, procure, deploy and enhance information systems, institutional operations and commercial business solutions across global operational environments.\n\n(B) The Parties wish to engage in exploratory discussions and commercial interactions concerning potential software, operational architectures, and strategic vendor or institutional arrangements, and in connection therewith each Party may disclose certain proprietary and confidential information to the other Party.\n\n(C) The Parties desire to define the terms and conditions under which such information shall be disclosed, received, protected and utilised.\n\nNOW, THEREFORE, in consideration of the mutual covenants contained herein and other good and valuable consideration, the receipt and adequacy of which are hereby acknowledged, the Parties agree as follows:\n\nDefinitions\n\n1.1 In this Agreement, unless the context otherwise requires, the following terms have the meanings set forth below:\n\n1.1.1 \"Affiliate\" means, with respect to any entity, any other entity that directly or indirectly controls, is controlled by, or is under common control with such entity, where \"control\" means the possession, direct or indirect, of the power to direct or cause the direction of the management and policies of an entity, whether through the ownership of voting securities, by contract, or otherwise, and including in the case of Meridian any parent bank holding company, operating bank subsidiary, banking branch, or broker-dealer affiliate.\n\n1.1.2 \"Applicable Law\" means all applicable primary and secondary statutes, statutory instruments, directives, regulations, statutory guidance, common law, rules and supervisory codes of any governmental, regulatory, judicial, fiscal or supervisory authority, including without limitation the Financial Conduct Authority, the Prudential Regulation Authority, the Bank of England, the Board of Governors of the Federal Reserve System, and any other relevant bank regulatory body.\n\n1.1.3 \"Confidential Information\" means all information, data, communications, know-how, records and materials of a proprietary, technical, operational, financial, supervisory, commercial, structural or organizational nature, whether disclosed orally, in writing, electronically, visually, or through inspection, demonstration or system access, disclosed by or on behalf of a Disclosing Party to a Receiving Party or its Representatives, including without limitation business plans, strategic models, vendor information, customer lists, pricing frameworks, architectures, functional designs, software source code, object code, algorithms, interface specifications, risk management methodologies, security protocols, API designs, audits and technical assessments, whether or not marked or identified as confidential, together with all analyses, reports, compilations, extracts, transformations, derivatives or summaries prepared by or on behalf of the Receiving Party that contain, reflect or are generated from any of the foregoing.\n\n1.1.4 \"Disclosing Party\" means the Party disclosing Confidential Information directly or indirectly to the Receiving Party or its Representatives.\n\n1.1.5 \"Receiving Party\" means the Party receiving Confidential Information directly or indirectly from the Disclosing Party or its Representatives.\n\n1.1.6 \"Representatives\" means, with respect to a Party, its Affiliates and the respective directors, officers, employees, seconded staff, temporary personnel, professional legal advisers, independent public accountants, financial advisers, compliance auditors, and prospective IT infrastructure contractors of such Party and its Affiliates.\n\n1.1.7 \"Transaction Purpose\" means the evaluation, review, discussion, consideration, planning, testing, deployment, advancement, maintenance, operation or execution of any past, current or future commercial, technical, investment, institutional or transactional relationship, project or collaborative endeavour between the Parties, or any broader internal operational evaluation, development or business activity of either Party or its Affiliates.\n\nScope of Protection and Standard of Care\n\n2.1 The Receiving Party shall hold and maintain all Confidential Information received from the Disclosing Party in strict confidence and shall not disclose, disseminate, publish or distribute any such Confidential Information to any person, enterprise or entity except as expressly authorized under the terms of this Agreement.\n\n2.2 The Receiving Party shall protect the Disclosing Party's Confidential Information with the same standard of technical, physical and operational care that it applies to its own confidential information of like sensitivity and nature, but in any event utilizing no less than a commercially reasonable degree of care, to prevent unauthorized access, dissemination, modification, compromise or disclosure.\n\n2.3 The Receiving Party shall promptly notify the Disclosing Party in writing upon becoming aware of any confirmed or suspected unauthorized use, access, loss, compromise or disclosure of the Disclosing Party's Confidential Information, and shall cooperate reasonably, at the Disclosing Party's direction and expense, in mitigating the effects of any such occurrence.\n\nPermitted Disclosure\n\n3.1 The Receiving Party may disclose the Disclosing Party's Confidential Information to those of its Representatives who have a need to know such information in furtherance of the Transaction Purpose, provided that:\n\n3.1.1 each such Representative is informed of the confidential nature of the Confidential Information prior to receiving access; and\n\n3.1.2 each such Representative is bound by statutory, professional, employment or written contractual obligations of confidentiality no less restrictive than the terms of this Agreement.\n\n3.2 The Receiving Party shall remain responsible for any breach of the terms of this Agreement by any of its Representatives to whom it discloses the Disclosing Party's Confidential Information, to the same extent as if such breach had been committed by the Receiving Party itself.\n\nExclusions from Confidentiality\n\n4.1 The obligations imposed on the Receiving Party under Clause 2 and Clause 5 shall not apply to any portion of the Confidential Information that the Receiving Party can establish by contemporaneous written records:\n\n4.1.1 was already in the lawful possession of the Receiving Party or its Affiliates prior to disclosure hereunder without an obligation of confidentiality;\n\n4.1.2 is or becomes publicly available or generally known to the public other than as a consequence of an act, omission or default of the Receiving Party or any of its Representatives in breach of this Agreement;\n\n4.1.3 is independently developed by personnel or contractors of the Receiving Party or its Affiliates without access to, reference to, or reliance upon any Confidential Information of the Disclosing Party; or\n\n4.1.4 is lawfully acquired or received by the Receiving Party from an independent third party who has the lawful right to make such disclosure without restriction and without breaching any legal, contractual or fiduciary obligation to the Disclosing Party.\n\nPermitted Use and Operations\n\n5.1 The Receiving Party and its Affiliates shall use the Disclosing Party's Confidential Information solely in connection with, and for the furtherance of, the Transaction Purpose, and shall not exploit, commercialize or copy such information for any other purpose without the Disclosing Party's prior written consent.\n\n5.2 Nothing contained in this Agreement shall restrict either Party or its Affiliates from independently acquiring, designing, developing, procuring, evaluating, marketing or licensing products, software, architectures or services that may be competitive with or functionally similar to those offered or developed by the other Party, provided that such activities do not breach the express non-disclosure provisions of this Agreement.\n\n5.3 Notwithstanding any other provision of this Agreement, the Receiving Party and its Affiliates shall be free to use for any purpose the residuals resulting from access to or work with the Disclosing Party's Confidential Information, being any ideas, concepts, know-how, methodologies, processes or techniques that are retained in the unaided memory of the Receiving Party's or its Affiliates' employees, directors, officers or agents who have had legitimate access to such Confidential Information under this Agreement, and nothing herein shall be construed as imposing any obligation on such persons to limit or restrict the assignment of their work duties or to avoid using such retained concepts.\n\nCompelled Disclosures and Regulatory Inquiries\n\n6.1 In the event that the Receiving Party or any of its Affiliates or Representatives is requested or required by court order, subpoena, interrogatory, civil investigative demand, administrative process, or under Applicable Law, to disclose any Confidential Information, the Receiving Party shall, to the extent legally permissible and reasonably practicable, give the Disclosing Party prompt written notice thereof so that the Disclosing Party may seek an appropriate protective order or other remedy.\n\n6.2 If, in the absence of a protective order or waiver, the Receiving Party is advised by legal counsel that it is legally required to disclose such Confidential Information, the Receiving Party may disclose only that portion of the Confidential Information that is strictly required to be disclosed.\n\n6.3 Notwithstanding Clause 6.1 and Clause 6.2, nothing in this Agreement shall prevent, hinder or delay Meridian or any of its banking Affiliates from disclosing any information or documentation, including Confidential Information, to any banking, financial conduct, prudential, securities, fiscal, statutory or regulatory supervisory body or examination team exercising routine oversight or examination jurisdiction over Meridian or its Affiliates, and Meridian shall not be required to provide notice to or seek consent from Halyard in respect of any such regulatory disclosures or examinations.\n\nIntellectual Property Rights and Disclaimers\n\n7.1 All right, title and interest in and to the Confidential Information, including all intellectual property rights therein, shall remain the sole and exclusive property of the Disclosing Party or its respective licensors.\n\n7.2 No license, whether express, implied, by estoppel or otherwise, under any patent, copyright, trade secret, trademark, database right or other intellectual property right, is granted, transferred or implied by this Agreement or by any disclosure of Confidential Information hereunder, except the limited right to inspect and use such Confidential Information strictly in accordance with Clause 5.1.\n\n7.3 All Confidential Information is provided \"as is\" and without any warranty of any kind. Neither Party makes any representation or warranty, express or implied, as to the accuracy, completeness, viability, fitness for a particular purpose or non-infringement of any Confidential Information disclosed hereunder.\n\nReturn and Retention of Information\n\n8.1 Upon the written demand of the Disclosing Party at any time, the Receiving Party shall, within twenty (20) Business Days of receipt of such request, use commercially reasonable efforts to destroy or return all physical records and electronic materials containing or embodying the Disclosing Party's Confidential Information.\n\n8.2 Notwithstanding Clause 8.1, the Receiving Party and its Affiliates may retain:\n\n8.2.1 archival copies of Confidential Information to the extent required to comply with Applicable Law, regulatory recordkeeping rules, institutional prudential guidelines or established professional compliance policies; and\n\n8.2.2 electronic copies of Confidential Information created pursuant to routine, automated computer system backup, disaster recovery, snapshot or archiving procedures, provided that such copies are not readily accessible in the day-to-day conduct of business.\n\n8.3 Any Confidential Information retained pursuant to Clause 8.2 shall continue to be held in accordance with the confidentiality protections of this Agreement.\n\nTerm and Survival\n\n9.1 This Agreement shall commence on the Effective Date and shall continue in full force and effect for a period of two (2) years, unless terminated earlier by either Party upon thirty (30) days' prior written notice to the other Party.\n\n9.2 The confidentiality, non-disclosure and restricted use obligations set forth in this Agreement shall survive the termination or expiration of this Agreement, and the Receiving Party's obligations under Clause 2 and Clause 5 with respect to all Confidential Information disclosed under this Agreement shall continue in full force and effect indefinitely.\n\nRemedies\n\n10.1 Each Party acknowledges and agrees that any breach or threatened breach of this Agreement may cause irreparable harm for which monetary damages alone would be inadequate.\n\n10.2 Accordingly, in the event of any breach or threatened breach of this Agreement, the non-breaching Party shall be entitled to seek injunctive relief, specific performance and other equitable remedies in any court of competent jurisdiction, without prejudice to any other rights or remedies to which it may be entitled at law or in equity, and without the requirement to post any bond or prove actual damages.\n\n10.3 Each Party acknowledges and agrees that in any action, proceeding or litigation arising out of or relating to this Agreement, neither Party shall be entitled to recover, and each Party hereby expressly and irrevocably waives any and all rights to claim or seek reimbursement for, its legal fees, solicitors' fees, disbursements, court fees or any other litigation costs incurred in connection therewith, regardless of whether it is the prevailing Party.\n\nGeneral Provisions\n\n11.1 Neither Party may assign or transfer this Agreement, or any of its rights or obligations hereunder, without the prior written consent of the other Party, except that Meridian may assign or novate this Agreement, in whole or in part, without consent to any Affiliate or to any successor entity in connection with a corporate reorganization, consolidation, merger or sale of substantially all of its business or assets.\n\n11.2 This Agreement constitutes the entire agreement between the Parties with respect to its subject matter and supersedes all prior negotiations, representations, understandings, draft agreements and discussions between the Parties, whether oral or written.\n\n11.3 No supplement, modification or amendment of this Agreement shall be binding unless executed in writing by authorized representatives of both Parties.\n\n11.4 No failure or delay by either Party in exercising any right, power or privilege under this Agreement shall operate as a waiver thereof, nor shall any single or partial exercise thereof preclude any other or further exercise thereof or the exercise of any other right, power or privilege.\n\n11.5 If any provision of this Agreement is held to be invalid, illegal or unenforceable by any court of competent jurisdiction, such provision shall be severed or modified to the minimum extent necessary, and the remaining provisions of this Agreement shall remain in full force and effect.\n\n11.6 Nothing in this Agreement shall be deemed to create a partnership, joint venture, agency, fiduciary or employment relationship between the Parties, nor shall it obligate either Party to enter into any contract, purchase any service, or proceed with any business arrangement.\n\n11.7 A person who is not a party to this Agreement shall have no rights under the Contracts (Rights of Third Parties) Act 1999 to enforce any term of this Agreement, save that Meridian's Affiliates shall be entitled to enforce any rights expressly conferred upon them hereunder.\n\n11.8 This Agreement may be executed in counterparts, each of which shall be deemed an original, and all of which together shall constitute one and the same instrument. Delivery of an executed counterpart by electronic signature or electronic transmission in PDF format shall be effective as delivery of a manually executed counterpart.\n\nGoverning Law and Jurisdiction\n\n12.1 This Agreement and any dispute, controversy, proceedings or claim of whatever nature (including any non-contractual dispute or claim) arising out of or in connection with it or its subject matter or formation shall be governed by and construed in accordance with the laws of England and Wales.\n\n12.2 Each Party irrevocably agrees that the courts of England and Wales shall have exclusive jurisdiction to settle any dispute or claim (including non-contractual disputes or claims) arising out of or in connection with this Agreement or its subject matter or formation.\n\nIN WITNESS WHEREOF, the Parties hereto have caused this Mutual Nondisclosure Agreement to be executed by their duly authorised representatives as of the Effective Date.\n\nMERIDIAN BANCORP GLOBAL MARKETS, N.A. (London Branch)\nBy: ______________________________\nName: Alistair Vance\nTitle: Managing Director, Global Technology Procurement\nDate: 14 November 2026\n\nHALYARD SOFTWARE LTD\nBy: ______________________________\nName: ____________________________\nTitle: _____________________________\nDate: _____________________________\n", "C27": "MUTUAL NON-DISCLOSURE AGREEMENT\n\nTHIS MUTUAL NON-DISCLOSURE AGREEMENT (the \"Agreement\") is made and entered into as of 24 October 2026 (the \"Effective Date\"), by and between:\n\n(1) VEDANTA INFOTECH SOLUTIONS PRIVATE LIMITED, a company incorporated under the laws of India, having its corporate office at Tower B, Tech Park IV, Electronic City Phase II, Hosur Road, Bengaluru 560100, Karnataka, India (\"Vedanta\"); and\n\n(2) HALYARD SOFTWARE LTD, a company incorporated and registered in England and Wales under company registration number 09876543, having its registered office at 12 Mill Lane, Manchester M1 2AB, United Kingdom (\"Halyard\").\n\nVedanta and Halyard are each individually referred to herein as a \"Party\" and collectively as the \"Parties\".\n\nRECITALS\n\nWHEREAS, the Parties are exploring opportunities for technical integration, software engineering collaboration, and related commercial IT services (the \"Purpose\"); and\n\nWHEREAS, in connection with the Purpose, either Party (\"Disclosing Party\") may disclose, directly or indirectly, certain confidential, proprietary, or business-sensitive information to the other Party (\"Receiving Party\"), and the Parties desire to maintain the confidentiality and restrict the dissemination and use of such information in accordance with the terms and conditions set forth herein.\n\nNOW, THEREFORE, in consideration of the mutual promises, covenants, and undertakings contained herein, and other good and valuable consideration, the receipt and sufficiency of which are hereby acknowledged, the Parties agree as follows:\n\nDEFINITIONS AND INTERPRETATION\n\n1.1 In this Agreement, unless the context otherwise requires, the following terms shall have the meanings set forth below:\n\n1.1.1 \"Affiliate\" means, with respect to any entity, any other entity that directly or indirectly Controls, is Controlled by, or is under common Control with such entity.\n\n1.1.2 \"Control\" means the ownership, directly or indirectly, of more than fifty percent (50%) of the voting equity or interest, or the contractual power to direct or cause the direction of the management and policies of an entity.\n\n1.1.3 \"Confidential Information\" means any and all proprietary, technical, operational, commercial, or financial information disclosed by or on behalf of Disclosing Party to Receiving Party, whether orally, visually, electronically, in writing, or in tangible form, including but not limited to source code, algorithms, architecture diagrams, product roadmaps, designs, data schemas, business plans, customer lists, pricing structures, benchmarks, and trade secrets, which is designated as confidential or proprietary at the time of disclosure or which, by its nature or the circumstances surrounding its disclosure, should reasonably be understood by a prudent commercial person to be confidential.\n\n1.1.4 \"Representatives\" means the directors, officers, employees, legal advisors, accountants, financial consultants, and contracted technical personnel of a Party or its Affiliates who need access to the Confidential Information for the Purpose.\n\n1.2 In this Agreement:\n\n1.2.1 headings are inserted for convenience of reference only and shall not affect the interpretation or construction of this Agreement;\n\n1.2.2 words importing the singular include the plural and vice versa, and words importing any gender include all genders; and\n\n1.2.3 references to Clauses are to clauses of this Agreement.\n\nCONFIDENTIALITY AND NON-USE OBLIGATIONS\n\n2.1 Receiving Party shall hold all Confidential Information of Disclosing Party in strict confidence and shall exercise at least the same degree of care to avoid unauthorised disclosure, publication, or dissemination of Disclosing Party's Confidential Information as Receiving Party applies to its own confidential and proprietary information of like importance, but in no event less than a reasonable standard of care.\n\n2.2 Receiving Party agrees to use Disclosing Party's Confidential Information solely and exclusively for the Purpose and shall not exploit, commercialise, or use such Confidential Information for any other purpose or for the benefit of any third party without Disclosing Party's prior written approval.\n\n2.3 Receiving Party shall not copy, duplicate, or reproduce Disclosing Party's Confidential Information except to the extent strictly necessary for the Purpose. All copies shall remain the property of Disclosing Party and shall contain all proprietary notices present on the original.\n\n2.4 Receiving Party shall not decompile, disassemble, reverse engineer, or attempt to derive the composition or underlying source code of any software, binary modules, or prototypes furnished by Disclosing Party hereunder.\n\nPERMITTED DISCLOSURES\n\n3.1 Receiving Party may disclose Disclosing Party's Confidential Information only to those of its Representatives who:\n\n3.1.1 have an absolute need to know such information in connection with the Purpose;\n\n3.1.2 are informed of the confidential and proprietary nature of such Confidential Information; and\n\n3.1.3 are bound by confidentiality, non-disclosure, and restricted use undertakings substantially similar to and no less restrictive than those set forth in this Agreement.\n\n3.2 Receiving Party shall remain fully responsible and liable for any act, omission, or breach of this Agreement by any of its Representatives as if such act or omission had been committed directly by Receiving Party.\n\nEXCLUSIONS FROM CONFIDENTIAL INFORMATION\n\n4.1 The confidentiality obligations set forth in Clause 2 shall not apply to any information that Receiving Party can demonstrate through contemporaneous documentary evidence:\n\n4.1.1 is or becomes publicly available or known to the general public through no breach of this Agreement or fault of Receiving Party or its Representatives;\n\n4.1.2 was already lawfully in the possession of Receiving Party prior to disclosure by Disclosing Party, without any restriction on disclosure;\n\n4.1.3 is rightfully received by Receiving Party from an independent third party who has no direct or indirect confidentiality obligation to Disclosing Party with respect to such information; or\n\n4.1.4 was independently developed by Receiving Party's personnel without access to, reliance upon, or reference to any Confidential Information of Disclosing Party.\n\n4.2 Notwithstanding anything to the contrary in this Agreement, Receiving Party shall be free to use and exploit for any purpose any general ideas, concepts, know-how, methodologies, or techniques retained in the unaided memory of Receiving Party's or its Affiliates' personnel who have had authorised access to Disclosing Party's Confidential Information under this Agreement, provided that such personnel do not intentionally memorise such information for the purpose of evading the restrictions of this Agreement.\n\nLEGALLY REQUIRED DISCLOSURES\n\n5.1 Receiving Party may disclose Confidential Information to the extent required pursuant to a valid order of a court of competent jurisdiction or an administrative or regulatory agency, or pursuant to applicable statutory laws or regulations, provided that Receiving Party shall:\n\n5.1.1 give prompt written notice to Disclosing Party prior to making such disclosure, to the extent legally permissible, so that Disclosing Party may seek a protective order or other appropriate remedy;\n\n5.1.2 provide reasonable cooperation to Disclosing Party, at Disclosing Party's expense, in opposing or limiting the scope of such disclosure; and\n\n5.1.3 disclose only that portion of the Confidential Information that is legally mandated to be disclosed.\n\nRETURN OR DESTRUCTION OF MATERIALS\n\n6.1 Upon the written demand of Disclosing Party at any time, or upon the termination of this Agreement, Receiving Party shall promptly, and in any event within fourteen (14) calendar days:\n\n6.1.1 return to Disclosing Party or, at Disclosing Party's election, securely destroy and expunge all documents, materials, files, magnetic media, and embodiments containing Confidential Information; and\n\n6.1.2 provide a written certificate executed by an authorised corporate officer certifying compliance with the obligations set forth in Clause 6.1.1.\n\n6.2 Notwithstanding Clause 6.1, Receiving Party may retain one (1) archival copy of Confidential Information solely for legal, compliance, or regulatory audit purposes, and shall not be required to expunge automated electronic backup media created in the ordinary course of business, provided that all such retained information remains subject to the confidentiality and non-use provisions of this Agreement until destroyed.\n\nINTELLECTUAL PROPERTY AND NO WARRANTY\n\n7.1 All Confidential Information disclosed hereunder remains the exclusive and absolute property of Disclosing Party. Nothing in this Agreement shall be construed as granting, conferring, or implying any licence, title, interest, right, or ownership in or to any patent, copyright, trademark, trade secret, or other intellectual property rights of Disclosing Party.\n\n7.2 All Confidential Information is provided by Disclosing Party on an \"as is\" and \"with all faults\" basis. Disclosing Party disclaims any express or implied warranties of any kind regarding the accuracy, completeness, non-infringement, merchantability, or fitness for a particular purpose of its Confidential Information. Disclosing Party shall have no liability whatsoever resulting from Receiving Party's use of, or reliance upon, any Confidential Information.\n\n7.3 Nothing contained in this Agreement shall create an agency, joint venture, partnership, or employment relationship between the Parties, nor shall it oblige either Party to purchase any service, license any product, or enter into any definitive business agreement.\n\nPUBLICITY AND ANNOUNCEMENTS\n\n8.1 Subject to Clause 8.2, neither Party shall issue any press release, public announcement, or public disclosure regarding this Agreement, the discussions between the Parties, or the Purpose without the prior written consent of the other Party.\n\n8.2 Notwithstanding Clause 8.1, Vedanta shall be entitled to identify Halyard as a collaborative partner and include Halyard's corporate name, trade name, and standard corporate logo in Vedanta's marketing collateral, customer credentials presentations, and website partner directories without requiring further consent from Halyard.\n\nTERM AND TERMINATION\n\n9.1 This Agreement shall commence on the Effective Date and shall continue in force for an initial term of two (2) years, unless terminated earlier by either Party upon thirty (30) days' written notice to the other Party.\n\n9.2 The confidentiality, non-disclosure, and restricted use obligations of Receiving Party under this Agreement shall survive the expiration or termination of this Agreement for a period of three (3) years from the effective date of such termination or expiration, save that any Confidential Information constituting a trade secret under applicable law shall remain confidential for as long as it remains a trade secret.\n\nREMEDIES AND LIQUIDATED DAMAGES\n\n10.1 The Parties acknowledge that any breach of this Agreement may result in immediate, irreparable harm and injury to Disclosing Party for which monetary damages alone would be inadequate. Accordingly, Disclosing Party shall be entitled to seek injunctive relief, specific performance, and other equitable remedies in any court of competent jurisdiction to enforce the provisions hereof, without the necessity of proving actual damages or posting any bond.\n\n10.2 Without prejudice to Disclosing Party's right to seek injunctive relief under Clause 10.1, the Parties agree that in the event of any unauthorised disclosure, publication, or misuse of Confidential Information by Receiving Party or any of its Representatives, Receiving Party shall pay to Disclosing Party, as pre-estimated liquidated damages and not as a penalty, the fixed sum of £50,000 (fifty thousand pounds sterling) per breach, payable within thirty (30) days of receipt of Disclosing Party's formal written demand.\n\n10.3 The rights and remedies provided in this Agreement are cumulative and are not exclusive of any rights or remedies provided by law or equity.\n\nMISCELLANEOUS\n\n11.1 Assignment: Neither Party may assign, transfer, or novate this Agreement, in whole or in part, without the prior written consent of the other Party, except that either Party may assign this Agreement to an Affiliate or in connection with a merger, acquisition, corporate restructuring, or sale of substantially all of its assets upon written notice to the other Party.\n\n11.2 Entire Agreement: This Agreement constitutes the complete and exclusive understanding between the Parties concerning the subject matter hereof and supersedes all prior negotiations, representations, discussions, and agreements, whether oral or written.\n\n11.3 Amendments and Waivers: No amendment, modification, or waiver of any provision of this Agreement shall be valid or binding unless set forth in a written instrument duly signed by authorised signatories of both Parties. The failure of either Party to enforce any right or remedy shall not be construed as a waiver of that or any subsequent right or remedy.\n\n11.4 Severability: If any provision of this Agreement is held to be invalid, illegal, or unenforceable by any court of competent jurisdiction, such invalidity shall not affect the validity of the remaining provisions, and the Parties shall negotiate in good faith to replace the invalid provision with an enforceable provision that achieves the initial commercial intent.\n\n11.5 Notices: All notices or other communications required or permitted hereunder shall be in writing and delivered by hand, reputable international courier, or tracked post, or sent via electronic mail with confirmed receipt, to the addresses set forth in the preamble of this Agreement (or to such other address as a Party may designate in writing). Notices shall be deemed delivered upon verified receipt.\n\n11.6 Counterparts and Electronic Execution: This Agreement may be executed in two or more counterparts, each of which shall be deemed an original, and all of which together shall constitute one and the same instrument. Delivery of an executed counterpart via electronic signature platform or scanned PDF transmission shall be effective and legally binding.\n\n11.7 Governing Law and Jurisdiction: This Agreement, and any dispute, controversy, or claim (including non-contractual disputes or claims) arising out of or in connection with it or its subject matter or formation, shall be governed by and construed in accordance with the laws of England and Wales. The Parties irrevocably submit to the exclusive jurisdiction of the courts of England and Wales to settle any dispute or claim arising out of or in connection with this Agreement.\n\nIN WITNESS WHEREOF, the Parties hereto have caused this Mutual Non-Disclosure Agreement to be executed by their duly authorised representatives as of the Effective Date.\n\nVEDANTA INFOTECH SOLUTIONS PRIVATE LIMITED\nSignature: ______________________________\nName: ______________________________\nTitle: ______________________________\nDate: ______________________________\n\nHALYARD SOFTWARE LTD\nSignature: ______________________________\nName: ______________________________\nTitle: ______________________________\nDate: ______________________________\n", "C28": "MUTUAL NON-DISCLOSURE AGREEMENT\n\nTHIS AGREEMENT is entered into on 14 November 2026 (the Effective Date)\n\nBETWEEN:\n\n(1) VÉLOCE TECHNOLOGIES SAS, a simplified joint-stock company (société par actions simplifiée) organised and existing under the laws of France, having its registered office at 42 Rue du Faubourg Saint-Honoré, 75008 Paris, France, registered with the Paris Trade and Companies Register under number 849 201 345 R.C.S. Paris, represented by Monsieur Alexandre Mercier, in his capacity as Chief Executive Officer (Véloce); and\n\n(2) HALYARD SOFTWARE LTD, a private limited company incorporated and registered under the laws of England and Wales with company number 09876543, whose registered office is at 12 Mill Lane, Manchester M1 2AB, United Kingdom, represented by its duly authorised representative (Halyard).\n\nVéloce and Halyard are hereinafter referred to individually as a Party and collectively as the Parties.\n\nPREAMBLE\n\nWHEREAS, Véloce is a French enterprise specialised in the research, design, engineering and deployment of enterprise resource planning and workflow automation software solutions;\n\nWHEREAS, Halyard is a software vendor operating in the business-to-business sector, providing proprietary commercial application platforms;\n\nWHEREAS, the Parties contemplate entering into strategic discussions and exploratory evaluations concerning a prospective technical integration, interoperability assessment, and collaborative commercial distribution arrangement (the Permitted Purpose);\n\nWHEREAS, within the scope of the Permitted Purpose, each Party may disclose to the other Party certain proprietary, non-public, technical, commercial, financial and organisational information considered sensitive and confidential; and\n\nWHEREAS, the Parties wish to formalise herein the terms, restrictions and obligations governing the safeguarding, use, non-disclosure and protection of such proprietary information.\n\nNOW, THEREFORE, IN CONSIDERATION OF THE MUTUAL PROMISES AND COVENANTS CONTAINED HEREIN, THE PARTIES AGREE AS FOLLOWS:\n\nDEFINITIONS AND INTERPRETATION\n\n1.1 In this Agreement, unless the context otherwise demands, capitalised expressions shall bear the respective meanings assigned to them below:\n\n1.1.1 Affiliate means any entity that, directly or indirectly through one or more intermediaries, controls, is controlled by, or is under common control with a Party, where \"control\" means the direct or indirect ownership of more than fifty per cent (50%) of the voting shares or capital equity, or the actual power to designate or elect a majority of the management or governing organ;\n\n1.1.2 Agreement means this document, including its preamble, recitals and any potential appendices or amendments executed in writing by the Parties;\n\n1.1.3 Applicable Law means any statute, directive, decree, statutory instrument, regulation or binding rule of law applicable to a Party or to the performance of this Agreement;\n\n1.1.4 Business Day means any calendar day other than a Saturday, a Sunday, or a statutory public bank holiday on which commercial banking institutions are normally open for ordinary transactions in Paris, France and in London, England;\n\n1.1.5 Confidential Information means any information or data of any nature, whether technical, technological, industrial, financial, operational, strategic, commercial, customer-related, legal or otherwise, including without limitation computer programs, algorithms, data structures, source code, object code, APIs, database architectures, diagrams, flow charts, specifications, prototypes, know-how, product development roadmaps, financial plans, commercial conditions, and pricing models, disclosed directly or indirectly by the Disclosing Party to the Receiving Party, whether in verbal, written, graphic, electronic, physical, machine-readable or tangible form, on or after the Effective Date, which is designated as confidential or proprietary at the time of transmission or which, by reason of its character, content or the context of its communication, ought reasonably to be understood by a diligent professional operator to possess a confidential character. Confidential Information includes all analyses, summaries, synopses, extracts, records, notes and compilations prepared by the Receiving Party which contain, reflect or are developed from such disclosed data;\n\n1.1.6 Disclosing Party means the Party communicating, directly or via its authorised personnel, Confidential Information to the Receiving Party;\n\n1.1.7 Effective Date has the meaning set forth in the initial appearance of this Agreement;\n\n1.1.8 Receiving Party means the Party receiving, holding or having access to Confidential Information disclosed by or on behalf of the Disclosing Party.\n\n1.2 The division of this Agreement into numbered articles, clauses and sub-clauses is established exclusively for ease of reference and shall in no way affect or guide the construction or legal interpretation thereof. Words imparting the singular include the plural and vice versa, and references to statutory provisions encompass those enactments as amended, consolidated or replaced from time to time.\n\nPURPOSE AND FIELD OF ENGAGEMENT\n\n2.1 The Receiving Party undertakes to examine, handle, exploit and apply the Confidential Information transmitted by the Disclosing Party solely and exclusively in connection with, and to the extent strictly necessary for, the examination, implementation and furtherance of the Permitted Purpose.\n\n2.2 The Receiving Party is strictly prohibited from using, deploying, adapting, or otherwise exploiting the Confidential Information of the Disclosing Party, directly or indirectly, in whole or in part, for any commercial, industrial, developmental, or operational objective other than the Permitted Purpose, including but not limited to the independent development, design, improvement, or sale of competing software, platforms, tools, or services.\n\nOBLIGATIONS OF SECRECY AND SAFEGUARDING\n\n3.1 In consideration of the disclosure of Confidential Information, the Receiving Party covenants and agrees:\n\n3.1.1 to preserve the confidentiality of all Confidential Information with the highest standard of professional care, and in any event with no lesser degree of diligence, vigilance and protection than that which it accords to its own proprietary trade secrets and confidential assets of a similar elevated nature;\n\n3.1.2 to safeguard all tangible and digital embodiments of the Confidential Information against any unauthorised access, acquisition, theft, misappropriation, intrusion, transmission, copying or leak;\n\n3.1.3 to refrain from disclosing, publishing, disseminating, or communicating the Confidential Information to any external third party, whether a legal entity or a natural person, without having secured the prior, formal, explicit and written authorisation of the Disclosing Party;\n\n3.1.4 to restrict internal access to the Confidential Information strictly and exclusively to those of its own direct, permanent salaried employees who have an indispensable need to access such information for the sole accomplishment of the Permitted Purpose, and to ensure that such direct employees are bound by employment contracts or internal confidentiality undertakings imposing duties of secrecy and non-use no less rigorous than those set forth in this Agreement;\n\n3.1.5 to not disclose, disseminate or make available the Confidential Information to any external professional advisers, legal counsel, accountants, auditors, insurers, independent contractors, consultants, or corporate Affiliates without the prior written authorisation of the Disclosing Party, the Parties acknowledging that disclosure to any such external third parties or Group companies requires specific prior consent; and\n\n3.1.6 to refrain from disassembling, decompiling, decoding, reverse engineering, decrypting or attempting in any manner whatsoever to reconstruct, identify or derive the underlying design, logic, source code, data formats, trade secrets or operational algorithms of any software, binaries, libraries, cloud instances or technical assets provided under this Agreement.\n\nEXCLUSIONS FROM CONFIDENTIALITY\n\n4.1 The obligations established under Clause 3 shall not apply to any element of information in respect of which the Receiving Party is able to demonstrate conclusively by contemporaneous written documentation that such information:\n\n4.1.1 was already lawfully within the public domain prior to the time of its disclosure by the Disclosing Party, or subsequently entered the public domain through publication, open distribution or otherwise, without any direct or indirect breach, fault, negligence or omission on the part of the Receiving Party or its personnel;\n\n4.1.2 was already lawfully in the possession of the Receiving Party prior to its transmission under this Agreement, without any duty of secrecy or restriction on use;\n\n4.1.3 was lawfully obtained after the Effective Date from a bona fide third party who had the legitimate right to disclose such information without being subject to any direct or indirect obligation of confidentiality owed towards the Disclosing Party; or\n\n4.1.4 was conceived, authored and independently developed by employees or collaborators of the Receiving Party without having had access to, knowledge of, or reference to the Disclosing Party's Confidential Information.\n\nORDERED DISCLOSURES PURSUANT TO LAW\n\n5.1 In the event that the Receiving Party is commanded, summoned or legally compelled by a binding decree, writ, injunction or formal order issued by a court of competent jurisdiction, or by a lawful demand of an administrative or governmental supervisory authority possessing regulatory jurisdiction, to disclose any portion of the Disclosing Party's Confidential Information, the Receiving Party shall:\n\n5.1.1 advise the Disclosing Party in writing as promptly as possible, and in any case prior to making such disclosure, provided that such advance notification is not expressly prohibited by mandatory provisions of public order or criminal procedure;\n\n5.1.2 consult in good faith with the Disclosing Party regarding the appropriate avenues to oppose, limit, challenge or restrict the scope of the demanded disclosure; and\n\n5.1.3 in the event that disclosure cannot be avoided, disclose exclusively that portion of the Confidential Information which is strictly demanded by the judicial or administrative order, and use all reasonable commercial efforts to demand confidential and protected treatment for any data so released.\n\nPROPERTY, INTELLECTUAL RIGHTS AND DEVELOPMENTS\n\n6.1 All Confidential Information, together with all intellectual and industrial property rights, patents, copyrights, database rights, design rights, software rights and know-how embodied therein, shall remain the sole and exclusive property of the Disclosing Party or its respective licensors.\n\n6.2 Except for the limited, non-exclusive, revocable right to review and evaluate the Confidential Information strictly for the Permitted Purpose, nothing contained in this Agreement shall be interpreted as conferring or granting, expressly, impliedly, by estoppel or otherwise, any licence, title, ownership, assignment, franchise, option or right under any patent, trademark, copyright, database right, trade secret or other industrial property right owned, managed or controlled by the Disclosing Party.\n\n6.3 In the event that the Receiving Party, in the course of evaluating the Confidential Information or pursuing the Permitted Purpose, conceives, suggests, provides, designs or develops any improvements, modifications, derivative works, feedback, architectural recommendations or enhancements relating to the Disclosing Party's Confidential Information, software products, application interfaces or underlying algorithms, the Receiving Party hereby irrevocably assigns to the Disclosing Party, with full title guarantee, all right, title, interest and worldwide intellectual property rights in and to such improvements, modifications, derivative works, feedback, recommendations and enhancements, for the full duration of protection afforded under applicable intellectual property laws, without requirement of further consideration or royalties.\n\nWARRANTY EXCLUSIONS\n\n7.1 All Confidential Information disclosed under this Agreement is furnished on an \"as is\" and \"with all faults\" basis. The Disclosing Party provides no guarantee, warranty or representation, express, statutory or implied, regarding the accuracy, exhaustiveness, reliability, quality, merchantability, freedom from infringement of third-party rights, or fitness for any particular intention or operational objective of any information so communicated.\n\n7.2 The Disclosing Party shall incur no legal liability or civil responsibility towards the Receiving Party or any third party arising out of or resulting from the reception, interpretation, reliance upon or use of the Confidential Information by the Receiving Party.\n\nRESTITUTION AND DESTRUCTION\n\n8.1 Upon the written demand of the Disclosing Party, communicated at any moment, or automatically upon the expiry or termination of this Agreement, the Receiving Party shall promptly, and in all events within a strict delay of fifteen (15) Business Days:\n\n8.1.1 return to the Disclosing Party or, upon the explicit instruction of the Disclosing Party, permanently destroy, shred, erase or expunge all documents, dossiers, media, files, computer drives, tapes, storage units and tangible embodiments containing, reflecting or derived from the Disclosing Party's Confidential Information; and\n\n8.1.2 deliver to the Disclosing Party a formal certificate of destruction executed by an authorised corporate officer of the Receiving Party confirming the complete execution of the obligations provided under this Clause 8.1.\n\n8.2 By way of exception to Clause 8.1, the Receiving Party shall be entitled to retain one (1) copy of the Confidential Information strictly to the extent required to satisfy mandatory statutory obligations, audit requirements or legal compliance standards, or to the extent that such information is contained in automated, archived digital backups created in the regular course of disaster recovery operations; it being understood that any retained archival materials shall remain fully subject to the duties of confidentiality and non-use under this Agreement until their ultimate eradication.\n\nCONTRACTUAL LIABILITY AND STIPULATED COMPENSATION\n\n9.1 The Parties recognise that the Confidential Information constitutes an essential proprietary asset possessing substantial commercial, technical and strategic value, the unauthorised disclosure or illicit exploitation of which would cause irreversible harm and profound commercial disturbance to the Disclosing Party.\n\n9.2 Each Party agrees to indemnify, defend and hold harmless the other Party against all direct losses, claims, liabilities, damages and reasonable legal expenses incurred as a direct consequence of any proven material breach of the confidentiality undertakings established herein.\n\n9.3 In recognition of the severe difficulty in quantifying the precise damage, commercial disruption and loss of competitive advantage occasioned by a breach of secrecy, the Parties expressly agree that in the event of any proven breach by the Receiving Party of its obligations under Clause 2, Clause 3 or Clause 8 of this Agreement, the Receiving Party shall pay to the Disclosing Party, as fixed liquidated damages and by way of stipulated compensation, the sum of €75,000 for each such individual breach, payable within thirty (30) days following formal written notification thereof, without prejudice to the Disclosing Party's right to pursue injunctive relief or claim higher proven damages in excess of this amount.\n\nDURATION AND SURVIVAL\n\n10.1 This Agreement takes effect on the Effective Date and shall remain in force for an initial term of two (2) years, unless terminated earlier by either Party by serving thirty (30) days' prior written notice to the other Party.\n\n10.2 The confidentiality, non-use and non-disclosure obligations stipulated under this Agreement shall survive the expiration or termination of this Agreement for an additional duration of five (5) years reckoned from the date of such expiration or termination, save that with respect to any Confidential Information that constitutes a trade secret under Applicable Law, such undertakings shall survive indefinitely for as long as the underlying information retains its character as a trade secret.\n\nGOVERNING LAW AND JURISDICTION\n\n11.1 This Agreement and any dispute, controversy, proceedings or claim of whatever nature (including non-contractual disputes or claims) arising out of or in connection with it or its subject matter, formation, interpretation, performance or termination shall be governed by, and construed in accordance with, the law of England and Wales.\n\n11.2 Each Party irrevocably agrees that the courts of England and Wales shall have exclusive jurisdiction to settle, hear and adjudicate any dispute, claim, litigation or controversy (including non-contractual disputes or claims) arising out of or in connection with this Agreement or its subject matter or formation.\n\nMISCELLANEOUS STIPULATIONS\n\n12.1 Entire Agreement. This Agreement sets forth the entire understanding and contractual agreement between the Parties with respect to the subject matter hereof, and cancels, supersedes and extinguishes all prior oral or written representations, declarations, discussions, undertakings and preliminary agreements between them regarding such subject matter.\n\n12.2 Amendments. No modification, supplement, variation or waiver of any term or condition of this Agreement shall be legally valid or operative unless documented in writing and duly signed by an authorised corporate representative of each Party.\n\n12.3 Severability. If any provision, clause or stipulation of this Agreement is held by any competent court or authority to be null, void, illegal or unenforceable, whether in whole or in part, such invalidity or unenforceability shall not affect or impair the validity, legality and enforceability of the remaining provisions of this Agreement, which shall remain in full force and effect.\n\n12.4 Non-Waiver. The failure or delay by either Party at any time to require strict performance by the other Party of any provision of this Agreement shall in no circumstance be deemed to constitute a waiver or abandonment of that provision or of the right to enforce that or any other provision at a later date.\n\n12.5 Assignment. Neither Party may assign, transfer, delegate, subcontract or novate any of its rights, benefits, burdens or obligations under this Agreement to any third party, whether by operation of law, merger, change of control or otherwise, without having procured the prior written consent of the other Party.\n\n12.6 Notices. Any notice, formal demand, communication or request required or permitted under this Agreement shall be in writing in the English language and shall be deemed duly delivered when remitted by hand against written receipt, sent by international registered airmail or recorded courier service, or transmitted by electronic mail with confirmed delivery report, to the registered addresses of the Parties indicated in the preamble of this Agreement.\n\n12.7 Counterparts and Electronic Execution. This Agreement may be executed in any number of counterparts, each of which shall be deemed an original, and all of which together shall constitute one and the same instrument. Execution and transmission of this Agreement via an electronic signature system (such as DocuSign or Adobe Sign) or by exchange of electronic PDF copies shall be valid, binding and effective for all legal intents and purposes.\n\n12.8 Legal Fees and Dispute Costs. In the event of any judicial proceeding, litigation or contentious action arising out of or in connection with the enforcement, interpretation or alleged breach of this Agreement, the prevailing Party shall be entitled to recover from the non-prevailing Party all of its legal costs, attorney fees, disbursements and related litigation expenses on a full indemnity basis, irrespective of any procedural rules of court or judicial discretion governing the allocation of statutory costs.\n\nIN WITNESS WHEREOF, the Parties have executed this Agreement by their duly authorised corporate officers on the date first written above.\n\nFor and on behalf of VÉLOCE TECHNOLOGIES SAS\nSignature: ______________________________\nName: Alexandre Mercier\nTitle: Chief Executive Officer\nDate: ______________________________\n\nFor and on behalf of HALYARD SOFTWARE LTD\nSignature: ______________________________\nName: ______________________________\nTitle: ______________________________\nDate: ______________________________\n", "C29": "MUTUAL NON-DISCLOSURE AGREEMENT\n\nDATED: 14 October 2026\n\nPARTIES:\n\n(1) VANTIS ANALYTICS LIMITED, a company incorporated in England and Wales under company number 11849201, whose registered office is at 5th Floor, The Zig Zag Building, 70 Victoria Street, London SW1E 6SQ (Vantis); and\n\n(2) HALYARD SOFTWARE LTD, a company incorporated in England and Wales under company number 09876543, whose registered office is at 12 Mill Lane, Manchester M1 2AB (Halyard).\n\nVantis and Halyard are each referred to as a Party and collectively as the Parties.\n\nBACKGROUND:\n\nThe Parties intend to enter into discussions regarding a potential commercial arrangement or corporate transaction between them (the Purpose). In connection with the Purpose, each Party may disclose to the other confidential and proprietary technical, commercial, financial or operational information. The Parties agree to protect such information on the terms of this Agreement.\n\nOPERATIVE PROVISIONS:\n\nDefinitions\n\n1.1 In this Agreement, unless the context otherwise requires:\n\n1.1.1 Agreement means this mutual non-disclosure agreement.\n\n1.1.2 Business Day means any day other than a Saturday, Sunday or public holiday in England when clearing banks in the City of London are open for business.\n\n1.1.3 Confidential Information means any and all information of a confidential, sensitive or proprietary nature (whether commercial, technical, operational, financial, administrative or otherwise) relating to a Party, which is disclosed or made available by or on behalf of that Party (the Disclosing Party) to the other Party (the Recipient), directly or indirectly, in written, electronic, oral, visual or any other tangible or intangible form, whether before, on or after the date of this Agreement, including all software code, product architecture, data models, algorithm designs, customer lists, pipeline figures, trade secrets, pricing models, and all derivative materials prepared by the Recipient containing or reflecting such information.\n\n1.1.4 Disclosing Party has the meaning given in Clause 1.1.3.\n\n1.1.5 Recipient has the meaning given in Clause 1.1.3.\n\nConfidentiality Undertakings\n\n2.1 In consideration of the mutual disclosure of Confidential Information, the Recipient agrees and undertakes that it shall:\n\n2.1.1 treat all Confidential Information disclosed by the Disclosing Party as strictly confidential and preserve its confidentiality with at least the same degree of care as it uses for its own confidential information of a similar nature, but in no event less than a reasonable standard of care;\n\n2.1.2 use the Disclosing Party's Confidential Information solely and exclusively for the Purpose, and for no other commercial, developmental, testing or competitive purpose whatsoever;\n\n2.1.3 keep the Confidential Information in safe and secure custody, preventing any unauthorised access, copying, disclosure or distribution; and\n\n2.1.4 not copy, reproduce, reduce to writing or record the Confidential Information except to the extent strictly necessary for the Purpose.\n\nExclusions from Confidentiality\n\n3.1 The obligations in Clause 2 shall not apply to any specific portion of Confidential Information that the Recipient can demonstrate to the reasonable satisfaction of the Disclosing Party:\n\n3.1.1 is at the time of disclosure, or subsequently becomes, part of the public domain, provided that such availability in the public domain does not arise directly or indirectly from a breach of this Agreement or any other confidentiality obligation owed by any person; or\n\n3.1.2 is received on an unrestricted basis after disclosure hereunder from an independent third party who, to the best of the Recipient's knowledge after diligent enquiry, is not under any obligation of confidentiality to the Disclosing Party in respect of such information.\n\nPermitted Access and Disclosure\n\n4.1 The Recipient shall restrict access to the Disclosing Party's Confidential Information exclusively to those of its own direct employees who have a strict need to know such information for the performance of the Purpose. The Recipient shall not disclose, transmit or make available any Confidential Information to any other person, entity or organisation whatsoever, including any external legal, financial or tax advisers, auditors, insurers, sub-contractors or corporate affiliates of the Recipient.\n\n4.2 The Recipient shall ensure that each of its employees having access to the Confidential Information is informed of its confidential nature and is bound by professional or contractual duties of confidentiality sufficient to enforce the obligations in this Agreement. The Recipient remains directly liable for any breach of this Agreement caused by the act or omission of any such employee.\n\n4.3 The Recipient may disclose Confidential Information to the minimum extent required by an order of a court of competent jurisdiction or by mandatory statutory requirement, provided that the Recipient gives the Disclosing Party immediate written notice of such requirement (where legally permissible) to enable the Disclosing Party to seek a protective order or other appropriate remedy.\n\nKnowledge and Residuals\n\n5.1 Nothing in this Agreement shall restrict or prevent the Recipient from using or developing any ideas, concepts, know-how, methods or techniques retained in the unaided memory of its personnel who have had authorised access to the Disclosing Party's Confidential Information under this Agreement, and the Recipient shall have no liability in respect of any subsequent use or exploitation thereof, provided that such personnel do not intentionally memorize such information for the purpose of reproducing it.\n\nReturn and Destruction of Materials\n\n6.1 Upon the written demand of the Disclosing Party at any time, or automatically upon the termination of discussions relating to the Purpose, the Recipient shall within five (5) Business Days:\n\n6.1.1 return to the Disclosing Party, or securely destroy or erase, all documents, records, files, magnetic media and other tangible or electronic embodiments of the Disclosing Party's Confidential Information in its possession, custody or control; and\n\n6.1.2 confirm in writing, signed by an authorised officer of the Recipient, that all such Confidential Information has been returned, deleted or destroyed in accordance with this Clause 6.1.\n\n6.2 Notwithstanding Clause 6.1, the Recipient may retain one archival copy of the Confidential Information solely in off-site automated disaster recovery backups, provided that such retained copies shall remain subject to the obligations of this Agreement until destroyed in the ordinary course of the Recipient's automated retention cycle.\n\nProprietary Rights\n\n7.1 All Confidential Information, including all intellectual property rights subsisting therein, shall remain the sole and exclusive property of the Disclosing Party or its third-party licensors.\n\n7.2 No licence, assignment or transfer of any intellectual property right, proprietary right or right of use is granted or implied under this Agreement, save for the express limited right to review the Confidential Information solely for the Purpose.\n\n7.3 All Confidential Information is furnished without warranty of any kind, whether express, implied or statutory, including warranties as to accuracy, completeness, non-infringement or fitness for purpose.\n\nTerm and Duration\n\n8.1 This Agreement shall take effect from the date first written above and shall continue in force for a period of two (2) years, unless terminated earlier by either Party upon giving fourteen (14) days' written notice to the other Party.\n\n8.2 The obligations of confidentiality, non-use and non-disclosure set out in this Agreement shall survive the termination or expiry of this Agreement and shall remain binding on the Recipient for a period of three (3) years from the effective date of termination or expiry.\n\nGeneral Provisions\n\n9.1 Injunctive Relief. The Parties acknowledge that money damages may be an inadequate remedy for any breach of this Agreement and that each Party shall be entitled to seek injunctive relief, specific performance or other equitable remedies in respect of any actual or threatened breach.\n\n9.2 Entire Agreement. Heretofore and hereinafter, this Agreement, together with any schedules hereto, constitutes the entire and whole understanding and covenant between the Parties with respect to the subject matter hereof, and notwithstanding the foregoing or any prior negotiations, supersedes, cancels, extinguishes and nullifies in its entirety all previous parol, oral, written or tacit representations, promises, assurances, warranties and agreements between the said Parties touching upon the premises.\n\n9.3 Non-Assignment. Neither Party may assign, novate, transfer or subcontract
