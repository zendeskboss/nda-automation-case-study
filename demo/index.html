essity of posting any bond or other security, and without proving actual damages, to seek and obtain immediate injunctive relief, specific performance, restraining orders and such other equitable remedies as a court of competent jurisdiction may deem just and appropriate.\n9.3 The exercise of any equitable remedy pursuant to Clause 9.2 shall be cumulative and shall be in addition to, and not in substitution for, any other rights, remedies, damages or legal recourses available to the Disclosing Party under this Agreement or at law or in equity.\n\nGeneral Provisions\n10.1 Assignment and Transfer. Neither Party may assign, transfer, novate, charge, encumber, subcontract, declare a trust over or deal in any other manner with any or all of its rights or obligations under this Agreement, in whole or in part, without the prior written consent of the other Party, and any purported assignment or transfer in violation of this Clause 10.1 shall be null, void ab initio and of no legal effect.\n10.2 Notices. Any notice, demand, request or other communication required or permitted to be given under or in connection with this Agreement shall be in writing, in the English language, and shall be delivered personally, sent by pre-paid first-class post or registered airmail (or international courier service with tracking), or transmitted by electronic mail to the designated address or email address of the respective Party set forth below (or to such other address or email address as a Party may from time to time notify to the other Party in writing in accordance with this Clause 10.2):\n(a) To Halyard:\nAddress: 12 Mill Lane, Manchester M1 2AB, United Kingdom\nAttention: Legal Department / Managing Director\nEmail: legal@halyardsoftware.co.uk\n(b) To Counterparty:\nAddress: Industriestrasse 42, 60314 Frankfurt am Main, Germany\nAttention: Head of Legal Affairs / Corporate Compliance\nEmail: legal@beiersdorf-technologies.de\n10.3 Deemed Receipt of Notices. A notice shall be deemed to have been validly received:\n(a) if delivered personally, at the time of delivery and signature of a delivery receipt;\n(b) if sent by pre-paid first-class post or registered mail, at 9:00 a.m. on the second (2nd) Business Day following the date of posting;\n(c) if sent by international courier service, upon signature of the courier delivery record; and\n(d) if transmitted by email, at the time of transmission, provided that no automated delivery failure notification or bounce-back message is received by the sender, and provided further that if transmission occurs outside normal business hours in the recipient's jurisdiction, notice shall be deemed received at 9:00 a.m. on the next following Business Day.\n10.4 Severability. If any provision, clause, sub-clause or part of this Agreement is held by any court, tribunal or administrative body of competent jurisdiction to be invalid, illegal, void or unenforceable under any applicable law, such provision or part-provision shall, to the extent required, be deemed deleted and of no legal force, and the validity, legality and enforceability of the remaining provisions of this Agreement shall not be affected or impaired thereby. The Parties shall negotiate in good faith to replace any invalid or unenforceable provision with a valid and enforceable provision that achieves, to the greatest extent possible, the economic, legal and commercial objectives of the original provision.\n10.5 Entire Agreement. This Agreement constitutes the entire agreement and understanding between the Parties with respect to the subject matter hereof, and supersedes, replaces and extinguishes all prior drafts, agreements, arrangements, negotiations, representations, warranties, understandings and communications between the Parties, whether oral or written, relating to such subject matter.\n10.6 Amendments and Modifications. No variation, modification, amendment or waiver of any provision of this Agreement shall be valid or effective unless it is set forth in a written instrument specifically referencing this Agreement and signed by a duly authorised representative of each Party.\n10.7 Waivers. No failure or delay by either Party in exercising any right, power, privilege or remedy under this Agreement shall operate as a waiver thereof, nor shall any single or partial exercise of any right, power, privilege or remedy preclude any other or further exercise thereof or the exercise of any other right, power, privilege or remedy. A waiver of any breach of any provision of this Agreement shall not constitute a waiver of any subsequent breach of the same or any other provision.\n10.8 Counterparts. This Agreement may be executed in any number of identical counterparts, each of which when executed and delivered shall constitute an original, but all the counterparts shall together constitute one and the same instrument. Delivery of an executed counterpart of this Agreement by email transmission of a PDF or scan or through an established electronic signature platform (such as DocuSign or Adobe Sign) shall be equally effective as delivery of an original manually executed hard copy counterpart of this Agreement.\n10.9 Third Party Rights. Except as expressly provided herein, a person who is not a party to this Agreement shall not have any rights under the Contracts (Rights of Third Parties) Act 1999 or otherwise to enforce any term or condition of this Agreement.\n10.10 Governing Law. This Agreement, and any dispute, controversy, claim or obligation (whether contractual or non-contractual) arising out of or in connection with it or its subject matter or formation, shall be governed by, construed, interpreted and enforced in accordance with the substantive laws of England and Wales, without regard to any conflict of laws principles that would apply the laws of any other jurisdiction.\n10.11 Jurisdiction. Each Party irrevocably and unconditionally agrees that the courts of England and Wales shall have exclusive jurisdiction to settle, hear and determine any dispute, controversy or claim (including non-contractual disputes, claims or proceedings) arising out of, relating to or in connection with this Agreement, its subject matter, formation, validity, interpretation, breach or termination. Each Party irrevocably submits to the exclusive jurisdiction of such courts and waives any objection to proceedings in such courts on the grounds of venue or on the grounds that the proceedings have been brought in an inconvenient forum.\n\nIN WITNESS WHEREOF, the Parties have caused this Mutual Non-Disclosure Agreement to be duly executed by their respective authorised signatories as of the Effective Date.\n\nFor and on behalf of\nHALYARD SOFTWARE LTD\n\nSignature: __________________________________\nName: Arthur Pendelton\nTitle: Chief Executive Officer\nDate: 14 October 2026\n\nFor and on behalf of\nBEIERSDORF TECHNOLOGIES GMBH\n\nSignature: __________________________________\nName: Dr. Hans-Jürgen Weber\nTitle: Managing Director & Chief Technology Officer\nDate: 14 October 2026\n", "C13": "MUTUAL NON-DISCLOSURE AGREEMENT\n\nDATED: 18 November 2026\n\nPARTIES:\n\nMONETAFLOW TECHNOLOGIES LTD, a company registered in England and Wales under company number 12847102, whose registered office is at 4th Floor, 80 Old Street, London EC1V 9AZ (MonetaFlow); and\n\nHALYARD SOFTWARE LTD, a company registered in England and Wales under company number 09876543, whose registered office is at 12 Mill Lane, Manchester M1 2AB (Halyard).\n\nMonetaFlow and Halyard may each be referred to as a \"Party\" or collectively as the \"Parties\".\n\nBACKGROUND:\nThe Parties wish to explore potential collaborative and commercial opportunities in financial technology and software integration (the \"Permitted Purpose\"). In doing so, either Party may disclose non-public, commercially sensitive or proprietary information to the other. This Agreement establishes the ground rules to protect that information.\n\nAGREED TERMS:\n\nDefinitions\n1.1 The following definitions apply across this Agreement:\n1.1.1 \"Confidential Information\" means all information of a confidential or proprietary nature disclosed directly or indirectly by or on behalf of one Party (the \"Discloser\") to the other Party (the \"Recipient\"), whether disclosed orally, in writing, electronically or by any other means, and whether marked as confidential or that reasonably ought to be understood as confidential given its content or the circumstances of disclosure. It includes business models, financial data, pricing, customer lists, software code, APIs, architecture, product roadmaps, algorithms and trade secrets.\n1.1.2 \"Representative\" means a director, officer, employee, contractor, professional adviser or auditor of a Party or of any affiliate within its corporate group.\n\nConfidentiality Obligations\n2.1 In consideration of receiving Confidential Information, the Recipient agrees that it shall:\n2.1.1 use Confidential Information solely to evaluate and pursue the Permitted Purpose and for no other reason;\n2.1.2 hold all Confidential Information in strict confidence and apply at least the same degree of care it uses for its own confidential data of similar value, but never less than a reasonable standard of security;\n2.1.3 not disclose Confidential Information to any third party, except to those of its Representatives who need to know it for the Permitted Purpose, provided such Representatives are bound by written confidentiality obligations at least as strict as those in this Agreement; and\n2.1.4 be responsible for any breach of this Agreement caused by its Representatives.\n\nStandard Carve-Outs\n3.1 The obligations in Clause 2 do not apply to information that the Recipient can demonstrate:\n3.1.1 is already in or enters the public domain without any breach of this Agreement;\n3.1.2 was already lawfully known to the Recipient before disclosure, free of any duty of confidence;\n3.1.3 is received legitimately from an independent third party who has no duty of confidentiality to the Discloser; or\n3.1.4 was developed independently by the Recipient without using, referencing or relying on the Discloser's Confidential Information.\n\nCompelled Disclosures\n4.1 The Recipient may disclose Confidential Information to the extent required by an applicable law, binding court order, or formal request from a competent regulatory or supervisory authority.\n4.2 Before making any disclosure under Clause 4.1, where lawful to do so, the Recipient shall promptly notify the Discloser in writing so the Discloser may seek a protective order or other appropriate remedy. The Recipient shall provide reasonable cooperation to the Discloser, at the Discloser's sole expense, in any lawful effort to resist, narrow or safeguard the disclosure.\n\nReturn and Destruction\n5.1 Upon the Discloser's written request at any time, the Recipient shall promptly:\n5.1.1 securely destroy or return all materials containing or reflecting Confidential Information in its custody or control; and\n5.1.2 provide written confirmation that it has complied with this Clause 5.1 within ten (10) business days.\n5.2 The Recipient may keep copies of Confidential Information to the extent required by applicable law, regulatory compliance or automated electronic system backups created in the ordinary course of business. Any retained copies remain subject to the obligations of this Agreement until destroyed.\n\nProperty and No Rights Granted\n6.1 All Confidential Information remains the exclusive property of the Discloser.\n6.2 Neither this Agreement nor any disclosure grants the Recipient any licence, title or intellectual property right in or to any Confidential Information, except the limited right to use it strictly for the Permitted Purpose.\n6.3 Information is shared on an \"as is\" basis without warranty of any kind regarding accuracy or completeness.\n\nDuration\n7.1 This Agreement takes effect on the date set out above and remains in effect for two (2) years, unless terminated earlier by either Party giving thirty (30) days' prior written notice.\n7.2 Each Party's duty of confidentiality under this Agreement continues for three (3) years after the date of termination or expiry, except that trade secrets remain protected for as long as they constitute a trade secret under applicable law.\n\nGeneral\n8.1 Neither Party will issue any press release or public statement mentioning the other Party or the discussions between them without prior written approval.\n8.2 Each Party acknowledges that damages alone may not be an adequate remedy for breach, and each Party is entitled to seek injunctive relief and specific performance to prevent or remedy any actual or threatened breach.\n8.3 Neither Party may assign or transfer its rights or obligations under this Agreement without the prior written consent of the other Party.\n8.4 If any provision of this Agreement is held to be invalid or unenforceable, the remaining provisions will continue in full force and effect.\n8.5 No failure or delay by a Party to exercise any right under this Agreement operates as a waiver of that right.\n8.6 This Agreement constitutes the entire agreement between the Parties relating to this subject matter and supersedes all prior discussions and understandings. Any amendment must be in writing and signed by both Parties.\n8.7 This Agreement does not create any rights enforceable by any third party under the Contracts (Rights of Third Parties) Act 1999.\n8.8 This Agreement may be executed in counterparts, including by electronic signature, each of which is an original and together form one instrument.\n8.9 This Agreement and any dispute or claim arising out of or in connection with it or its subject matter or formation (including non-contractual disputes or claims) shall be governed by and construed in accordance with the law of England and Wales.\n8.10 Each Party irrevocably agrees that the courts of England and Wales shall have exclusive jurisdiction to settle any dispute or claim arising out of or in connection with this Agreement or its subject matter or formation.\n\nSigned for and on behalf of MONETAFLOW TECHNOLOGIES LTD\nSignature: ______________________________\nName: ______________________________\nTitle: ______________________________\nDate: ______________________________\n\nSigned for and on behalf of HALYARD SOFTWARE LTD\nSignature: ______________________________\nName: ______________________________\nTitle: ______________________________\nDate: ______________________________\n", "C14": "MUTUAL NON-DISCLOSURE AGREEMENT\n\nTHIS AGREEMENT is made the 18th day of November 2026\n\nBETWEEN:\n\n(1) BALLYBRICK SOFTWARE DISTRIBUTION LIMITED, a private company limited by shares incorporated under the laws of Ireland with registered number 584920 and having its registered office at Unit 4, Sandyford Business Centre, Blackthorn Road, Sandyford, Dublin 18, Ireland (hereinafter referred to as \"Ballybrick\"); and\n\n(2) HALYARD SOFTWARE LTD, a company incorporated in England and Wales under company number 09876543 and having its registered office at 12 Mill Lane, Manchester M1 2AB (hereinafter referred to as \"Halyard\").\n\nBallybrick and Halyard may hereinafter be referred to individually as a \"Party\" and collectively as the \"Parties\".\n\nWHEREAS:\n\n(A) The Parties are desirous of entering into discussions and evaluating a prospective commercial transaction concerning the potential distribution, reselling and integration of software solutions (the \"Permitted Purpose\").\n\n(B) In furtherance of the Permitted Purpose, it is contemplated that each Party may disclose to the other Party certain technical, commercial and financial information of a secret and confidential nature.\n\n(C) The Parties hereto have agreed to execute this Agreement to record the terms and conditions governing the protection, disclosure, non-use and preservation of such information.\n\nNOW IT IS HEREBY AGREED as follows:\n\nDEFINITIONS AND INTERPRETATION\n\n1.1 In this Agreement, unless the subject or context otherwise requires, the following expressions shall have the following meanings:\n\n1.1.1 \"Affiliate\" means, in respect of any company, any other undertaking that directly or indirectly Controls, is Controlled by, or is under common Control with, such company from time to time;\n\n1.1.2 \"Applicable Law\" means any statute, directive, statutory instrument, regulation, order, judgment, decree or rule of law in force from time to time in any relevant jurisdiction;\n\n1.1.3 \"Business Day\" means any day other than a Saturday, Sunday or statutory or public holiday in London or Dublin;\n\n1.1.4 \"Control\" means the beneficial ownership of more than fifty per cent (50%) of the issued share capital or voting rights of an entity, or the legal power to direct or cause the direction of the general management and policies of an entity;\n\n1.1.5 \"Disclosing Party\" means the Party disclosing or making available Confidential Information, whether directly or indirectly, to the Receiving Party;\n\n1.1.6 \"Information\" or \"Confidential Information\" means all information of whatsoever nature and in whatever form or medium (whether oral, written, electronic, pictorial, magnetic, digital or machine-readable) disclosed or made available by or on behalf of the Disclosing Party to the Receiving Party, whether before, on or after the date hereof, relating to the business, affairs, products, software, source code, object code, system architectures, trade secrets, pricing policies, financial projections, reseller matrices, customer accounts or operations of the Disclosing Party or its Affiliates, which is marked as proprietary or confidential or which by its very nature ought reasonably to be understood by a prudent commercial person to be confidential, together with all analyses, compilations, extracts, notes, memoranda and other records prepared by the Receiving Party containing or reflecting such information;\n\n1.1.7 \"Receiving Party\" means the Party receiving or obtaining Confidential Information, whether directly or indirectly, from or on behalf of the Disclosing Party; and\n\n1.1.8 \"Representatives\" means the directors, officers, employees, professional legal advisers, accountants, auditors and corporate consultants of a Party or of its Affiliates.\n\n1.2 In this Agreement:\n\n1.2.1 words importing the singular include the plural and vice versa, and words importing any gender include all genders;\n\n1.2.2 references to persons include individuals, bodies corporate, unincorporated associations, partnerships and any state or state agency;\n\n1.2.3 the headings and sub-headings are inserted for ease of reference only and shall not affect the construction or interpretation of this Agreement; and\n\n1.2.4 references to Clauses are to clauses of this Agreement.\n\nCONFIDENTIALITY OBLIGATIONS\n\n2.1 In consideration of the mutual disclosure of Confidential Information hereunder, the Receiving Party hereby covenants, warrants and agrees with the Disclosing Party that it shall:\n\n2.1.1 treat, preserve and hold all Confidential Information of the Disclosing Party in the strictest confidence and not disclose, divulge, impart or publish the same, in whole or in part, to any person or entity whatsoever, save as expressly sanctioned pursuant to this Agreement;\n\n2.1.2 apply to the Confidential Information of the Disclosing Party no less a standard of care and degree of security than it applies to its own confidential material of like character, and in any event exercise no less than a high degree of reasonable professional diligence to prevent any unauthorised access, publication, misappropriation or misuse;\n\n2.1.3 utilise and exploit the Confidential Information of the Disclosing Party solely and exclusively for the Permitted Purpose, and under no circumstances utilise the same for its own commercial benefit or for any other purpose whatsoever without the antecedent written consent of the Disclosing Party; and\n\n2.1.4 refrain from reverse engineering, decompiling, disassembling, probing, translating or otherwise attempting to reconstruct or discover any underlying algorithms, protocols, source code or architectural blueprints of any software, platforms, scripts or technical artifacts furnished by the Disclosing Party.\n\n2.2 The Receiving Party shall forthwith notify the Disclosing Party in writing upon discovering or suspecting any unauthorised use, disclosure, dissemination or loss of any Confidential Information, and shall, at its own expense, co-operate fully with the Disclosing Party in taking all reasonable steps to recover the information and mitigate the effects thereof.\n\nPERMITTED DISCLOSURES\n\n3.1 The Receiving Party shall be entitled to disclose the Confidential Information of the Disclosing Party only to such of its Representatives and Affiliates who have a clear and demonstrable need to know the same strictly for the discharge of the Permitted Purpose, provided always that:\n\n3.1.1 the Receiving Party shall, anterior to any such disclosure, fully apprise each such Representative and Affiliate of the strictly confidential character of the Information;\n\n3.1.2 each such Representative and Affiliate is subject to binding confidentiality undertakings or professional obligations of secrecy no less restrictive than those embodied in this Agreement; and\n\n3.1.3 the Receiving Party shall remain primarily liable and fully responsible to the Disclosing Party for any breach of the terms of this Agreement committed by any such Representative or Affiliate as if such breach had been committed by the Receiving Party itself.\n\nEXCLUSIONS FROM CONFIDENTIALITY\n\n4.1 The covenants, undertakings and restrictions set out in Clause 2 shall not apply to any Information which the Receiving Party can conclusively demonstrate by contemporaneous documentary evidence:\n\n4.1.1 is in or enters the public domain at the time of disclosure, or subsequently becomes generally available to the public otherwise than by default, breach or omission on the part of the Receiving Party or its Representatives;\n\n4.1.2 was already lawfully in the possession of the Receiving Party prior to disclosure hereunder, without any preexisting restriction as to confidentiality or use;\n\n4.1.3 is received on a non-confidential basis from a third party who had the lawful right to disclose such Information without being in breach of any obligation of confidentiality owed directly or indirectly to the Disclosing Party; or\n\n4.1.4 has been independently developed and arrived at by the personnel of the Receiving Party without reference to, reliance upon or derivation from the Confidential Information of the Disclosing Party.\n\nMANDATORY AND COMPELLED DISCLOSURE\n\n5.1 If the Receiving Party or any of its Representatives is required to disclose any Confidential Information by operation of Applicable Law, valid subpoena, court order or any formal demand of a competent regulatory or supervisory authority, the Receiving Party may disclose such Information strictly to the extent required, provided that, to the extent legally permissible, it shall:\n\n5.1.1 give prompt written notice thereof to the Disclosing Party so that the Disclosing Party may seek a protective order, injunction or other appropriate remedy;\n\n5.1.2 consult with the Disclosing Party and render all reasonable assistance, at the Disclosing Party's sole expense, in opposing or restricting the scope of such disclosure; and\n\n5.1.3 in the event that disclosure is unavoidable, furnish only that portion of the Confidential Information which is legally mandated, and use all reasonable endeavours to obtain reliable assurance that confidential treatment will be accorded to the Information so disclosed.\n\nRETURN AND DESTRUCTION OF MATERIALS\n\n6.1 Subject to Clause 6.2, upon the written demand of the Disclosing Party at any time, or forthwith upon the termination or expiry of this Agreement, the Receiving Party shall:\n\n6.1.1 securely deliver up to the Disclosing Party or, at the Disclosing Party's written direction, permanently delete and destroy all documents, media, software, files and materials containing, embodying or derived from the Confidential Information then in its possession, custody or control; and\n\n6.1.2 provide to the Disclosing Party, within fourteen (14) days of such demand, a formal certificate signed by a duly authorised officer confirming full compliance with the provisions of this Clause 6.1.\n\n6.2 Notwithstanding the provisions of Clause 6.1, the Receiving Party shall be entitled to retain one (1) copy of the Confidential Information to the extent strictly necessary for compliance with mandatory legal, regulatory or professional record-keeping obligations, and shall not be obliged to expunge copies created in the ordinary course of business pursuant to routine, automated electronic archival and disaster-recovery backup procedures, provided that any Information so retained shall remain subject to the confidentiality and non-use covenants herein contained for so long as it is retained.\n\nPROPRIETARY RIGHTS AND NEGATIVE WARRANTIES\n\n7.1 All Confidential Information, including all intellectual property rights therein, shall remain the sole, absolute and exclusive property of the Disclosing Party and its licensors. Neither the execution of this Agreement nor the disclosure of any Information hereunder shall be construed as conferring, directly, indirectly or by implication, estoppel or otherwise, any licence, title, patent, copyright, trademark or other proprietary right upon the Receiving Party.\n\n7.2 All Confidential Information is provided by the Disclosing Party on an \"as is\" basis without warranty of any kind. Neither Party makes any representation, warranty, assurance or covenant, whether express, implied, statutory or otherwise, as to the accuracy, completeness, efficacy, merchantability or fitness for any particular purpose of any Information disclosed.\n\n7.3 Nothing herein shall be deemed to constrain either Party from declining to disclose any specific information, nor shall this Agreement constitute an obligation or commitment on the part of either Party to conclude any further agreement, commercial relationship or business undertaking.\n\nEQUITABLE RELIEF\n\n8.1 The Parties acknowledge and agree that any breach or threatened breach of the obligations contained in this Agreement would cause irreparable harm, damage and injury to the Disclosing Party, for which pecuniary damages alone would not afford an adequate or sufficient remedy.\n\n8.2 In the event of any breach or threatened breach of this Agreement by the Receiving Party, the Disclosing Party shall be entitled, in addition to any other rights or remedies available to it at law or in equity, to seek and obtain injunctive relief, specific performance and any other form of equitable remedy from any court of competent jurisdiction without the necessity of proving actual damages or posting any bond, security or other undertaking.\n\nTERM AND DURATION OF OBLIGATIONS\n\n9.1 This Agreement shall commence on the date first written above and shall continue in force for an initial term of two (2) years, subject to the right of either Party to terminate this Agreement at any time upon thirty (30) days' prior written notice to the other Party.\n\n9.2 Notwithstanding the termination, expiration or cessation of this Agreement howsoever occasioned, the confidentiality and non-use covenants, restrictions and obligations set forth herein shall survive and continue to bind the Receiving Party for a period of three (3) years from the effective date of such termination or expiration, save that in respect of any Information which constitutes a trade secret, such obligations shall endure for so long as the relevant Information retains the character of a trade secret under Applicable Law rd Parties) Act 1999 or otherwise to enforce any term of this Agreement.\n\n10.7 This Agreement contains the entire agreement and understanding between the Parties with respect to the subject matter hereof and supersedes and extinguishes all prior agreements, draft agreements, arrangements, representations, warranties and understandings of whatsoever nature between them relating thereto.\n\n10.8 This Agreement may be executed in any number of counterparts, each of which shall be deemed an original, and all of which together shall constitute one and the same instrument. The transmission of an executed signature page by electronic means (including PDF or secure electronic signature) shall take effect as delivery of an original executed counterpart.\n\n10.9 Whereunto and notwithstanding any rule of law, custom or usage to the contrary, in witness whereof the Parties hereto have caused this Agreement to be duly executed by their respective authorised signatories on the day and year first hereinbefore written, whereupon it is expressly stipulated that no alteration, amendment, variation, modification or suppletion of this Agreement or of any of the terms, covenants or conditions herein contained shall be deemed valid, binding or effectual in law or in equity unless the same shall be formulated in writing and subscribed by the hands of the duly authorised officers or legal representatives of each of the Parties hereto.\n\n10.10 This Agreement and any dispute, controversy, proceedings or claim of whatever nature arising out of or in connection with it or its subject matter or formation (including non-contractual disputes or claims) shall be governed by and construed in accordance with the laws of England and Wales.\n\n10.11 Each Party irrevocably submits and agrees that the courts of England and Wales shall have exclusive jurisdiction to hear, settle and determine any suit, action, dispute or proceedings arising out of or in connection with this Agreement or its subject matter or formation (including non-contractual disputes or claims).\n\nIN WITNESS WHEREOF the Parties have caused this Agreement to be executed by their duly authorised representatives on the date first written above.\n\nSigned for and on behalf of\nBALLYBRICK SOFTWARE DISTRIBUTION LIMITED\nSignature: ______________________________\nName: ______________________________\nTitle: ______________________________\nDate: ______________________________\n\nSigned for and on behalf of\nHALYARD SOFTWARE LTD\nSignature: ______________________________\nName: ______________________________\nTitle: ______________________________\nDate: ______________________________\n", "C15": "MUTUAL NON-DISCLOSURE AGREEMENT\n\nTHIS AGREEMENT (the \"Agreement\") is made and entered into on this 14th day of October 2026 (the \"Effective Date\"), by and between:\n\n(1) VANDERBERG STRATEGIC SYSTEMS B.V., a private limited liability company (besloten vennootschap met beperkte aansprakelijkheid) organized and existing under the laws of the Netherlands, having its registered seat in Amsterdam, the Netherlands, and its principal place of business at Keizersgracht 482, 1016 EG Amsterdam, the Netherlands, registered with the Dutch Trade Register of the Chamber of Commerce (Kamer van Koophandel) under registration number 68492011 (\"Vanderberg\"); and\n\n(2) HALYARD SOFTWARE LTD, a private limited company incorporated and registered under the laws of England and Wales with company number 09876543, having its registered office at 12 Mill Lane, Manchester M1 2AB, United Kingdom (\"Halyard\").\n\nVanderberg and Halyard may hereinafter individually be referred to as a \"Party\" and collectively as the \"Parties\".\n\nPREAMBLE\n\nWHEREAS, the Parties are engaged in technical and strategic discussions exploring a prospective commercial collaboration, system integration, and consulting partnership in the software sector (the \"Authorized Purpose\"); and\n\nWHEREAS, in the context of discussions, evaluations, and negotiations regarding the Authorized Purpose, each Party may disclose to the other Party certain non-public, technical, commercial, financial, and proprietary information; and\n\nWHEREAS, the Parties desire to define the terms and conditions governing the exchange, safeguarding, permitted utilization, and non-disclosure of such information.\n\nNOW, THEREFORE, in consideration of the mutual covenants and premises contained herein and for other good and valuable consideration, the receipt and sufficiency of which are hereby acknowledged, the Parties agree as follows:\n\nDEFINITIONS AND CONSTRUCTION\n\n1.1 In this Agreement, unless the subject matter or context otherwise dictates, the following capitalized terms shall have the meanings set forth below:\n\n1.1.1 \"Affiliate\" means, with respect to any specified Person, any other Person that directly or indirectly Controls, is Controlled by, or is under common Control with such specified Person.\n\n1.1.2 \"Applicable Law\" means any statute, directive, decree, treaty, order, rule, statutory instrument, regulation, or determination issued by any governmental, judicial, or regulatory authority having jurisdiction over a Party.\n\n1.1.3 \"Authorized Purpose\" has the meaning ascribed to it in the Preamble.\n\n1.1.4 \"Business Day\" means any day other than a Saturday, a Sunday, or a statutory public holiday in London, England or Amsterdam, the Netherlands.\n\n1.1.5 \"Control\" means the direct or indirect ownership of more than fifty percent (50%) of the nominal value of the issued share capital, voting rights, or equity interests of an entity, or the possession, directly or indirectly, of the power to direct or cause the direction of the management and policies of an entity, whether through ownership of securities, by contract, or otherwise; and \"Controlled\" and \"Controlling\" shall be construed accordingly.\n\n1.1.6 \"Disclosing Party\" means the Party, or an Affiliate of such Party, that discloses, transmits, or makes closing Party under or pursuant to this Agreement.\n\n1.1.11 \"Representatives\" means, with respect to a Party, that Party's and its Affiliates' respective directors, managing directors (bestuurders), officers, employees, independent contractors, professional legal counsel, accountants, auditors, and financial advisors.\n\n1.2 In this Agreement, headings and clause titles are inserted for convenience of reference only and shall not affect the interpretation or construction of this Agreement. References to clauses are to clauses of this Agreement. The singular includes the plural and vice versa, and words importing any gender include all genders.\n\nCONFIDENTIALITY AND NON-DISCLOSURE OBLIGATIONS\n\n2.1 The Receiving Party shall treat and preserve as strictly confidential all Proprietary Materials of the Disclosing Party and shall not, without the prior written authorization of the Disclosing Party, disclose, disseminate, publish, or make available such Proprietary Materials, directly or indirectly, in whole or in part, to any Person other than its Representatives who strictly need to know such information for the implementation and progression of the Authorized Purpose.\n\n2.2 The Receiving Party shall exercise the same degree of care to avoid unauthorized disclosure, dissemination, or utilization of the Proprietary Materials as it employs with respect to its own confidential materials of a similar high sensitivity, but under no circumstances less than a reasonable standard of professional care.\n\n2.3 The Receiving Party shall not use, exploit, reproduce, adapt, or process the Proprietary Materials of the Disclosing Party for any purpose, commercial or non-commercial, other than strictly in furtherance of the Authorized Purpose.\n\n2.4 The Receiving Party shall ensure that each of its Representatives to whom Proprietary Materials are disclosed or made available is informed of the confidential and proprietary nature thereof and is bound by professional duties or written contractual undertakings of confidentiality at least as protective as the terms set forth in this Agreement. The Receiving Party shall remain fully responsible and liable for any breach of the terms of this Agreement caused by the act, error, or omission of any of its Representatives.\n\n2.5 The Receiving Party shall refrain from disassembling, decompiling, reverse engineering, decrypting, or otherwise attempting to discover or reconstruct the composition, logic, underlying concepts, or source code of any software, models, frameworks, algorithms, or prototypes furnished by the Disclosing Party that embody Proprietary Materials.\n\nEXCLUSIONS FROM CONFIDENTIALITY\n\n3.1 The obligations imposed on the Receiving Party under Clause 2 shall not apply to any information or materials that the Receiving Party can convincingly prove by contemporaneous written records:\n\n3.1.1 is already in the public domain at the time of its disclosure under this Agreement, or subsequently enters the public domain without violation of any provision of this Agreement or any other legal or contractual obligation of secrecy;\n\n3.1.2 was lawfully within the possession, custody, or control of the Receiving Party prior to its disclosure by or on behalf of the Disclosing Party, without an accompanying restriction as to confidentiality;\n\n3.1.3 was lawfully obtained by the Receiving Party from an independent third party having the unfettered legal entitlement to disclose such information without restriction; or\n\n3.1.4 was developed independently by personnel of the Receiving Party who had no access to, and without reference to or reliance upon, any Proprietary Materials of the Disclosing Party.\n\nMANDATORY AND COMPELLED DISCLOSURES\n\n4.1 If the Receiving Party or any of its Representatives is legally ordered, compelled, or requested pursuant to Applicable Law, valid judicial order, or the lawful order of a competent governmental, administrative, or supervisory agency to disclose any Proprietary Materials, the Receiving Party shall:\n\n4.1.1 immediately notify the Disclosing Party in writing of such legal requirement, to the extent legally permissible, so that the Disclosing Party may seek an appropriate protective order or other legal remedy;\n\n4.1.2 provide reasonable cooperation and assistance to the Disclosing Party, at the Disclosing Party's sole expense, in seeking such protective measures or limiting the scope of disclosure; and\n\n4.1.3 disclose, if such disclosure is ultimately required, only that precise portion of the Proprietary Materials that is legally required to be disclosed based on the written advice of its qualified legal counsel.\n\nINTELLECTUAL PROPERTY AND RIGHTS ALLOCATION\n\n5.1 Except as expressly provided herein, all Proprietary Materials, including all underlying data, documents, technical specifications, and all Intellectual Property Rights subsisting therein, remain the exclusive property of the Disclosing Party or its third-party licensors.\n\n5.2 No right, license, title, or interest in or to any Intellectual Property Rights of the Disclosing Party is granted, assigned, or transferred to the Receiving Party by implication, estoppel, or otherwise, except for the limited, non-exclusive, non-transferable, and revocable right to review and evaluate the Proprietary Materials solely for the Authorized Purpose.\n\n5.3 To the extent that the Receiving Party, in the course of evaluating the Proprietary Materials or participating in discussions concerning the Authorized Purpose, generates, suggests, develops, or contributes any modifications, adaptations, improvements, derivative works, or feedback relating to the Disclosing Party's software, technology, or Proprietary Materials, all Intellectual Property Rights in such modifications, adaptations, improvements, derivative works, and feedback shall vest exclusively in Vanderberg upon creation, and Halyard hereby assigns to Vanderberg, with full title guarantee, all such Intellectual Property Rights free from encumbrances.\n\nRETURN AND EXPUNGEMENT OF PROPRIETARY MATERIALS\n\n6.1 Upon the written demand of the Disclosing Party, or upon the termination or expiry of this Agreement, the Receiving Party shall immediately cease all use of the Disclosing Party's Proprietary Materials.\n\n6.2 Within forty-eight (48) hours of receipt of a written notice from the Disclosing Party requesting the return or destruction of Proprietary Materials, the Receiving Party shall deliver to the Disclosing Party, or permanently destroy, delete, and expunge from all computers, servers, storage media, and electronic repositories, all documents, tangible records, electronic files, copies, reproductions, extracts, and summaries containing or reflecting any Proprietary Materials, without exception, and an authorized officer of the Receiving Party shall promptly confirm compliance in writing to the Disclosing Party.\n\nANNOUNCEMENTS AND PUBLICITY\n\n7.1 Except as otherwise required by Applicable Law or regulatory mandate, neither Party shall issue any formal press release or public statement concerning this Agreement or the commercial discussions between the Parties without the prior written approval of the other Party.\n\n7.2 Notwithstanding Clause 7.1, Vanderberg shall be entitled to reference Halyard by name, trade name, and company logo in Vanderberg's client lists, marketing collaterals, commercial pitch decks, and website disclosures to indicate that the Parties are engaged in technology evaluations and commercial discussions.\n\nTERM AND TERMINATION\n\n8.1 This Agreement shall take effect on the Effective Date and shall remain in full force and effect for an initial term of two (2) years, unless terminated earlier by either Party upon thirty (30) calendar days' written notice to the other Party.\n\n8.2 The obligations of confidentiality, non-use, and restricted disclosure set forth in this Agreement shall survive the termination or expiration of this Agreement f this Agreement is held to be invalid, void, unlawful, or unenforceable by any competent court or tribunal, such determination shall not affect the validity or enforceability of the remaining provisions, and the Parties shall negotiate in good faith to replace such invalid provision with a lawful provision that achieves as closely as possible the initial commercial and legal intent of the Parties.\n\n10.5 Notices. Any notice, request, demand, or other formal communication required or permitted under this Agreement shall be in writing and delivered personally, sent by registered pre-paid mail, or sent by recorded courier to the addresses set out on the initial page hereof, or sent via electronic mail to the designated corporate representatives of each Party.\n\n10.6 Third Party Rights. Unless explicitly stated otherwise, a Person who is not a party to this Agreement shall have no rights under the Contracts (Rights of Third Parties) Act 1999 to enforce any term of this Agreement.\n\n10.7 Counterparts. This Agreement may be executed in any number of counterparts, each of which shall be deemed an original, but all of which together shall constitute one and the same instrument. Transmission of executed counterpart signature pages by electronic mail (including PDF format or via an established electronic signature solution) shall be deemed effective delivery for all purposes.\n\n10.8 Governing Law and Jurisdiction. This Agreement, and any dispute, controversy, or claim (including non-contractual disputes or claims) arising out of or in connection with it, its subject matter, or its formation, shall be governed by, and construed in accordance with, the laws of England and Wales. Each Party irrevocably submits to the exclusive jurisdiction of the courts of England and Wales to resolve and determine any dispute, claim, suit, or proceeding arising under or in connection with this Agreement.\n\nIN WITNESS WHEREOF, the Parties hereto have caused this Mutual Non-Disclosure Agreement to be executed by their respective duly authorized officers or representatives as of the Effective Date.\n\nSigned for and on behalf of\nVANDERBERG STRATEGIC SYSTEMS B.V.\nSignature: ______________________________\nName: Pieter van der Berg\nTitle: Managing Director (Statutair Directeur)\nDate: 14 October 2026\n\nSigned for and on behalf of\nHALYARD SOFTWARE LTD\nSignature: ______________________________\nName: ______________________________\nTitle: ______________________________\nDate: ______________________________\n", "C16": "MUTUAL NONDISCLOSURE AGREEMENT\n\nTHIS MUTUAL NONDISCLOSURE AGREEMENT (the Agreement) is entered into as of 14 October 2026 (the Effective Date) by and between:\n\n(1) MERIDIAN FIRST HORIZON BANCORP, N.A., a national banking association organised under the laws of the United States, acting through its London branch at 25 Bank Street, London E14 5JP (the Bank); and\n\n(2) HALYARD SOFTWARE LTD, a company registered in England and Wales under company number 09876543, whose registered office is at 12 Mill Lane, Manchester M1 2AB (Halyard).\n\nThe Bank and Halyard may hereinafter be referred to individually as a Party and collectively as the Parties.\n\nRECITALS\n\nWHEREAS, each Party possesses certain non-public, proprietary, and sensitive information relating to its technological architecture, financial systems, software solutions, and operational infrastructure; and\n\nWHEREAS, the Parties desire to engage in strategic discussions, technology reviews, and commercial deliberations to evaluate and explore potential collaborative business arrangements, enterprise software procurement, and technology integration opportunities between them, as well as to facilitate any broader commercial, financial, operational, or strategic interactions, evaluations, or prospective engagements between the Parties and their respective Group companies as may arise from time to time (the Authorised Purpose); and\n\nWHEREAS, in furtherance of the Authorised Purpose, each Party may disclose to the other Party certain confidential, technical, commercial, and financial information under terms ensuring strict confidentiality.\n\nNOW, THEREFORE, in consideration of the mutual covenants contained herein and other good and valuable consideration, the receipt and sufficiency of which are hereby acknowledged, the Parties agree as follows:\n\nDefinitions and Construction\n\n1.1 As used in this Agreement, the following capitalised terms shall have the meanings set forth below:\n\n1.1.1 Affiliate means, with respect to any entity, any other entity directly or indirectly controlling, controlled by, or under common control with such entity, where control means the possession, direct or indirect, of the power to direct or cause the direction of the management and policies of an entity, whether through the ownership of voting securities, by contract, or otherwise.\n\n1.1.2 Agreement means this Mutual Nondisclosure Agreement, as may be amended, supplemented, or modified in writing from time to time by the Parties.\n\n1.1.3 Applicable Law means any domestic or foreign statute, law, treaty, rule, regulation, order, decree, directive, code, guidance, judgment, injunction, or determination of an arbitrator or a court or other Governmental Authority, including without limitation statutory regulations governing banking, data privacy, and financial services prudential standards.\n\n1.1.4 Authorised Purpose has the meaning ascribed to it in the Recitals to this Agreement.\n\n1.1.5 Confidential Information means any and all non-public information, data, or materials disclosed, furnished, or made accessible by or on behalf of the Disclosing Party to the Receiving Party or its Representatives, whether before, on, or after the Effective Date, in oral, visual, written, electronic, magnetic, optical, or any other tangible or intangible form, that is designated as confidential or proprietary at the time of disclosure, or that reasonably should be understood to be confidential or proprietary given the nature of the information or the circumstances surrounding disclosure. Confidential Information includes, without limitation: (a) trade secrets, software code, source code, object code, system architectures, application programming interfaces, databases, product roadmaps, algorithms, methodologies, data models, workflows, schematics, and technical designs; (b) business plans, financial projections, customer data, pricing strategies, vendor lists, audits, compliance reports, risk assessments, and marketing plans; and (c) any Work Product, analyses, summaries, forecasts, notes, memoranda, compilations, or derivative works prepared by or on behalf of the Receiving Party or its Representatives to the extent containing, reflecting, or derived from such information.\n\n1.1.6 Disclosing Party means the Party disclosing, transmitting, or otherwise making available Confidential Information, either directly or indirectly through its Representatives or Affiliates.\n\n1.1.7 Governmental Authority means any court, tribunal, arbitrator, authority, agency, commission, official, or other instrumentality of any national, federal, state, regional, local, or regulatory government or self-regulatory body, including without limitation the UK Prudential Regulation Authority, the UK Financial Conduct Authority, the Board of Governors of the Federal Reserve System, and the Office of the Comptroller of the Currency.\n\n1.1.8 Receiving Party means the Party receiving or obtaining access to Confidential Information disclosed by or on behalf of the Disclosing Party.\n\n1.1.9 Representatives means, with respect to a Party, such Party's and its Affiliates' directors, officers, employees, seconded personnel, agents, professional legal advisers, independent public accountants, financial advisers, consultants, and permitted subcontractors.\n\n1.1.10 Work Product means any concepts, enhancements, modifications, developments, discoveries, designs, software interfaces, documentation, feedback, or derivative works created, conceived, reduced to practice, or developed by either Party, solely or jointly with the other Party, arising out of, in connection with, or as a consequence of the disclosure, evaluation, testing, or review of the Disclosing Party's Confidential Information.\n\n1.2 In this Agreement:\n\n1.2.1 headings are inserted for convenience of reference only and shall not affect the interpretation or construction of this Agreement;\n\n1.2.2 words importing the singular include the plural and vice versa;\n\n1.2.3 references to Clauses and Recitals are to clauses and recitals of this Agreement; and\n\n1.2.4 the terms including, includes, and in particular shall be construed as illustrative and without limitation to the generality of the preceding words.\n\nConfidentiality Obligations and Restrictive Covenants\n\n2.1 The Receiving Party agrees that it shall hold in strict confidence, and shall exercise all reasonable care and precautions to protect, all Confidential Information of the Disclosing Party. The standard of care applied by the Receiving Party shall be no less than the degree of care that it exercises with respect to its own confidential and proprietary information of like nature and importance, and in no event less than a high and commercially reasonable standard of care.\n\n2.2 The Receiving Party shall not, without the prior express written consent of the Disclosing Party, disclose, divulge, publish, disseminate, or transfer any Confidential Information of the Disclosing Party to any third party, in whole or in part, except as expressly permitted under Clause 4.\n\n2.3 The Receiving Party shall use the Confidential Information of the Disclosing Party solely and exclusively for the Authorised Purpose, and shall not exploit, commercialise, or use any portion of the Disclosing Party's Confidential Information for any other purpose, benefit, or account whatsoever.\n\n2.4 The Receiving Party shall not copy, duplicate, record, or reproduce the Disclosing Party's Confidential Information, except to the extent strictly necessary to accomplish the Authorised Purpose, and all copies, extracts, and summaries thereof shall remain the property of the Disclosing Party and bear all confidentiality notices, legends, and proprietary markings contained on the original materials.\n\n2.5 The Receiving Party shall not decompile, disassemble, reverse engineer, translate, or otherwise attempt to derive the composition, structure, protocols, or source code of any software, system, model, or hardware provided or made accessible by the Disclosing Party under this Agreement, except to the extent that such restriction is prohibited by non-waivable statutory law.\n\n2.6 The Receiving Party shall implement and maintain robust administrative, physical, technical, and organisational security safeguards sufficient to prevent unauthorised access, acquisition, alteration, loss, corruption, or disclosure of the Disclosing Party's Confidential Information.\n\n2.7 The Receiving Party shall notify the Disclosing Party in writing immediately, and in any event within twenty-four (24) hours, upon discovering or suspecting any unauthorised use, exposure, theft, copying, or disclosure of the Disclosing Party's Confidential Information, and shall cooperate fully and promptly with the Disclosing Party, at the Receiving Party's sole expense, to remediate such event, regain possession, and mitigate any adverse consequences resulting therefrom.\n\nExclusions from Confidentiality\n\n3.1 The obligations imposed on the Receiving Party under Clause 2 shall not apply to any portion of information which the Receiving Party can prove by contemporaneous written documentation:\n\n3.1.1 was already in the lawful possession of the Receiving Party prior to disclosure by or on behalf of the Disclosing Party, without obligation of confidentiality;\n\n3.1.2 is or becomes publicly available through no breach of this Agreement, fault, act, or omission of the Receiving Party or its Representatives;\n\n3.1.3 is rightfully received by the Receiving Party on a non-confidential basis from an independent third party having the lawful right to make such disclosure without breaching any legal, contractual, or fiduciary obligation; or\n\n3.1.4 has been independently developed by employees or agents of the Receiving Party without reference to, reliance upon, incorporation of, or access to any of the Disclosing Party's Confidential Information.\n\nPermitted Disclosures\n\n4.1 The Receiving Party may disclose Confidential Information of the Disclosing Party only to those of its Representatives and Affiliates who have a demonstrable need to know such information directly in connection with the Authorised Purpose, provided that:\n\n4.1.1 each such Representative or Affiliate has been informed of the confidential and proprietary nature of the Confidential Information;\n\n4.1.2 each such Representative or Affiliate is bound by written confidentiality agreements or professional ethical rules providing protections at least as restrictive as those contained in this Agreement; and\n\n4.1.3 the Receiving Party remains fully and unconditionally responsible and liable for any breach of this Agreement caused by the acts, omissions, or conduct of any such Representative or Affiliate, as if such acts or omissions were committed directly by the Receiving Party.\n\nCompelled Disclosures and Regulatory Inquiries\n\n5.1 If the Receiving Party or any of its Representatives becomes legally compelled by subpoena, court order, civil investigative demand, or Applicable Law to disclose any Confidential Information of the Disclosing Party, the Receiving Party shall, to the extent legally permissible:\n\n5.1.1 give prompt written notice thereof to the Disclosing Party as soon as practicable prior to disclosure, to enable the Disclosing Party to seek an appropriate protective order, injunctive relief, or other protective remedy;\n\n5.1.2 consult with the Disclosing Party regarding lawful measures to resist, limit, or narrow such requested disclosure; and\n\n5.1.3 disclose only that portion of Confidential Information that its legal counsel advises is strictly required to be disclosed, and use all reasonable efforts to obtain reliable assurance that confidential treatment will be accorded to the Confidential Information so disclosed.\n\n5.2 Notwithstanding anything to the contrary in this Agreement, either Party may disclose Confidential Information without prior notice to the other Party in response to routine supervisory examinations or requests for information conducted by any banking, financial services, or prudential regulatory authority exercising lawful supervisory or examiner jurisdiction over such Party, provided that such inquiry is not specifically targeted at the other Party or the transactions contemplated herein.\n\nReturn and Destruction Obligations\n\n6.1 Upon the written demand of the Disclosing Party at any time, or automatically upon the termination or expiration of this Agreement:\n\n6.1.1 the Receiving Party shall, within three (3) calendar days following receipt of such notice, immediately return to the Disclosing Party or completely destroy, shred, and permanently overwrite all documents, data, records, memoranda, notes, media, software, files, and other tangible or intangible representations embodying the Disclosing Party's Confidential Information, including all originals, copies, abstracts, excerpts, and derivative summaries thereof, without retaining any copies or extracts whatsoever, whether in hard copy, digital, magnetic, or electronic format; and\n\n6.1.2 a senior corporate officer of the Receiving Party shall, within three (3) calendar days following such demand, certify in writing under oath to the Disclosing Party that all such materials have been returned or irrevocably destroyed, purged, and uninstalled across all systems, workstations, servers, mobile devices, and physical locations in compliance with this Clause 6.1.\n\nProprietary Rights and Work Product\n\n7.1 All Confidential Information disclosed under this Agreement, and all pre-existing patents, copyrights, trade secrets, trademarks, service marks, database rights, and other intellectual property rights subsisting therein, shall remain the sole and exclusive property of the Disclosing Party. Nothing in this Agreement shall be deemed to grant or imply any transfer of title, assignment, right, or licence under any intellectual property rights of the Disclosing Party, save for the limited, non-exclusive, non-transferable, revocable permission to review the Confidential Information solely for the Authorised Purpose.\n\n7.2 In the event that the Receiving Party or any of its Representatives suggests, conceives, creates, designs, makes, or contributes to any Work Product, feedback, improvement, architectural modification, algorithm, or derivative work relating to or based upon the Disclosing Party's systems, interfaces, software, or Confidential Information during the course of the Authorised Purpose, the Receiving Party hereby irrevocably assigns to the Disclosing Party, with full title guarantee, all right, title, and interest throughout the world in and to such Work Product and all intellectual property rights therein, free from any encumbrances. To the extent any such rights cannot be assigned by law, the Receiving Party hereby grants to the Disclosing Party an exclusive, perpetual, irrevocable, fully paid-up, royalty-free, worldwide licence, with full right to sublicense, to use, modify, exploit, commercialise, and display such Work Product without accounting to the Receiving Party.\n\nNo Warranty and Disclaimer\n\n8.1 All Confidential Information is furnished by each Disclosing Party strictly on an as is and where is basis, without any warranty, express, implied, statutory, or otherwise. Neither Party makes any representation or warranty as to the accuracy, completeness, viability, performance, non-infringement, or fitness for any particular purpose of any Confidential Information disclosed under this Agreement.\n\n8.2 Neither Party nor its Representatives shall have any liability or responsibility to the other Party or any other person resulting from any use of, evaluation of, or reliance upon the Disclosing Party's Confidential Information, except as expressly provided in this Agreement or in any definitive written agreement subsequently entered into by the Parties.\n\n8.3 Nothing in this Agreement shall be construed as creating an obligation on either Party to disclose any specific information, to negotiate, or to enter into any agreement, transaction, procurement contract, or business relationship with the other Party.\n\nTerm and Survival\n\n9.1 This Agreement shall take effect on the Effective Date and shall remain in effect for a period of two (2) years from the Effective Date, unless terminated earlier by either Party upon thirty (30) days' prior written notice to the other Party.\n\n9.2 Each Party's obligations under Clause 2, Clause 4, Clause 6, and Clause 7 in respect of Confidential Information disclosed prior to termination or expiration shall survive any termination or expiration of this Agreement for a period of three (3) years from the effective date of such termination or expiration; provided, however, that with respect to any Confidential Information that constitutes a trade secret under applicable statutory law or common law, the Receiving Party's obligations of confidentiality and non-use shall survive and continue indefinitely for as long as such information remains a trade secret.\n\nEquitable Remedies\n\n10.1 Each Party acknowledges and agrees that the Confidential Information possesses a unique, competitively sensitive, and commercially vital character, and that any breach or threatened breach of this Agreement by the Receiving Party may result in irreparable and continuing injury to the Disclosing Party for which monetary damages alone would be inadequate or difficult to quantify.\n\n10.2 In the event of any actual or threatened breach of this Agreement, the Disclosing Party shall be entitled, in addition to all other legal and equitable remedies available to it, to seek and obtain injunctive relief, specific performance, and other interim and permanent equitable remedies from any court of competent jurisdiction, without the necessity of posting any bond, cash undertaking, or other security, and without proving special damages.\n\nGeneral Boilerplate Provisions\n\n11.1 Entire Agreement. This Agreement constitutes the entire agreement and understanding between the Parties concerning the subject matter hereof, and supersedes and extinguishes all prior oral or written agreements, negotiations, draft agreements, understandings, representations, and warranties between the Parties relating to such subject matter.\n\n11.2 Amendments. No modification, variation, waiver, or amendment of any provision of this Agreement shall be valid, binding, or enforceable unless made in writing and duly executed by authorised representatives of both Parties.\n\n11.3 Severability. If any provision of this Agreement, or any portion thereof, is held to be invalid, illegal, or unenforceable by any court or tribunal of competent jurisdiction, such invalidity, illegality, or unenforceability shall not affect the validity, legality, or enforceability of any other provision of this Agreement, which shall remain in full force and effect. The invalid or unenforceable provision shall be deemed modified to the minimum extent necessary to make it valid, legal, and enforceable while giving effect to the original commercial intent.\n\n11.4 Assignment. Neither Party may assign, novate, delegate, transfer, or charge this Agreement, or any of its rights, benefits, or duties hereunder, without the prior written consent of the other Party; provided, however, that the Bank may assign this Agreement or any rights or obligations hereunder, in whole or in part, without the consent of Halyard, to any Affiliate or to any successor entity resulting from a merger, consolidation, acquisition, corporate restructuring, or the sale of all or substantially all of its assets.\n\n11.5 No Waiver. No failure or delay by either Party in exercising any right, power, or privilege under this Agreement shall operate as a waiver thereof, nor shall any single or partial exercise thereof preclude any other or further exercise of any right, power, or privilege under this Agreement.\n\n11.6 No Partnership or Agency. Nothing contained in this Agreement, nor any disclosure or course of dealing hereunder, shall be construed to create an agency, joint venture, partnership, or employment relationship between the Parties, or to authorise either Party to bind or act on behalf of the other Party in any manner.\n\n11.7 Third Party Rights. Except as expressly provided herein with respect to Affiliates of the Bank, a person who is not a party to this Agreement shall have no rights under the Contracts (Rights of Third Parties) Act 1999 to enforce any term of this Agreement.\n\n11.8 Notices. Any notice, request, consent, approval, or other communication required or permitted under this Agreement shall be in writing and delivered by hand, by reputable pre-paid overnight courier service, or by email with delivery confirmation to the address of the relevant Party set out at the beginning of this Agreement. Notices shall be deemed delivered: (a) upon actual receipt if delivered by hand; (b) two (2) Business Days following deposit with an international overnight courier service; or (c) on the date of transmission if sent by email during regular business hours on a Business Day, with no notification of delivery failure received.\n\n11.9 Counterparts and Electronic Execution. This Agreement may be executed in any number of counterparts, each of which shall be deemed an original, but all of which together shall constitute one and the same instrument. Execution and transmission of this Agreement by exchange of electronic signatures (including DocuSign or Adobe Sign) or signed PDF files via email shall have the same legal force and binding effect as physical execution and delivery of paper originals.\n\n11.10 Governing Law and Dispute Resolution. This Agreement and any dispute, controversy, proceedings, or claim of whatever nature (including non-contractual disputes or claims) arising out of or in connection with it or its subject matter or formation shall be governed by and construed in accordance with the laws of England and Wales. Each Party irrevocably submits to the exclusive jurisdiction of the courts of England and Wales to resolve any dispute, controversy, or claim arising under, out of, or in connection with this Agreement.\n\nIN WITNESS WHEREOF, the Parties have caused this Mutual Nondisclosure Agreement to be executed by their duly authorised officers as of the Effective Date.\n\nMERIDIAN FIRST HORIZON BANCORP, N.A.\n(acting through its London branch)\nBy: ______________________________\nName: Arthur Pendelton\nTitle: Managing Director, Global Technology Sourcing\nDate: ______________________________\n\nHALYARD SOFTWARE LTD\nBy: ______________________________\nName: ______________________________\nTitle: ______________________________\nDate: ______________________________\n", "C17": "MUTUAL NON-DISCLOSURE AGREEMENT\n\nTHIS MUTUAL NON-DISCLOSURE AGREEMENT (the Agreement) is entered into as of 14 October 2026 (the Effective Date),\n\nBY AND BETWEEN:\n\n(1) VEDANTA TECHSOLUTIONS PRIVATE LIMITED, a company incorporated under the laws of India with corporate identification number U72200KA2015PTC081234, having its registered office at Cyber Park, Tower B, 4th Floor, Electronic City Phase 1, Hosur Road, Bengaluru 560100, Karnataka, India (Vedanta); and\n\n(2) HALYARD SOFTWARE LTD, a company incorporated and registered in England and Wales with company number
