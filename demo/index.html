 any of its rights or obligations under this Agreement without the prior written consent of the other Party.\n\n9.4 Severability. If any provision of this Agreement is held to be invalid, illegal or unenforceable, the validity, legality and enforceability of the remaining provisions shall not in any way be affected or impaired.\n\n9.5 Counterparts. This Agreement may be executed in any number of counterparts, each of which shall be deemed an original, and all of which taken together shall constitute one and the same instrument. Delivery of an executed counterpart via electronic signature or digital transmission shall be deemed legally binding.\n\n9.6 Governing Law and Jurisdiction. This Agreement and any dispute or claim arising out of or in connection with it or its subject matter or formation (including non-contractual disputes or claims) shall be governed by and construed in accordance with the laws of England and Wales. Each Party irrevocably submits to the exclusive jurisdiction of the courts of England and Wales to resolve any dispute or claim arising under or in connection with this Agreement.\n\nIN WITNESS WHEREOF the Parties have executed this Agreement on the date first written above.\n\nSigned for and on behalf of VANTIS ANALYTICS LIMITED:\n\nSignature: ______________________________\nName: ______________________________\nTitle: ______________________________\nDate: ______________________________\n\nSigned for and on behalf of HALYARD SOFTWARE LTD:\n\nSignature: ______________________________\nName: ______________________________\nTitle: ______________________________\nDate: ______________________________\n", "C30": "MUTUAL NON-DISCLOSURE AGREEMENT\n\nThis Mutual Non-Disclosure Agreement (the \"Agreement\") is dated 28 October 2026 and made between:\n\n(1) NORDIC LOGIX OY, a company incorporated in Finland under business identity code 2468101-9, whose registered office is at Keilaranta 19, 02150 Espoo, Finland (\"Nordic Logix\"); and\n\n(2) HALYARD SOFTWARE LTD, a company incorporated in England and Wales with company number 09876543, whose registered office is at 12 Mill Lane, Manchester M1 2AB, United Kingdom (\"Halyard\").\n\nNordic Logix and Halyard are each referred to individually as a \"Party\" and collectively as the \"Parties\".\n\nBACKGROUND\n\nThe Parties wish to explore and evaluate a prospective commercial transaction involving logistics automation software and enterprise platform integration (the \"Permitted Purpose\"). In the course of such exploration, each Party may disclose to the other Party certain proprietary and confidential information. The Parties agree to safeguard such information pursuant to the terms and conditions set forth below.\n\nOPERATIVE PROVISIONS\n\nDefinitions\n\n1.1 In this Agreement, the following capitalised terms shall have the following meanings:\n\n1.1.1 \"Affiliate\" means, in respect of any entity, any other entity that directly or indirectly Controls, is Controlled by, or is under common Control with that entity.\n\n1.1.2 \"Control\" means the direct or indirect ownership of more than 50% of the voting capital or the legal power to direct or cause the direction of the management and policies of an entity, whether through voting securities, by contract, or otherwise.\n\n1.1.3 \"Disclosing Party\" means the Party that directly or indirectly discloses or makes available Proprietary Information under this Agreement.\n\n1.1.4 \"Proprietary Information\" means any and all technical, operational, commercial, financial, or strategic information, data, know-how, software architectures, APIs, specifications, designs, pricing models, product development plans, and customer information disclosed by or on behalf of the Disclosing Party to the Receiving Party, whether communicated orally, visually, in electronic format, in writing, or by delivery of sample code, materials, or equipment, which is designated as proprietary or confidential, or which reasonably ought to be understood as confidential given its nature and the circumstances of disclosure. Proprietary Information also includes all notes, summaries, analyses, compilations, extracts, or derivative works created by or for the Receiving Party containing or reflecting such information.\n\n1.1.5 \"Receiving Party\" means the Party that receives or obtains Proprietary Information from or on behalf of the Disclosing Party.\n\n1.1.6 \"Representatives\" means the directors, officers, employees, individual contractors, and professional legal or financial advisers of a Party or its Affiliates who reasonably require access to Proprietary Information for the Permitted Purpose.\n\nScope and Standard of Protection\n\n2.1 In consideration of the mutual disclosure of Proprietary Information, each Party, in its capacity as a Receiving Party, agrees and undertakes that it shall:\n\n2.1.1 hold and maintain all Proprietary Information of the Disclosing Party in strict confidence using the same degree of care it employs to protect its own confidential information of like sensitivity, but in no event less than a reasonable and prudent standard of professional care;\n\n2.1.2 use the Proprietary Information solely and strictly for the evaluation and execution of the Permitted Purpose and for no other commercial, developmental, or competitive purpose;\n\n2.1.3 restrict distribution of and access to Proprietary Information exclusively to those of its Representatives who have a genuine need to know such information for the Permitted Purpose, provided that each such Representative is bound by non-disclosure undertakings at least as protective as those contained in this Agreement; and\n\n2.1.4 not copy, reproduce, reverse engineer, decompile, or disassemble any software, components, systems, or materials provided by the Disclosing Party, except to the extent strictly necessary to further the Permitted Purpose or as expressly permitted by mandatory statutory provisions.\n\n2.2 The Receiving Party shall be fully responsible and liable for any breach of this Agreement caused by the act, failure, or omission of any of its Representatives as if such act, failure, or omission were committed directly by the Receiving Party.\n\nExclusions from Confidential Treatment\n\n3.1 The confidentiality obligations set forth in Clause 2 shall not apply to any specific portion of Proprietary Information that the Receiving Party can prove by contemporaneous written evidence:\n\n3.1.1 is already in or subsequently enters the public domain without any breach of this Agreement by the Receiving Party or its Representatives;\n\n3.1.2 was already lawfully known to the Receiving Party prior to disclosure by the Disclosing Party, without an existing duty of confidentiality;\n\n3.1.3 is independently developed by employees or contractors of the Receiving Party without reference to, access to, or reliance upon the Disclosing Party's Proprietary Information; or\n\n3.1.4 is lawfully acquired by the Receiving Party on a non-confidential basis from an independent third party who has the lawful right to make such disclosure without breaching any legal or contractual duty.\n\nCompelled Regulatory and Judicial Disclosures\n\n4.1 If the Receiving Party or any of its Representatives becomes legally compelled by mandatory statutory requirement, court order, or the lawful direction of an applicable regulatory body to disclose any Proprietary Information, the Receiving Party shall:\n\n4.1.1 provide the Disclosing Party with prompt written notice thereof, to the extent legally permissible, so that the Disclosing Party may seek a protective order or other appropriate remedy;\n\n4.1.2 cooperate reasonably with the Disclosing Party, at the Disclosing Party's expense, in seeking such protective measures; and\n\n4.1.3 if disclosure remains strictly required, disclose only that specific portion of Proprietary Information that is legally mandated, and use reasonable efforts to secure confidential treatment for the information so disclosed.\n\nIntellectual Property and Derivative Developments\n\n5.1 All Proprietary Information, including all worldwide patents, copyrights, trade secrets, trademarks, and other intellectual property rights subsisting therein, remains the exclusive property of the Disclosing Party or its respective licensors.\n\n5.2 Except for the limited, non-transferable, and revocable right to evaluate Proprietary Information for the Permitted Purpose during the term of this Agreement, nothing contained herein shall be construed as granting, either explicitly or by implication, estoppel, or otherwise, any licence, title, or right under any intellectual property of the Disclosing Party.\n\n5.3 To the extent that the Receiving Party, its Affiliates, or any of their Representatives conceives, creates, implements, or contributes to any modifications, improvements, derivative works, inventions, feedback, or related software configurations based upon, derived from, or referencing the Proprietary Information of the Disclosing Party, all worldwide intellectual property rights and other proprietary rights in and to such modifications, improvements, derivative works, inventions, feedback, and configurations shall vest immediately upon creation in, and are hereby assigned to, the Disclosing Party with full title guarantee.\n\nReturn and Retention of Materials\n\n6.1 Upon the written demand of the Disclosing Party or upon the termination of discussions relating to the Permitted Purpose, the Receiving Party shall, within fourteen (14) calendar days:\n\n6.1.1 return to the Disclosing Party or securely destroy all tangible records, documents, storage media, and materials containing Proprietary Information, together with all copies thereof; and\n\n6.1.2 provide written confirmation executed by an authorised corporate officer certifying compliance with the requirements of this Clause 6.1.\n\n6.2 Notwithstanding Clause 6.1, the Receiving Party may retain:\n\n6.2.1 one secure archival copy of Proprietary Information solely for the purpose of demonstrating compliance with applicable legal, regulatory, or corporate governance obligations; and\n\n6.2.2 copies of Proprietary Information created pursuant to routine, automated, and secure electronic data backup and archival procedures, provided such systems are not readily accessible in day-to-day operations.\n\n6.3 Any information retained pursuant to Clause 6.2 shall remain strictly subject to the confidentiality and non-use provisions of this Agreement.\n\nTerm and Duration of Obligations\n\n7.1 This Agreement shall take effect on the date first written above and shall continue in force for a period of twelve (12) months, unless terminated earlier by either Party upon giving thirty (30) days' prior written notice to the other Party.\n\n7.2 Notwithstanding the expiration or earlier termination of this Agreement for any reason, all obligations of confidentiality, non-disclosure, and restricted use under this Agreement shall survive termination and continue in perpetuity with respect to all Proprietary Information disclosed under this Agreement, and each Party shall remain bound by such obligations indefinitely.\n\nLiability and Agreed Remedy\n\n8.1 The Parties recognise and agree that any unauthorised use, dissemination, or disclosure of Proprietary Information would cause substantial, immediate, and irreparable injury to the Disclosing Party for which financial damages alone would not provide an adequate remedy. Consequently, the Disclosing Party shall be entitled to seek injunctive relief, specific performance, and other available equitable remedies from any court of competent jurisdiction without the necessity of proving actual damages or posting any bond.\n\n8.2 Without prejudice to any other rights or remedies available to the Disclosing Party under this Agreement or at law, in the event that a Receiving Party commits any breach of its confidentiality or non-use obligations under Clause 2, the Receiving Party shall pay to the Disclosing Party, within fourteen (14) days of written notice of such breach, an agreed liquidated sum of £100,000 for each such breach, which the Parties acknowledge and agree represents a genuine pre-estimate of loss and administrative disruption resulting from compromised confidentiality.\n\nMiscellaneous Provisions\n\n9.1 No Warranty. All Proprietary Information is provided on an \"as is\" and \"with all faults\" basis. The Disclosing Party makes no express or implied representations or warranties regarding the completeness, accuracy, efficacy, or suitability of any Proprietary Information disclosed hereunder.\n\n9.2 Non-Exclusivity. This Agreement creates no obligation upon either Party to disclose any specific information, to proceed with any prospective commercial transaction, or to refrain from entering into similar discussions or agreements with third parties, provided such activities do not breach the terms of this Agreement.\n\n9.3 Notices. All notices and communications under this Agreement must be in writing in the English language and delivered by hand, recorded postal delivery, or email to the registered address or designated corporate email address of the relevant Party. Notices delivered by recorded delivery shall be deemed delivered three (3) business days following dispatch, and notices sent by email shall be deemed delivered upon transmission, provided that no automated delivery failure message is received.\n\n9.4 Assignment. Neither Party may assign, transfer, charge, subcontract, or novate any of its rights or duties under this Agreement without the prior written consent of the other Party, except that Nordic Logix may assign this Agreement to an Affiliate or in connection with a corporate restructuring, merger, or sale of substantially all its business assets upon prior written notification.\n\n9.5 Severability. If any provision or part thereof in this Agreement is held by any competent authority to be invalid, unlawful, or unenforceable, such provision shall be severed from the remainder of the Agreement, which shall continue to be valid and enforceable to the fullest extent permitted by law.\n\n9.6 Entire Agreement and Amendments. This Agreement constitutes the complete and exclusive agreement between the Parties regarding the protection of Proprietary Information for the Permitted Purpose and supersedes all prior or contemporaneous negotiations, understandings, and drafts. No variation of this Agreement shall be binding unless made in writing and executed by duly authorised representatives of both Parties.\n\n9.7 Third-Party Rights. Except as expressly provided for Affiliates under this Agreement, a person who is not a party to this Agreement shall have no rights under the Contracts (Rights of Third Parties) Act 1999 or otherwise to enforce any term of this Agreement.\n\n9.8 Counterparts. This Agreement may be executed in any number of counterparts, each of which shall be deemed an original, and all of which together shall constitute one and the same legal instrument. Transmission of signed counterparts via digital signature services or PDF format by email shall be valid and effective.\n\n9.9 Governing Law and Jurisdiction. This Agreement and any dispute, controversy, or claim arising out of or in connection with it, including any non-contractual disputes or claims, shall be governed by and construed in accordance with the laws of England and Wales. The Parties irrevocably agree that the courts of England and Wales shall have exclusive jurisdiction to settle any dispute or claim arising out of or relating to this Agreement.\n\nIN WITNESS WHEREOF, the Parties have executed this Mutual Non-Disclosure Agreement as of the date first above written.\n\nSigned for and on behalf of NORDIC LOGIX OY\nSignature: ______________________________\nName: Matti Lindqvist\nTitle: Chief Technology Officer\nDate: ______________________________\n\nSigned for and on behalf of HALYARD SOFTWARE LTD\n const _json = (body, status=200) => new Response(JSON.stringify(body), {status, headers:{"content-type":"application/json"}});
window.fetch = async (url, opts={}) => {
  const path = String(url).split("?")[0];
  if (path === "/api/status") return _json(DEMO.status);
  if (path === "/api/samples") return _json(DEMO.samples);
  const m = path.match(/^\/api\/contract\/(C\d\d)$/);
  if (m) return DEMO.contracts[m[1]] ? _json({id:m[1], text:DEMO.contracts[m[1]]}) : _json({error:"not found"}, 404);
  if (path === "/api/review") {
    const id = JSON.parse(opts.body || "{}").id;
    return DEMO.results[id] ? _json(DEMO.results[id]) : _json({error:"No saved review for this contract."}, 404);
  }
  if (path === "/api/decision") {
    try {
      const log = JSON.parse(localStorage.getItem("nda-demo-decisions") || "[]");
      log.push({ts:new Date().toISOString(), ...JSON.parse(opts.body || "{}")});
      localStorage.setItem("nda-demo-decisions", JSON.stringify(log));
    } catch (e) {}
    return _json({ok:true});
  }
  return _json({error:"not found"}, 404);
};

<script>
const $ = s => document.querySelector(s);
const esc = s => (s ?? "").toString().replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let status = {}, samples = [], mode = "replay", current = {id:null,text:"",result:null};

async function j(url, opts){ const r = await fetch(url, opts); const d = await r.json(); if(!r.ok) throw new Error(d.error||r.statusText); return d; }

async function init(){
  status = await j("/api/status"); samples = await j("/api/samples");
  $("#meta").textContent = `Playbook v${status.playbook} · ${status.model}`;
  $("#m-live").title = status.live ? "" : "No API key set. Live mode is off.";
  setMode("replay"); fillPick();
}
function fillPick(){
  const list = mode==="replay" ? samples.filter(s=>s.replay) : samples;
  const pasteOpt = mode==="live" ? `<option value="__paste">Paste your own…</option>` : "";
  $("#pick").innerHTML = list.map(s=>`<option value="${s.id}">${s.id} · ${esc(s.counterparty)}</option>`).join("") + pasteOpt;
  if(!list.length) $("#pick").innerHTML = `<option value="">No saved runs yet</option>`;
  loadDoc();
}
function setMode(m){
  mode = m;
  $("#m-replay").setAttribute("aria-pressed", m==="replay"); $("#m-live").setAttribute("aria-pressed", m==="live");
  $("#go").disabled = (m==="live" && !status.live);
  fillPick();
}
$("#m-replay").onclick = ()=>setMode("replay");
$("#m-live").onclick = ()=>{ if(!status.live){ showErr("Live mode needs an API key. Set ANTHROPIC_API_KEY and restart the server."); return; } setMode("live"); };
$("#pick").onchange = loadDoc;

async function loadDoc(){
  const v = $("#pick").value;
  if(v==="__paste"){ $("#doc").hidden = true; $("#paste").hidden = false; current = {id:"PASTED",text:"",result:null}; return; }
  $("#paste").hidden = true; $("#doc").hidden = false;
  if(!v){ $("#doc").textContent = ""; return; }
  const d = await j("/api/contract/"+v); current = {id:v,text:d.text,result:null};
  $("#doc").textContent = d.text;
  $("#right").innerHTML = `<div class="panel empty">Press Review.</div>`;
}
function showErr(m){ $("#right").innerHTML = `<div class="err" role="alert">${esc(m)}</div>`; }

$("#go").onclick = async ()=>{
  const paste = !$("#paste").hidden;
  const text = paste ? $("#paste").value : current.text;
  $("#go").disabled = true; $("#right").innerHTML = `<div class="panel empty">${mode==="live"?"Reviewing. This takes a minute or two.":"Loading saved run…"}</div>`;
  try{
    const res = await j("/api/review", {method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({mode, id: paste?"PASTED":current.id, text})});
    current.result = res; if(paste){ current.text = text; }
    render(res);
  }catch(e){ showErr(e.message); }
  $("#go").disabled = (mode==="live" && !status.live);
};

const CHIP = {
  escalate:["red","For a lawyer"], deviation_draft:["amber","Draft ready"], acceptable:["green","Acceptable"], matches:["green","Matches"]
};
const LANE = {purple_ai:"Tool drafts", purple_human:"Your call first", orange:"Stays with a lawyer"};

function render(res){
  const f = res.findings;
  const shadow = f.filter(x=>x.shadow);
  const lawyer = f.filter(x=>x.verdict==="escalate" && !x.shadow);
  const drafts = f.filter(x=>x.verdict==="deviation_draft");
  const fine = f.filter(x=>x.verdict==="acceptable"||x.verdict==="matches");
  const odd = f.filter(x=>x.verdict==="escalate"&&x.shadow===false&&false);
  const sec = (title, arr, kind)=> arr.length ? `<div class="group"><h2>${title} (${arr.length})</h2>${arr.map(x=>card(x,kind)).join("")}</div>` : "";
  $("#right").innerHTML = `
    <div class="panel summary">
      <div><b>${shadow.length+lawyer.length}</b> need a lawyer</div>
      <div><b>${drafts.length}</b> with a draft</div>
      <div><b>${fine.length}</b> fine</div>
      <div class="note" style="flex-basis:100%">${esc(res.summary||"")} ${res.contract_type&&res.contract_type!=="mutual_nda"?`<b>Type: ${esc(res.contract_type)}.</b>`:""} ${res.parties_ok===false?"<b>Check the party details.</b>":""}</div>
    </div>
    ${sec("Your call first", shadow, "shadow")}
    ${sec("For a lawyer", lawyer, "lawyer")}
    ${sec("Draft ready", drafts, "draft")}
    ${sec("Fine", fine, "fine")}`;
  highlight(f);
  document.querySelectorAll(".card").forEach(c=>c.addEventListener("click", ()=>focusQuote(+c.dataset.i)));
  wire(res);
}
let idx = 0;
function card(x,kind){
  const i = current.result.findings.indexOf(x); const [col,label] = CHIP[x.verdict];
  const lane = `<span class="chip grey">${LANE[x.lane]||x.lane}</span>`;
  const sev = `<span class="chip grey">${x.severity}</span>`;
  const head = `<div class="row"><span class="clause">Clause ${esc(x.clause_no||"?")}</span><span>${esc(x.topic)}</span>${kind==="shadow"?`<span class="chip purple">Your call first</span>`:`<span class="chip ${col}">${label}</span>`}${sev}${kind==="fine"?"":lane}</div>`;
  const quote = x.quote ? `<div class="quote">“${esc(x.quote)}”</div>` : "";
  if(kind==="shadow"){
    return `<div class="card shadow" data-i="${i}">${head}${quote}
      <div class="note">Read the clause, then decide. The tool's view appears after you choose.</div>
      <div class="actions" data-shadow="${i}">
        <button data-d="deviation">Deviation</button><button data-d="acceptable">Acceptable</button><button data-d="matches">Matches</button>
      </div><div class="reveal" id="rv${i}"></div></div>`;
  }
  const why = x.why ? `<div class="why">${esc(x.why)}</div>` : "";
  const cite = x.fallback_cited ? `<div class="note">Fallback used: ${esc(x.fallback_cited)}</div>` : "";
  const routing = (x.routing_notes||[]).map(n=>`<div class="note">${esc(n)}</div>`).join("");
  const req = x.request_answer ? `<div class="note"><b>Known request ${esc(x.request_id)}.</b> ${esc(x.request_answer)}</div>` : "";
  let extra = "";
  if(kind==="draft"){
    extra = `<textarea class="edit" aria-label="Redline for clause ${esc(x.clause_no)}" id="dr${i}">${esc(x.draft_redline||"")}</textarea>
      ${x.note_to_counterparty?`<div class="note">Note to counterparty</div><textarea class="edit" id="nt${i}" style="min-height:60px">${esc(x.note_to_counterparty)}</textarea>`:""}
      <div class="actions" data-draft="${i}"><button class="primary" data-a="approve">Approve draft</button><button data-a="lawyer">Send to a lawyer</button></div><div class="reveal" id="rv${i}"></div>`;
  }
  return `<div class="card ${x.verdict}" data-i="${i}">${head}${quote}${why}${cite}${routing}${req}${extra}</div>`;
}
function wire(res){
  document.querySelectorAll("[data-shadow]").forEach(box=>{
    const i = +box.dataset.shadow, x = res.findings[i];
    box.querySelectorAll("button").forEach(b=>b.onclick=async e=>{
      e.stopPropagation();
      const d = b.dataset.d, agree = d===x.ai_verdict;
      box.hidden = true;
      $("#rv"+i).innerHTML = `<div class="done">You said ${d}. The tool said ${x.ai_verdict} (${Math.round(x.confidence*100)}% sure): ${agree?"agreed.":"you differ. Your call stands."}</div>
        ${x.why?`<div class="why">${esc(x.why)}</div>`:""}
        ${x.draft_redline?`<div class="note">Tool's draft (not applied)</div><textarea class="edit" id="dr${i}">${esc(x.draft_redline)}</textarea>`:""}`;
      log(res, x, {lawyer_decision:d, action: agree?"agree":"disagree"});
    });
  });
  document.querySelectorAll("[data-draft]").forEach(box=>{
    const i = +box.dataset.draft, x = res.findings[i];
    box.querySelectorAll("button").forEach(b=>b.onclick=e=>{
      e.stopPropagation(); const a = b.dataset.a; box.hidden = true;
      $("#rv"+i).innerHTML = `<div class="done">${a==="approve"?"Approved. Nothing is sent from here.":"Sent to a lawyer."}</div>`;
      log(res, x, {lawyer_decision:null, action:a});
    });
  });
}
function log(res, x, extra){
  fetch("/api/decision",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({contract:current.id, clause_no:x.clause_no, rule_id:x.rule_id, ai_verdict:x.ai_verdict, ...extra})});
}
function highlight(f){
  const doc = $("#doc"), t = current.text; let html = "", pos = 0;
  const spans = [];
  f.forEach((x,i)=>{ if(!x.quote) return; let q = x.quote, p = t.indexOf(q);
    if(p<0){ q = q.slice(0,50); p = t.indexOf(q); }
    if(p>=0) spans.push([p, p+(p>=0&&q===x.quote?x.quote.length:q.length), i]); });
  spans.sort((a,b)=>a[0]-b[0]);
  for(const [s,e,i] of spans){ if(s<pos) continue; html += esc(t.slice(pos,s)) + `<mark id="q${i}">${esc(t.slice(s,e))}</mark>`; pos = e; }
  doc.innerHTML = html + esc(t.slice(pos));
}
function focusQuote(i){
  document.querySelectorAll("#doc mark.on").forEach(m=>m.classList.remove("on"));
  const m = document.getElementById("q"+i); if(m){ m.classList.add("on"); m.scrollIntoView({block:"center",behavior:"smooth"}); }
}
init();
</script>
