<style>
/* Hallmark · genre: modern-minimal · macrostructure: document editor (page on canvas, margin cards) · theme: custom (vibe: "familiar document editor in suggesting mode") · enrichment: none · nav: title bar + toolbar, NDA drawer · footer: none
 * light only, on purpose: canvas oklch(98.3% 0.002 250) · page white · accent oklch(56% 0.19 258) editor blue · Roboto UI, Arial page text
 * counterparty changes render as suggestions (green text, underline or strike); review notes anchor as yellow highlights with cards in the margin
 * pre-emit critique: P4 H5 E4 S5 R5 V4
 */
/* Layout: a white page on a grey canvas, like a word processor; review cards sit in the right margin. The NDA list is a drawer. Under 1100px page and cards share the screen with tabs. */
:root {
  color-scheme: light;
  --bg: oklch(98.3% 0.002 250);          /* grey canvas */
  --surface: oklch(100% 0 0);            /* the page and cards */
  --surface-2: oklch(96.2% 0.003 250);   /* toolbar, hover */
  --ink: oklch(23% 0.005 265);
  --ink-2: oklch(49% 0.01 260);
  --ink-3: oklch(62% 0.01 260);
  --line: oklch(89.5% 0.005 260);
  --line-strong: oklch(80% 0.008 260);
  --accent: oklch(56% 0.19 258);         /* editor blue */
  --accent-soft: oklch(95% 0.025 258);
  --accent-ink: oklch(100% 0 0);
  --focus: oklch(56% 0.19 258);
  --red: oklch(55% 0.19 27);
  --amber: oklch(64% 0.15 60);
  --green: oklch(52% 0.13 150);
  --violet: oklch(53% 0.21 305);
  --mark: oklch(95% 0.06 92);            /* review note anchor */
  --mark-on: oklch(88% 0.14 88);
  --ins: oklch(52% 0.13 150);            /* counterparty suggestion */
  --del: oklch(52% 0.13 150);

  --font-ui: "Roboto", Arial, Helvetica, sans-serif;
  --font-mono: "Roboto Mono", ui-monospace, Consolas, monospace;
  --font-doc: Arial, Helvetica, "Liberation Sans", sans-serif;

  --text-xs: 0.75rem; --text-sm: 0.8125rem; --text-md: 0.875rem; --text-lg: 1.125rem; --text-xl: 1.375rem;
  --space-3xs: 0.25rem; --space-2xs: 0.5rem; --space-xs: 0.75rem; --space-sm: 1rem; --space-md: 1.5rem; --space-lg: 2rem;
  --radius-sm: 4px; --radius: 8px;
  --shadow: 0 1px 2px oklch(30% 0.01 260 / 0.3), 0 1px 3px 1px oklch(30% 0.01 260 / 0.15);
  --shadow-page: 0 1px 3px oklch(30% 0.01 260 / 0.15), 0 0 0 1px oklch(30% 0.01 260 / 0.05);
  --shadow-lg: 0 4px 8px 3px oklch(30% 0.01 260 / 0.15), 0 1px 3px oklch(30% 0.01 260 / 0.3);
  --scrim: oklch(23% 0.005 265 / 0.32);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-short: 140ms;
}
body { background: var(--bg); color: var(--ink); }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; overflow-x: clip; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); font-size: var(--text-md); line-height: 1.5;
  display: grid; grid-template-rows: auto minmax(0, 1fr);
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.mono { font-family: var(--font-mono); }
.tnum { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0ms !important; scroll-behavior: auto !important; } }

/* top bar */
.top {
  display: flex; align-items: center; gap: var(--space-xs);
  padding-block: var(--space-2xs);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--surface); min-height: 3.25rem;
}
.brand { display: flex; align-items: center; gap: var(--space-2xs); font-weight: 600; white-space: nowrap; }
.brand-mark { width: 1.75rem; height: 2.125rem; border-radius: 3px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); font-size: var(--text-xs); font-weight: 600; }
.badge { font-size: var(--text-xs); font-weight: 500; color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 0.1rem 0.5rem; white-space: nowrap; }
.top .meta { margin-left: auto; color: var(--ink-3); font-size: var(--text-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.switch { display: flex; align-items: center; gap: 2px; min-width: 0; }
.switch .btn { padding-inline: 0.55rem; }
.nda-btn { display: inline-flex; align-items: center; gap: var(--space-2xs); min-width: 0; }
.nda-btn .mono { font-weight: 500; }
.nda-btn .sub { color: var(--ink-3); font-weight: 400; }
.nda-btn .caret { color: var(--ink-3); }

/* shell */
.shell { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 30rem); min-height: 0; }
.pane { min-height: 0; min-width: 0; display: flex; flex-direction: column; }
.scroll { overflow-y: auto; min-height: 0; flex: 1; }

/* queue */
.queue {
  position: fixed; inset: 0 auto 0 0; z-index: 20; width: min(24rem, 100vw);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px);
  background: var(--surface); border-right: 1px solid var(--line); box-shadow: var(--shadow-lg);
  transform: translateX(-100%); visibility: hidden;
  transition: transform 220ms var(--ease-out), visibility 0s linear 220ms;
}
body[data-drawer="open"] .queue { transform: none; visibility: visible; transition: transform 220ms var(--ease-out); }
.scrim { position: fixed; inset: 0; z-index: 19; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity 220ms var(--ease-out); }
body[data-drawer="open"] .scrim { opacity: 1; pointer-events: auto; }
.q-title { display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: var(--text-sm); }
.q-head { padding: var(--space-xs); display: grid; gap: var(--space-2xs); border-bottom: 1px solid var(--line); }
.search { width: 100%; padding: 0.45rem 0.65rem; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--bg); font-size: var(--text-sm); }
.search::placeholder { color: var(--ink-3); }
.q-stats { display: flex; justify-content: space-between; font-size: var(--text-xs); color: var(--ink-3); }
.q-list { list-style: none; margin: 0; padding: var(--space-2xs); display: grid; gap: 2px; }
.q-item {
  width: 100%; text-align: left; border: 0; background: transparent; border-radius: var(--radius-sm);
  padding: var(--space-2xs) var(--space-xs); display: grid; gap: var(--space-3xs);
  transition: background-color var(--dur-short) var(--ease-out);
}
.q-item:hover { background: var(--surface-2); }
.q-item:active { background: var(--line); }
.q-item[aria-current="true"] { background: var(--accent-soft); }
.q-row { display: flex; align-items: center; gap: var(--space-2xs); }
.q-id { font-family: var(--font-mono); font-size: var(--text-sm); font-weight: 500; }
.q-paper { font-size: var(--text-xs); color: var(--ink-3); }
.q-sum { font-size: var(--text-sm); color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.q-counts { margin-left: auto; display: flex; gap: var(--space-2xs); font-size: var(--text-xs); font-family: var(--font-mono); }
.q-counts span { display: inline-flex; align-items: center; gap: 0.25rem; }
.dot { width: 0.45rem; height: 0.45rem; border-radius: 50%; background: currentColor; display: inline-block; flex: none; }
.q-progress { font-size: var(--text-xs); color: var(--ink-3); }
.q-progress.done { color: var(--green); }
.q-empty { padding: var(--space-md) var(--space-sm); color: var(--ink-3); font-size: var(--text-sm); }
.q-foot { padding: var(--space-xs); border-top: 1px solid var(--line); font-size: var(--text-xs); color: var(--ink-3); }

/* tabs (narrow only) */
.tabs { display: none; gap: 2px; padding: var(--space-2xs) var(--space-xs) 0; border-bottom: 1px solid var(--line); background: var(--surface); }
.tabs button { border: 0; background: transparent; padding: var(--space-2xs) var(--space-xs); border-bottom: 2px solid transparent; color: var(--ink-2); font-size: var(--text-sm); font-weight: 500; white-space: nowrap; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

/* contract */
.contract { background: var(--bg); }
.doc-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2xs) var(--space-sm); margin: var(--space-2xs) var(--space-sm) 0; padding: 0.4rem var(--space-sm); border-radius: 999px; background: var(--surface-2); font-size: var(--text-sm); color: var(--ink-2); }
.mode { display: inline-flex; align-items: center; gap: 0.35rem; color: var(--green); font-weight: 500; white-space: nowrap; }
.doc-head b { color: var(--ink); font-weight: 600; }
#doc {
  margin: var(--space-sm) auto var(--space-lg); padding: 4.5rem 5rem 6rem; white-space: pre-wrap; overflow-wrap: anywhere;
  background: var(--surface); box-shadow: var(--shadow-page); color: var(--ink);
  font-family: var(--font-doc); font-size: 1rem; line-height: 1.7; max-width: 51rem; min-height: 66rem;
}
#doc mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; transition: background-color var(--dur-short) var(--ease-out); }
#doc mark.on { background: var(--mark-on); box-shadow: 0 2px 0 var(--amber); }
.quote .ins { color: var(--ins); }
.quote .del { color: var(--del); text-decoration: line-through; }
.quote .comment { font-family: var(--font-ui); font-size: 0.9em; background: var(--surface-2); border-radius: 4px; padding: 0 0.3em; }
.quote .cmt-l { font-weight: 600; margin-right: 0.3em; }
#doc .ins { color: var(--ins); }
#doc .del { color: var(--del); text-decoration: line-through; text-decoration-thickness: 1px; }
#doc .comment { font-family: var(--font-ui); font-size: 0.8125em; color: var(--ink-2); background: var(--surface-2); border-radius: 4px; padding: 0.05em 0.35em; }
#doc .cmt-l { font-weight: 600; margin-right: 0.35em; color: var(--ink); }
.legend { margin-left: auto; display: flex; flex-wrap: wrap; gap: var(--space-2xs) var(--space-sm); font-size: var(--text-xs); }
.legend span { white-space: nowrap; }
.legend .ins { color: var(--ins); }
.legend .del { color: var(--del); text-decoration: line-through; }
.legend .hl { background: var(--mark); padding: 0 0.25em; border-radius: 2px; }

/* findings */
.findings { background: var(--bg); }
.f-inner { padding: var(--space-sm); display: grid; gap: var(--space-sm); align-content: start; }
.overview { background: var(--surface); border-radius: var(--radius); padding: var(--space-sm); display: grid; gap: var(--space-xs); box-shadow: var(--shadow); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-xs); }
.stat { display: grid; gap: 0.1rem; }
.stat b { font-size: var(--text-xl); font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: var(--text-xs); color: var(--ink-2); display: flex; align-items: center; gap: 0.35rem; }
.overview p { margin: 0; font-size: var(--text-sm); color: var(--ink-2); }
.warn { font-size: var(--text-sm); color: var(--red); font-weight: 500; }
.bar { display: flex; height: 6px; border-radius: 999px; overflow: hidden; gap: 2px; background: var(--surface-2); }
.bar i { display: block; }

.group { display: grid; gap: var(--space-2xs); }
.group-h { display: flex; align-items: baseline; gap: var(--space-2xs); margin: 0; font-size: var(--text-sm); font-weight: 600; }
.group-h .n { color: var(--ink-3); font-weight: 500; font-family: var(--font-mono); font-size: var(--text-xs); }
.group-h small { margin-left: auto; color: var(--ink-3); font-weight: 400; font-size: var(--text-xs); }
details.group > summary { list-style: none; cursor: pointer; }
details.group > summary::-webkit-details-marker { display: none; }
details.group > summary .chev { display: inline-block; transition: transform var(--dur-short) var(--ease-out); color: var(--ink-3); }
details.group[open] > summary .chev { transform: rotate(90deg); }

.card { background: var(--surface); border-radius: var(--radius); padding: var(--space-xs) var(--space-sm); display: grid; gap: var(--space-2xs); position: relative; box-shadow: var(--shadow); transition: transform var(--dur-short) var(--ease-out), box-shadow var(--dur-short) var(--ease-out); }
.c-who { display: flex; align-items: center; gap: var(--space-2xs); min-width: 0; }
.av { flex: none; width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-size: var(--text-xs); font-weight: 500; }
.c-who-t { display: grid; min-width: 0; line-height: 1.3; }
.c-who-t b { font-weight: 500; font-size: var(--text-sm); }
.c-who-t span { font-size: var(--text-xs); color: var(--ink-2); overflow-wrap: anywhere; }
.card.k-shadow { --k: var(--violet); } .card.k-lawyer { --k: var(--red); } .card.k-draft { --k: var(--amber); } .card.k-fine { --k: var(--green); }
.card.is-on { box-shadow: var(--shadow-lg); transform: translateX(-6px); }
.c-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3xs) var(--space-2xs); }
.c-clause { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--ink-2); background: var(--surface-2); border-radius: 4px; padding: 0.05rem 0.35rem; white-space: nowrap; }
.c-topic { font-weight: 600; font-size: var(--text-sm); min-width: 0; }
.c-tags { display: flex; flex-wrap: wrap; gap: var(--space-3xs); }
.tag { font-size: var(--text-xs); font-weight: 500; padding: 0.05rem 0.45rem; border-radius: 999px; white-space: nowrap; color: var(--ink-2); background: var(--surface-2); }
.tag.c { color: var(--ink); background: color-mix(in oklch, var(--c) 16%, transparent); }
.tag.c::before { content: ""; display: inline-block; width: 0.4rem; height: 0.4rem; border-radius: 50%; background: var(--c); margin-right: 0.3rem; vertical-align: 0.05em; }
.t-red { --c: var(--red); } .t-amber { --c: var(--amber); } .t-green { --c: var(--green); } .t-violet { --c: var(--violet); }
.quote { margin: 0; font-family: var(--font-doc); font-size: var(--text-sm); color: var(--ink-2); border-left: 2px solid var(--line-strong); padding-left: var(--space-xs); overflow-wrap: anywhere; }
.why { margin: 0; font-size: var(--text-sm); }
.note { margin: 0; font-size: var(--text-xs); color: var(--ink-2); }
.note b { font-weight: 600; color: var(--ink); }
.field { display: grid; gap: var(--space-3xs); }
.field label { font-size: var(--text-xs); color: var(--ink-2); font-weight: 500; }
textarea { width: 100%; min-height: 5.5rem; padding: var(--space-2xs); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--bg); font-family: var(--font-doc); font-size: var(--text-sm); line-height: 1.6; resize: vertical; }
textarea.short { min-height: 3.75rem; font-family: var(--font-ui); }
textarea:hover { border-color: var(--ink-3); }
textarea[readonly] { color: var(--ink-2); }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2xs); }
.actions .lead { font-size: var(--text-xs); color: var(--ink-2); flex-basis: 100%; }
.btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--radius-sm); color: var(--accent); padding: 0.35rem 0.75rem; font-size: var(--text-sm); font-weight: 500; white-space: nowrap; transition: background-color var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out); }
.btn:hover { background: var(--surface-2); border-color: var(--ink-3); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: color-mix(in oklch, var(--accent) 88%, var(--ink)); box-shadow: var(--shadow); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); padding-inline: var(--space-2xs); }
.btn.ghost:disabled { color: var(--ink-3); }
.nda-btn { color: var(--ink); }
.btn.ghost:hover { background: var(--surface-2); }
.done { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2xs); font-size: var(--text-sm); font-weight: 500; color: var(--green); }
.done.differ { color: var(--amber); }
.err { padding: var(--space-sm); border-radius: var(--radius); background: color-mix(in oklch, var(--red) 12%, var(--surface)); color: var(--ink); }

/* responsive */
@media (max-width: 1100px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .work { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .tabs { display: flex; }
  .findings { border-left: 0; }
  .work[data-tab="doc"] .findings, .work[data-tab="findings"] .contract { display: none; }
}
@media (min-width: 1101px) { .work { display: contents; } }
@media (max-width: 760px) {
  .top { gap: var(--space-2xs); }
  .brand-name, .badge, .nda-btn .sub { display: none; }
  .top .meta { display: none; }
  #doc { margin: var(--space-2xs) 0 0; padding: var(--space-md) max(16px, env(safe-area-inset-right, 0px)) var(--space-lg) max(16px, env(safe-area-inset-left, 0px)); min-height: 0; box-shadow: none; }
  .doc-head { margin-inline: 8px; }
  .legend { margin-left: 0; }
  .f-inner { padding-inline: max(12px, env(safe-area-inset-left, 0px)) max(12px, env(safe-area-inset-right, 0px)); }
}
</style>

<header class="top">
  <div class="brand"><span class="brand-mark" aria-hidden="true">N</span><span class="brand-name">NDA review</span></div>
  <span class="badge">Demo</span>
  <div class="switch">
    <button class="btn ghost" id="prev" type="button" aria-label="Previous NDA">‹</button>
    <button class="btn nda-btn" id="pickbtn" type="button" aria-haspopup="dialog" aria-controls="drawer" aria-expanded="false"></button>
    <button class="btn ghost" id="next" type="button" aria-label="Next NDA">›</button>
  </div>
  <span class="meta" id="meta"></span>
</header>

<div class="shell">
  <div class="scrim" id="scrim"></div>
  <nav class="pane queue" id="drawer" aria-label="All NDAs">
    <div class="q-head">
      <div class="q-title">All NDAs <button class="btn ghost" id="closedrawer" type="button" aria-label="Close the NDA list">✕</button></div>
      <label class="sr" for="search">Filter NDAs</label>
      <input class="search" id="search" type="search" placeholder="Filter by ID or text" autocomplete="off">
      <div class="q-stats tnum" id="qstats"></div>
    </div>
    <div class="scroll"><ul class="q-list" id="queue"></ul></div>
    <p class="q-foot">Saved AI reviews of 30 test NDAs, routed by the playbook rules. Nothing is sent anywhere. Your decisions stay in this browser.</p>
  </nav>

  <div class="work" id="work" data-tab="doc">

      <button type="button" role="tab" id="tab-doc" aria-selected="true" aria-controls="contract">Contract</button>

    </section>
    <section class="pane findings" id="findings" aria-label="Findings">
      <div class="scroll"><div class="f-inner" id="right" aria-live="polite"></div></div>
    </section>
  </div>
</div>

<script>
const DEMO = __DATA__;
(function () {
  const $ = s => document.querySelector(s);
  const esc = s => (s ?? "").toString().replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const LANE = { purple_ai: "Tool drafts", purple_human: "Your call first", orange: "Stays with a lawyer" };
  const VERB = { deviation: "Deviation", acceptable: "Acceptable", matches: "Matches" };
  const narrow = () => matchMedia("(max-width: 1100px)").matches;

  // decisions: { C01: { "4": {action, lawyer_decision, ts} } }, kept in this browser only
  const KEY = "nda-demo-v2-decisions";
  let decisions = {};
  try { decisions = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { decisions = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(decisions)); } catch (e) {} }
  function logEntry(entry) {
    try {
      const log = JSON.parse(localStorage.getItem("nda-demo-decisions") || "[]");
      log.push({ ts: new Date().toISOString(), ...entry });
      localStorage.setItem("nda-demo-decisions", JSON.stringify(log));
    } catch (e) {}
  }

  function split(res) {
    const f = res.findings;
    return {
      shadow: f.filter(x => x.shadow),
      lawyer: f.filter(x => x.verdict === "escalate" && !x.shadow),
      drafts: f.filter(x => x.verdict === "deviation_draft"),
      fine: f.filter(x => x.verdict === "acceptable" || x.verdict === "matches")
    };
  }
  function progress(id) {
    const res = DEMO.results[id]; if (!res) return { todo: 0, done: 0 };
    const g = split(res), d = decisions[id] || {};
    const actionable = [...g.shadow, ...g.drafts].map(x => res.findings.indexOf(x));
    const done = actionable.filter(i => d[i]).length;
    return { todo: actionable.length, done };
  }

  let current = null, filter = "";

  $("#meta").textContent = `Playbook v${DEMO.status.playbook} · ${DEMO.status.model} · confidence floor ${DEMO.status.threshold}`;

  function renderQueue() {
    const q = filter.trim().toLowerCase();
    const list = DEMO.samples.filter(s => !q || s.id.toLowerCase().includes(q) || (DEMO.results[s.id]?.summary || "").toLowerCase().includes(q));
    let totalTodo = 0, totalDone = 0;
    DEMO.samples.forEach(s => { const p = progress(s.id); totalTodo += p.todo; totalDone += p.done; });
    $("#qstats").innerHTML = `<span>${list.length} of ${DEMO.samples.length} NDAs</span><span>${totalDone} of ${totalTodo} decisions made</span>`;
    if (!list.length) { $("#queue").innerHTML = `<li class="q-empty">No NDA matches "${esc(filter)}". Clear the filter to see all 30.</li>`; return; }
    $("#queue").innerHTML = list.map(s => {
      const res = DEMO.results[s.id], g = split(res), p = progress(s.id);
      const need = g.shadow.length + g.lawyer.length;
      const prog = p.todo === 0 ? `<span class="q-progress">Nothing to decide</span>`
        : p.done === p.todo ? `<span class="q-progress done">All ${p.todo} decided</span>`
        : `<span class="q-progress">${p.done} of ${p.todo} decided</span>`;
      return `<li><button type="button" class="q-item" data-id="${s.id}" aria-current="${s.id === current}">
        <span class="q-row"><span class="q-id">${s.id}</span><span class="q-paper">${s.paper === "ours" ? "Our template" : "Their paper"}</span>
          <span class="q-counts tnum" aria-label="${need} for a lawyer, ${g.drafts.length} drafts, ${g.fine.length} fine">
            <span style="color:var(--red)"><i class="dot"></i>${need}</span><span style="color:var(--amber)"><i class="dot"></i>${g.drafts.length}</span><span style="color:var(--green)"><i class="dot"></i>${g.fine.length}</span>
          </span></span>
        <span class="q-sum">${esc(res.summary)}</span>
        ${prog}
      </button></li>`;
    }).join("");
  }

  $("#queue").addEventListener("click", e => { const b = e.target.closest(".q-item"); if (b) { open(b.dataset.id, true); closeDrawer(); } });
  function openDrawer() {
    document.body.dataset.drawer = "open"; $("#pickbtn").setAttribute("aria-expanded", "true");
    document.querySelector(`.q-item[data-id="${current}"]`)?.scrollIntoView({ block: "nearest" });
    setTimeout(() => $("#search").focus(), 50);
  }
  function closeDrawer() {
    if (document.body.dataset.drawer !== "open") return;
    document.body.dataset.drawer = ""; $("#pickbtn").setAttribute("aria-expanded", "false"); $("#pickbtn").focus();
  }
  $("#pickbtn").addEventListener("click", openDrawer);
  $("#closedrawer").addEventListener("click", closeDrawer);
  $("#scrim").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
  function step(d) {
    const i = DEMO.samples.findIndex(x => x.id === current), n = DEMO.samples[i + d];
    if (n) open(n.id, true);
  }
  $("#prev").addEventListener("click", () => step(-1));
  $("#next").addEventListener("click", () => step(1));
  $("#search").addEventListener("input", e => { filter = e.target.value; renderQueue(); });

  function setTab(t) {
    $("#work").dataset.tab = t;
    $("#tab-findings").setAttribute("aria-selected", String(t === "findings"));
    $("#tab-doc").setAttribute("aria-selected", String(t === "doc"));
  }
  $("#tab-findings").addEventListener("click", () => setTab("findings"));
  $("#tab-doc").addEventListener("click", () => setTab("doc"));

  function open(id, fromUser) {
    if (!DEMO.contracts[id]) return;
    current = id;
    try { localStorage.setItem("nda-demo-v2-last", id); } catch (e) {}
    if (fromUser) history.replaceState(null, "", "#" + id);
    renderQueue();
    document.querySelector(`.q-item[data-id="${id}"]`)?.scrollIntoView({ block: "nearest" });
    const res = DEMO.results[id], s = DEMO.samples.find(x => x.id === id), k = DEMO.samples.indexOf(s);
    $("#pickbtn").innerHTML = `<span class="mono">${id}</span><span class="sub">${s.paper === "ours" ? "Our template" : "Their paper"} · ${k + 1} of ${DEMO.samples.length}</span><span class="caret" aria-hidden="true">▾</span>`;
    $("#pickbtn").setAttribute("aria-label", `${id}, ${k + 1} of ${DEMO.samples.length}. Open the NDA list`);
    $("#prev").disabled = k === 0; $("#next").disabled = k === DEMO.samples.length - 1;
    $("#dochead").innerHTML = `<b class="mono">${id}</b><span>${s.paper === "ours" ? "Our template with their tracked changes" : "Their paper"}</span><span class="mode">✎ Suggesting · nothing is edited</span><span class="legend" id="legend"></span>`;
    if (!res) { $("#right").innerHTML = `<div class="err" role="alert">No saved review for ${esc(id)}. Pick another NDA.</div>`; highlight([]); return; }
    render(res);
    $("#docscroll").scrollTop = 0;
  }

  // Shows tracked-change markers in a quote as redline; a marker cut off by the quote's edge is dropped.
  function redline(q) {
    return esc(q)
      .replace(/\[\[(INS|DEL|COMMENT):\s?([\s\S]*?)\]\]/g, (m, k, body) => k === "COMMENT" ? `<span class="comment"><span class="cmt-l">Comment</span>${body}</span>` : `<span class="${k.toLowerCase()}">${body}</span>`)
      .replace(/\[\[(INS|DEL|COMMENT):\s?/g, "").replace(/\]\]/g, "");
  }
  function tag(cls, text) { return `<span class="tag ${cls ? "c " + cls : ""}">${esc(text)}</span>`; }

  function render(res) {
    const g = split(res), f = res.findings, n = f.length;
    const need = g.shadow.length + g.lawyer.length;
    const warn = [res.contract_type && res.contract_type !== "mutual_nda" ? `Type: ${esc(res.contract_type)}.` : "", res.parties_ok === false ? "Check the party details." : ""].filter(Boolean).join(" ");
    const seg = (arr, c) => arr.length ? `<i style="flex:${arr.length};background:var(${c})"></i>` : "";
    const sec = (title, arr, kind, hint) => arr.length ? `<section class="group" aria-label="${title}"><h2 class="group-h">${title} <span class="n">${arr.length}</span>${hint ? `<small>${hint}</small>` : ""}</h2>${arr.map(x => card(x, kind, f.indexOf(x))).join("")}</section>` : "";
    $("#right").innerHTML = `
      <div class="overview">
        <div class="stats">
          <div class="stat"><b>${need}</b><span><i class="dot" style="color:var(--red)"></i>Need a lawyer</span></div>
          <div class="stat"><b>${g.drafts.length}</b><span><i class="dot" style="color:var(--amber)"></i>With a draft</span></div>
          <div class="stat"><b>${g.fine.length}</b><span><i class="dot" style="color:var(--green)"></i>Fine</span></div>
        </div>
        <div class="bar" role="img" aria-label="${need} need a lawyer, ${g.drafts.length} with a draft, ${g.fine.length} fine, of ${n} findings">${seg(g.shadow, "--violet")}${seg(g.lawyer, "--red")}${seg(g.drafts, "--amber")}${seg(g.fine, "--green")}</div>
        <p>${esc(res.summary || "")}</p>
        ${warn ? `<div class="warn">${warn}</div>` : ""}
      </div>
      ${sec("Your call first", g.shadow, "shadow", "The tool's view stays hidden until you decide")}
      ${sec("For a lawyer", g.lawyer, "lawyer")}
      ${sec("Draft ready", g.drafts, "draft", "Edit, then approve")}
      ${g.fine.length ? `<details class="group"><summary class="group-h"><span class="chev" aria-hidden="true">›</span> Fine <span class="n">${g.fine.length}</span><small>Matches or fits a fallback</small></summary>${g.fine.map(x => card(x, "fine", f.indexOf(x))).join("")}</details>` : ""}
      ${n === 0 ? `<div class="overview"><p>The tool found no clauses to report for this NDA.</p></div>` : ""}`;
    highlight(f);
  }

  function card(x, kind, i) {
    const d = (decisions[current] || {})[i];
    const status = kind === "shadow" ? tag("t-violet", "Your call first")
      : kind === "lawyer" ? tag("t-red", "For a lawyer")
      : kind === "draft" ? tag("t-amber", "Draft ready")
      : tag("t-green", x.verdict === "matches" ? "Matches" : "Acceptable");
    const head = `<div class="c-who"><span class="av" aria-hidden="true">AI</span><span class="c-who-t"><b>Review assistant</b><span>Clause ${esc(x.clause_no || "?")} · ${esc(x.topic || "Unrecognised clause")}</span></span></div>
      <div class="c-tags">${status}${tag("", x.severity)}${kind === "fine" || kind === "shadow" ? "" : tag("", LANE[x.lane] || x.lane)}</div>`;
    const quote = x.quote ? `<p class="quote">“${redline(x.quote)}”</p>` : "";
    const show = x.quote ? `<button type="button" class="btn ghost" data-show="${i}">Show in contract</button>` : "";
    const why = x.why ? `<p class="why">${esc(x.why)}</p>` : "";
    const cite = x.fallback_cited ? `<p class="note">Fallback used: ${esc(x.fallback_cited)}</p>` : "";
    const routing = (x.routing_notes || []).map(t => `<p class="note">${esc(t)}</p>`).join("");
    const req = x.request_answer ? `<p class="note"><b>Known request ${esc(x.request_id)}.</b> ${esc(x.request_answer)}</p>` : "";

    if (kind === "shadow") {
      let body;
      if (d) {
        const agree = d.lawyer_decision === x.ai_verdict;
        body = `<div class="done ${agree ? "" : "differ"}">You said ${esc(VERB[d.lawyer_decision] || d.lawyer_decision)}. The tool said ${esc(VERB[x.ai_verdict] || x.ai_verdict)} (${Math.round(x.confidence * 100)}% sure): ${agree ? "agreed." : "you differ. Your call stands."}
            <button type="button" class="btn ghost" data-undo="${i}">Undo</button></div>
          ${why}
          ${x.draft_redline ? `<div class="field"><label for="dr${i}">Tool's draft (not applied)</label><textarea id="dr${i}" readonly>${esc(x.draft_redline)}</textarea></div>` : ""}`;
      } else {
        body = `<div class="actions" data-shadow="${i}"><span class="lead">Read the clause, then decide. The tool's view appears after you choose.</span>
          <button type="button" class="btn" data-d="deviation">Deviation</button><button type="button" class="btn" data-d="acceptable">Acceptable</button><button type="button" class="btn" data-d="matches">Matches</button></div>`;
      }
      return `<article class="card k-shadow" id="card${i}">${head}${quote}${body}<div class="actions">${show}</div></article>`;
    }

    let extra = "";
    if (kind === "draft") {
      const ro = d ? " readonly" : "";
      extra = `<div class="field"><label for="dr${i}">Redline for clause ${esc(x.clause_no)}</label><textarea id="dr${i}"${ro}>${esc(x.draft_redline || "")}</textarea></div>
        ${x.note_to_counterparty ? `<div class="field"><label for="nt${i}">Note to counterparty</label><textarea class="short" id="nt${i}"${ro}>${esc(x.note_to_counterparty)}</textarea></div>` : ""}
        ${d ? `<div class="done">${d.action === "approve" ? "Approved. Nothing is sent from here." : "Sent to a lawyer."}<button type="button" class="btn ghost" data-undo="${i}">Undo</button></div>`
            : `<div class="actions" data-draft="${i}"><button type="button" class="btn primary" data-a="approve">Approve draft</button><button type="button" class="btn" data-a="lawyer">Send to a lawyer</button>${show}</div>`}`;
      return `<article class="card k-draft" id="card${i}">${head}${quote}${why}${cite}${routing}${req}${extra}${d ? `<div class="actions">${show}</div>` : ""}</article>`;
    }
    return `<article class="card k-${kind}" id="card${i}">${head}${quote}${why}${cite}${routing}${req}${show ? `<div class="actions">${show}</div>` : ""}</article>`;
  }

  $("#right").addEventListener("click", e => {
    const res = DEMO.results[current]; if (!res) return;
    const showB = e.target.closest("[data-show]");
    if (showB) { focusQuote(+showB.dataset.show); return; }
    const undo = e.target.closest("[data-undo]");
    if (undo) {
      const i = +undo.dataset.undo, x = res.findings[i];
      if (decisions[current]) delete decisions[current][i];
      save(); logEntry({ contract: current, clause_no: x.clause_no, rule_id: x.rule_id, ai_verdict: x.ai_verdict, action: "undo" });
      rerenderKeep(i); return;
    }
    const sh = e.target.closest("[data-shadow] [data-d]");
    if (sh) {
      const i = +sh.closest("[data-shadow]").dataset.shadow, x = res.findings[i], dd = sh.dataset.d;
      const agree = dd === x.ai_verdict;
      record(i, x, { lawyer_decision: dd, action: agree ? "agree" : "disagree" }); return;
    }
    const dr = e.target.closest("[data-draft] [data-a]");
    if (dr) {
      const i = +dr.closest("[data-draft]").dataset.draft, x = res.findings[i];
      const redline = $("#dr" + i)?.value, note = $("#nt" + i)?.value;
      record(i, x, { lawyer_decision: null, action: dr.dataset.a, redline, note });
    }
  });

  function record(i, x, extra) {
    (decisions[current] = decisions[current] || {})[i] = { ...extra, ts: new Date().toISOString() };
    save();
    logEntry({ contract: current, clause_no: x.clause_no, rule_id: x.rule_id, ai_verdict: x.ai_verdict, ...extra });
    rerenderKeep(i);
  }
  function rerenderKeep(i) {
    const sc = $("#findings .scroll"), top = sc.scrollTop;
    const fineOpen = document.querySelector("#right details.group")?.open;
    render(DEMO.results[current]); renderQueue();
    const det = document.querySelector("#right details.group"); if (det && fineOpen) det.open = true;
    sc.scrollTop = top;
    const target = document.querySelector(`#card${i} [data-undo], #card${i} [data-d], #card${i} [data-a]`);
    if (target) target.focus({ preventScroll: true });
  }

  const CHANGE = /\[\[(INS|DEL|COMMENT):\s?([\s\S]*?)\]\]/g;
  function changesIn(t) {
    const out = []; let m; CHANGE.lastIndex = 0;
    while ((m = CHANGE.exec(t))) {
      const colon = m[0].indexOf(":") + 1, cs = m.index + colon + (m[0][colon] === " " ? 1 : 0);
      out.push({ s: m.index, e: m.index + m[0].length, cs, ce: m.index + m[0].length - 2, k: m[1].toLowerCase() });
    }
    return out;
  }
  // Renders the contract with findings marked and tracked changes shown as redline. Quotes are matched on the raw text.
  function highlight(f) {
    const t = DEMO.contracts[current] || ""; const marks = [];
    f.forEach((x, i) => {
      if (!x.quote) return; let q = x.quote, p = t.indexOf(q);
      if (p < 0) { q = q.slice(0, 50); p = t.indexOf(q); }
      if (p >= 0) marks.push([p, p + q.length, i]);
    });
    marks.sort((a, b) => a[0] - b[0]);
    const kept = []; let last = 0;
    for (const m of marks) { if (m[0] >= last) { kept.push(m); last = m[1]; } }
    const changes = changesIn(t);
    const pts = new Set([0, t.length]);
    kept.forEach(([a, b]) => { pts.add(a); pts.add(b); });
    changes.forEach(c => { pts.add(c.s); pts.add(c.cs); pts.add(c.ce); pts.add(c.e); });
    const P = [...pts].sort((a, b) => a - b), seen = new Set(); let html = "";
    for (let k = 0; k < P.length - 1; k++) {
      const a = P[k], b = P[k + 1]; if (a === b) continue;
      const c = changes.find(c => a >= c.s && b <= c.e);
      if (c && (a < c.cs || a >= c.ce)) continue; // marker syntax is not shown
      let seg = esc(t.slice(a, b));
      if (c) seg = `<span class="${c.k}">${c.k === "comment" && a === c.cs ? '<span class="cmt-l">Comment</span>' : ""}${seg}</span>`;
      const mk = kept.find(([s2, e2]) => a >= s2 && b <= e2);
      if (mk) { const i = mk[2]; seg = `<mark class="q${i}"${seen.has(i) ? "" : ` id="q${i}"`}>${seg}</mark>`; seen.add(i); }
      html += seg;
    }
    $("#doc").innerHTML = html;
    const hasIns = changes.some(c => c.k === "ins"), hasDel = changes.some(c => c.k === "del");
    const lg = $("#legend"); if (lg) lg.innerHTML = (hasIns ? '<span class="ins">Their insertion</span>' : "") + (hasDel ? '<span class="del">Their deletion</span>' : "") + (kept.length ? '<span class="hl">Review note</span>' : "");
  }
  function focusQuote(i) {
    document.querySelectorAll("#doc mark.on").forEach(m => m.classList.remove("on"));
    document.querySelectorAll("#doc .q" + i).forEach(m => m.classList.add("on"));
    document.querySelectorAll(".card.is-on").forEach(c => c.classList.remove("is-on"));
    $("#card" + i)?.classList.add("is-on");
    if (narrow()) setTab("doc");
    const m = document.getElementById("q" + i);
    if (m) {
      const smooth = !matchMedia("(prefers-reduced-motion: reduce)").matches;
      m.scrollIntoView({ block: "center", behavior: smooth ? "smooth" : "auto" });
    }
  }

  // start: hash, then last viewed, then the first NDA
  let start = (/^#(C\d\d)$/.exec(location.hash) || [])[1];
  if (!start) { try { start = localStorage.getItem("nda-demo-v2-last"); } catch (e) {} }
  if (!start || !DEMO.contracts[start]) start = DEMO.samples[0].id;
  open(start, false);
})();
</script>
